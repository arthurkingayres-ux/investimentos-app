                    <span class="proj-decomp__seg" :class="'proj-decomp__seg--' + p.chave" :style="'width:' + p.pct + '%'"></span>
                  </template>
                </div>
                <table class="proj-tabela proj-tabela--decomp">
                  <caption class="sr-only" x-text="'De onde vem o valor aos ' + projecao.idade_final"></caption>
                  <tbody>
                    <template x-for="p in projDecomposicao()" :key="p.chave">
                      <tr><th scope="row"><span class="proj-decomp__marca" :class="'proj-decomp__seg--' + p.chave" aria-hidden="true"></span><span x-text="p.rotulo"></span></th>
                        <td class="proj-num" x-text="formatBrlCompacto(p.valor)"></td></tr>
                    </template>
                  </tbody>
                </table>
                <details class="proj-conta"><summary>ver a conta</summary>
                  <div class="proj-conta__corpo">
                    <p>Patrimônio de hoje, <span x-text="formatBrlInteiro(projecao.partida.patrimonio)"></span>, crescido à taxa do capítulo 3 até <span x-text="projecao.ano_final"></span>.
                      Aportes: <span x-text="formatBrlInteiro(projecao.aporte.mensal)"></span> por mês, somados sem rendimento.
                      O rendimento dos aportes é o que falta para fechar o total.</p>
                  </div></details>
              </div>
            </section>

            <!-- 5. O que mexe o ponteiro (7a.AY: uma linha por alavanca, mediana à
                 esquerda e Δ à direita; direção em texto, seta aria-hidden e cor). -->
            <section class="proj-cap" data-cap="5" aria-labelledby="proj-cap-5">
              <p class="proj-cap__ordinal" aria-hidden="true">5</p>
              <h2 class="proj-cap__titulo" id="proj-cap-5">O que mexe o ponteiro</h2>
              <p class="proj-cap__texto">Quanto a mediana aos <span x-text="projecao.idade_final"></span> muda com cada alavanca. Os cenários com nome próprio são hipotéticos, não previsões.</p>
              <ul class="proj-ponteiro">
                <template x-for="a in projAlavancas()" :key="a.nome">
                  <li class="proj-ponteiro__item">
                    <p class="proj-ponteiro__nome" x-text="a.nome"></p>
                    <template x-if="a.descricao"><p class="proj-ponteiro__desc" x-text="a.descricao"></p></template>
                    <p class="proj-ponteiro__efeito">
                      <span class="proj-ponteiro__mediana">mediana <span class="proj-num" x-text="formatBrlCompacto(a.p50)"></span></span>
                      <span class="proj-num proj-delta" :class="Number.isFinite(a.delta) ? (a.delta < 0 ? 'proj-neg' : 'proj-pos') : ''"><template x-if="Number.isFinite(a.delta)"><span aria-hidden="true" x-text="a.delta < 0 ? '▼ ' : '▲ '"></span></template><span x-text="formatDeltaCompacto(a.delta)"></span></span>
                    </p>
                  </li>
                </template>
              </ul>
            </section>

            <!-- 6. O que esta conta não inclui -->
            <section class="proj-cap" data-cap="6" aria-labelledby="proj-cap-6">
              <p class="proj-cap__ordinal" aria-hidden="true">6</p>
              <h2 class="proj-cap__titulo" id="proj-cap-6">O que esta conta não inclui</h2>
              <ul class="proj-limites">
                <li><strong>Imposto sobre o ganho.</strong> O número é o valor de mercado do patrimônio, antes do imposto que você pagaria ao vender.</li>
                <li><strong>Rebalancear custa.</strong> Vender para voltar à alocação gera imposto e custos, que a conta não desconta.</li>
                <li><strong>Premissas de 10 a 15 anos.</strong> A conta as aplica aos <span x-text="projAnosTotal()"></span> anos inteiros, que é a prática comum, mas ninguém publica premissa para tanto tempo.</li>
                <template x-for="c in projHistoricas()" :key="c.classe">
                  <li><strong x-text="c.rotulo + ':'"></strong> histórico <span x-text="c.periodo"></span>.</li>
                </template>
                <li><strong>Renda-alvo.</strong> Quanto você quer gastar por mês na aposentadoria fica fora desta conta, por decisão sua.</li>
              </ul>
            </section>

            <!-- "Ver a conta" final: os cinco percentis nos marcos, as correlações
                 usadas e o número de trajetórias. Correlações em lista de pares:
                 a matriz 6 × 6 não cabe a 320 px. -->
            <details class="proj-conta proj-conta--final"><summary>ver a conta</summary>
              <div class="proj-conta__corpo">
                <p x-show="projMarcos().length">Cada valor é aquele abaixo do qual fica essa fração dos cenários: p10 é 1 em 10, p90 é 9 em 10. Em reais de hoje.</p>
                <p class="proj-nota" x-show="!projMarcos().length" x-cloak>Não há idade futura para a tabela dos percentis.</p>
                <!-- Um tbody por percentil, como a tabela por classe do cap. 3: o
                     rótulo em linha própria e os três valores embaixo. Com o rótulo
                     como 1ª coluna a tabela pedia ~256 px de largura mínima na
                     DejaVu do Linux, num espaço de 232 a 320 px. -->
                <table class="proj-tabela proj-tabela--percentis" x-show="projMarcos().length">
                  <caption class="sr-only">Os cinco percentis em cada idade, em reais de hoje</caption>
                  <thead><tr><template x-for="m in projMarcos()" :key="m.idade"><th scope="col" :id="'proj-perc-m-' + m.idade" x-text="m.idade + ' anos'"></th></template></tr></thead>
                  <template x-for="p in projPercentis()" :key="p.k">
                    <tbody class="proj-percentil">
                      <tr class="proj-percentil__nome"><th scope="rowgroup" :id="'proj-perc-' + p.k" :colspan="projMarcos().length" x-text="p.rotulo"></th></tr>
                      <tr class="proj-percentil__valores"><template x-for="m in projMarcos()" :key="m.idade"><td class="proj-num" :headers="'proj-perc-' + p.k + ' proj-perc-m-' + m.idade" x-text="formatBrlCompacto(m[p.k]).replace('R$ ', '')"></td></template></tr>
                    </tbody>
                  </template>
                </table>
                <p>Correlação entre as classes, usada para sortear os anos juntos:</p>
                <table class="proj-tabela proj-tabela--correl">
                  <caption class="sr-only">Correlação entre cada par de classes</caption>
                  <tbody>
                    <template x-for="c in projCorrelacoes()" :key="c.chave">
                      <tr><th scope="row" x-text="c.nome"></th><td class="proj-num" x-text="projFmtRho(c.rho)"></td></tr>
                    </template>
                  </tbody>
                </table>
                <p><span class="proj-num" x-text="projecao.trajetorias.toLocaleString('pt-BR')"></span> trajetórias simuladas, cada uma um cenário de <span x-text="projAnosTotal()"></span> anos.</p>
              </div></details>

            <!-- 7a.BJ.2: link cruzado, discreto, para a renda (só com o bloco publicado). -->
            <a class="renda-link" href="#/raiox/renda" x-show="renda" x-cloak>Quanto esta carteira pagaria de renda <span aria-hidden="true">›</span></a>
            <p class="proj-rodape" x-text="projecao.trajetorias.toLocaleString('pt-BR') + ' trajetórias · recalculada toda noite · projeção, não promessa'"></p>
          </article>
        </template>
      </section>

      <!-- ── Tela #/raiox/renda (7a.BJ.2) ── -->
      <!-- Push child da tab Raio-X, irmã da projeção e da mesma família "ensaio":
           coluna única, sem cards, separação tipográfica. Mono só no herói. -->
      <section class="tela-detalhes tela-renda" x-show="rota === 'renda'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        aria-labelledby="renda-titulo" x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent" id="renda-titulo">Renda</h1>
        </header>

        <template x-if="!renda">
          <p class="placeholder">Renda indisponível hoje.</p>
        </template>

        <template x-if="renda">
          <article class="renda-ensaio">
            <!-- 1. O salário de hoje. Com renda 0 (piso acima do patrimônio) a
                 frase do piso toma o lugar do herói, e o chip e o split somem. -->
            <section class="renda-hoje" aria-label="O salário de hoje">
              <template x-if="!rendaZero()">
                <p class="renda-resposta">
                  <span class="renda-resposta__linha">Se você parasse de trabalhar hoje, sua carteira sustentaria</span>
                  <span class="renda-resposta__valor"><strong class="renda-heroi" x-text="formatBrlInteiro(renda.hoje.mensal)"></strong> <span class="renda-resposta__unidade">por mês</span></span>
                  <span class="renda-resposta__sub"><span class="renda-num" x-text="formatBrlInteiro(renda.hoje.anual)"></span> por ano, em reais de hoje.</span>
                </p>
              </template>
              <template x-if="rendaZero()">
                <p class="renda-resposta renda-resposta--zero">Com o piso de herança atual, a carteira ainda não sustenta renda. A tabela de pisos, mais abaixo, mostra quanto um piso menor liberaria.</p>
              </template>
              <template x-if="rendaChip()">
                <p class="renda-chip" x-text="rendaChip()"></p>
              </template>

              <template x-if="!rendaZero()">
                <div class="renda-origem">
                  <h2 class="renda-subtitulo">De onde viria</h2>
                  <div class="renda-origem__barra" aria-hidden="true">
                    <template x-for="l in rendaOrigem().filter(l => l.pct > 0)" :key="l.chave">
                      <span class="renda-origem__seg" :class="'renda-origem__seg--' + l.chave" :style="'width:' + l.pct + '%'"></span>
                    </template>
                  </div>
                  <table class="renda-tabela renda-tabela--origem">
                    <caption class="sr-only">De onde viria a renda de hoje, por mês</caption>
                    <tbody>
                      <template x-for="l in rendaOrigem()" :key="l.chave">
                        <tr class="renda-linha"><th scope="row"><span class="renda-origem__marca" :class="'renda-origem__seg--' + l.chave" aria-hidden="true"></span><span x-text="l.rotulo"></span></th>
                          <td><span class="renda-num" x-text="formatBrlInteiro(l.valor)"></span></td></tr>
                      </template>
                    </tbody>
                  </table>
                  <p class="renda-texto" x-show="renda.hoje.proventos_cobrem">Os proventos de hoje já cobrem essa renda, e o que sobra deles fica na carteira.</p>
                  <p class="renda-texto" x-show="!renda.hoje.proventos_cobrem">O que faltasse viria da venda de cotas, de preferência das classes acima do alvo, o que também ajuda a rebalancear a carteira.</p>
                  <p class="renda-nota">Proventos e aluguéis dos últimos 12 meses, por mês. É uma fotografia de hoje, não uma previsão.</p>
                </div>
              </template>

              <div class="renda-seguro">
                <h2 class="renda-subtitulo">O que “seguro” quer dizer aqui</h2>
                <p class="renda-texto">Em <span class="renda-num" x-text="rendaFmtProb()"></span> dos cenários, a renda dura até os <span x-text="renda.premissas.idade_horizonte"></span> anos sem a carteira zerar<span x-text="renda.premissas.piso_heranca_brl > 0 ? ' e sem passar abaixo do piso de herança' : ''"></span>.
                  Piso de herança hoje: <span class="renda-num" x-text="formatBrlInteiro(renda.premissas.piso_heranca_brl)"></span>; mudá-lo é uma decisão sua, feita fora do app.
                  O número varia a cada atualização da carteira.</p>
              </div>
            </section>

            <!-- 2. Como ele cresce: o passado (reais de cada época) e a projeção
                 (reais de hoje) num SVG inline, sem ECharts. O desenho é role=img
                 com resumo; a tabela de marcos é a leitura acessível. -->
            <section class="renda-cap renda-cresce" aria-labelledby="renda-cap-cresce">
              <h2 class="renda-titulo" id="renda-cap-cresce">Como ele cresce</h2>
              <p class="renda-texto" x-text="rendaResumo()"></p>
              <figure class="renda-grafico">
                <p class="renda-grafico__teto" aria-hidden="true" x-text="formatBrlInteiro(rendaGrafico().teto) + ' por mês'"></p>
                <div class="renda-grafico__area">
                  <svg viewBox="0 0 100 100" preserveAspectRatio="none" role="img" :aria-label="rendaGraficoLabel()">
                    <line class="renda-grafico__base" x1="0" y1="100" x2="100" y2="100"></line>
                    <polygon class="renda-grafico__faixa" :points="rendaGrafico().faixa"></polygon>
                    <path class="renda-grafico__mediana" :d="rendaGrafico().mediana"></path>
                    <path class="renda-grafico__passado" :d="rendaGrafico().passado"></path>
                  </svg>
                  <span class="renda-grafico__hoje" aria-hidden="true" :style="'left:' + rendaGrafico().hoje.x + '%;top:' + rendaGrafico().hoje.y + '%'"></span>
                </div>
                <p class="renda-grafico__eixo" aria-hidden="true">
                  <span class="renda-grafico__eixo-ini" x-show="rendaGrafico().mostrarInicio" x-text="rendaGrafico().inicio"></span>
                  <span class="renda-grafico__eixo-hoje" :style="'left:' + rendaGrafico().hoje.x + '%'">hoje</span>
                  <span class="renda-grafico__eixo-fim" x-text="rendaGrafico().fim"></span>
                </p>
                <figcaption class="renda-grafico__legenda">Linha cheia: o que a carteira sustentaria em cada mês, em reais de cada época. Tracejada: a mediana da projeção, em reais de hoje. Faixa: 8 em 10 cenários.</figcaption>
              </figure>

              <h3 class="renda-subtitulo">Se você parasse aos…</h3>
              <p class="renda-nota" x-show="!rendaMarcos().length" x-cloak>Não há idade futura para a tabela.</p>
              <table class="renda-tabela renda-marcos" x-show="rendaMarcos().length">
                <caption class="sr-only">Renda por mês se você parasse em cada idade, em reais de hoje</caption>
                <template x-for="m in rendaMarcos()" :key="m.idade">
                  <tbody>
                    <tr class="renda-linha"><th scope="row" x-text="'Aos ' + m.idade"></th>
                      <td><span class="renda-num" x-text="formatBrlInteiro(m.p50)"></span> por mês</td></tr>
                    <tr class="renda-linha__sub"><td colspan="2">8 em 10 cenários entre <span class="renda-num" x-text="formatBrlInteiro(m.p10)"></span> <span class="renda-par">e <span class="renda-num" x-text="formatBrlInteiro(m.p90)"></span></span></td></tr>
                  </tbody>
                </template>
              </table>
            </section>

            <!-- 3. Ano bom, ano ruim: guardrails em reais, herança e o custo do piso. -->
            <section class="renda-cap" aria-labelledby="renda-cap-ano">
              <h2 class="renda-titulo" id="renda-cap-ano">Ano bom, ano ruim</h2>
              <p class="renda-texto">A renda acompanha a carteira: num ano bom dá para tirar mais, num ano ruim, menos.</p>
              <table class="renda-tabela renda-guardrails">
                <caption class="sr-only">Renda por mês conforme o valor da carteira</caption>
                <template x-for="g in rendaGuardrails()" :key="g.choque">
                  <tbody>
                    <tr class="renda-linha"><th scope="row" x-text="g.rotulo"></th>
                      <td><span class="renda-num" x-text="formatBrlInteiro(g.mensal)"></span> por mês</td></tr>
                    <tr class="renda-linha__sub"><td colspan="2">carteira em <span class="renda-num" x-text="formatBrlInteiro(g.patrimonio)"></span></td></tr>
                  </tbody>
                </template>
              </table>

              <div class="renda-heranca">
                <h3 class="renda-subtitulo">O que fica para os descendentes</h3>
                <p class="renda-texto" x-text="rendaHerancaTexto()"></p>
              </div>

              <h3 class="renda-subtitulo">Quanto custa garantir uma herança maior</h3>
              <p class="renda-texto">Quanto maior o piso que precisa sobrar aos <span x-text="renda.premissas.idade_horizonte"></span>, menor a renda de hoje.</p>
              <table class="renda-tabela renda-pisos">
                <caption class="sr-only">Renda de hoje por piso de herança, em reais de hoje</caption>
                <template x-for="p in rendaPisos()" :key="p.piso">
                  <tbody :class="p.configurado ? 'renda-pisos__atual' : ''" :aria-current="p.configurado ? 'true' : null">
                    <tr class="renda-linha"><th scope="row" x-text="p.rotulo"></th>
                      <td><span class="renda-num" x-text="formatBrlInteiro(p.mensal)"></span> por mês</td></tr>
                    <tr class="renda-linha__sub"><td colspan="2"><span x-text="p.detalhe"></span><template x-if="p.configurado && !p.rotuloDizSeuPiso"><span class="renda-pisos__seu"> · o seu piso</span></template></td></tr>
                  </tbody>
                </template>
              </table>
            </section>

            <ul class="renda-notas">
              <li><strong>Valores antes do IR sobre vendas.</strong> Os dividendos já entram líquidos; o imposto sobre o ganho das cotas vendidas não está descontado.</li>
              <li><strong>Premissas da projeção.</strong> <span x-text="rendaFonteTexto()"></span></li>
              <li><strong>O passado usa as premissas de hoje.</strong> É quanto aquele patrimônio sustentaria pela régua atual, não o que se esperava na época.</li>
              <li><strong>Imposto sobre herança nos EUA fora da conta.</strong> Para quem não mora lá, só US$ 60 mil em ativos americanos são isentos.</li>
              <li><strong>Você ainda aporta.</strong> Este número é motivação, não plano de saque.</li>
            </ul>

            <a class="renda-link" href="#/raiox/projecao" x-show="projecao" x-cloak>Como o patrimônio chega aos 65 <span aria-hidden="true">›</span></a>
          </article>
        </template>
      </section>

      <!-- ── Tela #/raiox/diagnostico/risco (7a.BQ.2; rota própria desde a 7a.BR.2) ── -->
      <!-- Capítulo 1 do Diagnóstico, push child da tab Raio-X, família "ensaio":
           coluna única, sem cards. O "←" volta ao índice (#/raiox/diagnostico).
           Mono só nos três números da frase-resposta. -->
      <section class="tela-detalhes tela-diagnostico" x-show="rota === 'diag-risco'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        aria-labelledby="diag-h1" x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent" id="diag-h1">Diagnóstico</h1>
        </header>

        <template x-if="!diag">
          <p class="placeholder">Diagnóstico indisponível hoje.</p>
        </template>

        <template x-if="diag">
          <article class="diag-ensaio" aria-labelledby="diag-titulo">
            <p class="diag-ordinal" aria-hidden="true">1</p>
            <h2 class="diag-titulo" id="diag-titulo">Quanto risco a carteira correu</h2>

            <!-- Os mesmos controles da Rentabilidade, com estado próprio. -->
            <div class="escopo-toggle diag-escopos" role="group" aria-label="Escopo">
              <button type="button" data-diag-escopo="Total" @click="diagEscolherEscopo('Total')"
                      :class="{ active: diagEscopo === 'Total' }" :aria-pressed="diagEscopo === 'Total' ? 'true' : 'false'">Total</button>
              <button type="button" data-diag-escopo="Brasil" aria-label="Brasil" @click="diagEscolherEscopo('Brasil')"
                      :class="{ active: diagEscopo === 'Brasil' }" :aria-pressed="diagEscopo === 'Brasil' ? 'true' : 'false'"><span aria-hidden="true">🇧🇷</span> Brasil</button>
              <button type="button" data-diag-escopo="EUA" aria-label="EUA" @click="diagEscolherEscopo('EUA')"
                      :class="{ active: diagEscopo === 'EUA' }" :aria-pressed="diagEscopo === 'EUA' ? 'true' : 'false'"><span aria-hidden="true">🇺🇸</span> EUA</button>
            </div>
            <div class="moeda-toggle diag-moedas" role="group" aria-label="Moeda" x-show="diagEscopo === 'EUA'">
              <button type="button" data-diag-moeda="BRL" @click="diagEscolherMoeda('BRL')"
                      :class="{ active: diagMoeda === 'BRL' }" :aria-pressed="diagMoeda === 'BRL' ? 'true' : 'false'"
                      aria-label="Mostrar a parte americana em reais">BRL</button>
              <button type="button" data-diag-moeda="USD" @click="diagEscolherMoeda('USD')"
                      :class="{ active: diagMoeda === 'USD' }" :aria-pressed="diagMoeda === 'USD' ? 'true' : 'false'"
                      aria-label="Mostrar a parte americana em dólares">USD</button>
            </div>

            <div class="diag-janelas" role="group" aria-label="Janela">
              <template x-for="j in diag.janelas" :key="j.chave">
                <button type="button" class="diag-janela"
                        :data-testid="'diag-janela-' + j.chave"
                        :aria-pressed="diag.chave === j.chave ? 'true' : 'false'"
                        :aria-disabled="j.disponivel ? null : 'true'"
                        :aria-describedby="j.disponivel ? null : 'diag-motivo'"
                        @click="diagEscolherJanela(j.chave)"
                        x-text="j.rotulo"></button>
              </template>
            </div>
            <p class="diag-motivo" id="diag-motivo" data-testid="diag-motivo" aria-live="polite"
               x-show="diag.motivo" x-text="diag.motivo"></p>

            <template x-if="diag.semJanela">
              <p class="diag-sem-janela" data-testid="diag-sem-janela" x-text="diag.semJanela"></p>
            </template>

            <template x-if="!diag.semJanela">
              <div class="diag-corpo">
                <p class="diag-frase" data-testid="diag-frase"><template x-for="(s, i) in diag.frase" :key="i"><span :class="s.mono ? 'diag-mono' : null" x-text="s.t"></span></template></p>
                <p class="diag-ate" data-testid="diag-ate" x-text="diag.linhaAte"></p>

                <dl class="diag-pares">
                  <div class="diag-par" :class="diag.oscTexto ? 'diag-par--texto' : ''">
                    <dt>Oscilação <span class="diag-dt-nome">(volatilidade)</span></dt>
                    <dd data-testid="diag-osc" x-text="diag.osc"></dd>
                  </div>
                  <div class="diag-par">
                    <dt>Pior queda</dt>
                    <dd data-testid="diag-queda" :class="diag.quedaNeg ? 'diag-neg' : ''" x-text="diag.quedaTexto"></dd>
                  </div>
                  <div class="diag-par" :class="diag.sharpeTexto ? 'diag-par--texto' : ''">
                    <dt>Retorno pelo risco <span class="diag-dt-nome">(Sharpe)</span></dt>
                    <dd data-testid="diag-sharpe" :class="diag.sharpe === '—' ? 'diag-ausente' : ''" x-text="diag.sharpe"></dd>
                    <dd class="diag-par__linha" data-testid="diag-sharpe-linha" x-show="diag.sharpeLinha" x-text="diag.sharpeLinha"></dd>
                  </div>
                </dl>

                <h3 class="diag-subtitulo">Quanto abaixo do pico</h3>
                <template x-if="diag.grafico">
                  <figure class="diag-grafico">
                    <p class="diag-grafico__sub">Em cada mês, a distância até o maior valor que a carteira já tinha alcançado na janela.</p>
                    <div class="diag-grafico__area-wrap">
                      <svg viewBox="0 0 100 100" preserveAspectRatio="none" role="img" :aria-label="diag.grafico.aria">
                        <path class="diag-grafico__area" :d="diag.grafico.area"></path>
                        <line class="diag-grafico__guia" x1="0" x2="100" :y1="diag.grafico.guiaY" :y2="diag.grafico.guiaY" x-show="diag.grafico.guia"></line>
                        <line class="diag-grafico__zero" x1="0" y1="0" x2="100" y2="0"></line>
                        <path class="diag-grafico__linha" :d="diag.grafico.linha"></path>
                      </svg>
                      <span class="diag-grafico__guia-rotulo diag-grafico__zero-rotulo" aria-hidden="true">0%</span>
                      <template x-for="t in diag.grafico.tiques" :key="t">
                        <span class="diag-grafico__tique" aria-hidden="true" :style="'left:' + t + '%'"></span>
                      </template>
                      <span class="diag-grafico__guia-rotulo" aria-hidden="true" x-show="diag.grafico.guia"
                            :style="'top:' + diag.grafico.guiaY + '%'" x-text="diag.grafico.guiaRotulo"></span>
                      <span class="diag-grafico__fundo" aria-hidden="true"
                            :style="'left:' + diag.grafico.fundo.x + '%;top:' + diag.grafico.fundo.y + '%'"></span>
                      <span class="diag-grafico__fundo-rotulo" data-testid="diag-fundo-rotulo" aria-hidden="true"
                            :style="'left:' + diag.grafico.fundo.x + '%;top:' + diag.grafico.fundo.y + '%;transform:translateX(-' + diag.grafico.fundo.x + '%)'"
                            x-text="diag.grafico.fundoRotulo"></span>
                    </div>
                    <p class="diag-grafico__eixo" aria-hidden="true"><span x-text="diag.ancora"></span><span x-text="diag.ate"></span></p>
                  </figure>
                </template>
                <template x-if="diag.semQueda">
                  <p class="diag-texto" data-testid="diag-sem-queda">Na janela, a carteira não ficou abaixo do pico em nenhum fechamento de mês.</p>
                </template>
                <template x-if="diag.fraseQueda">
                  <p class="diag-texto" data-testid="diag-frase-queda" x-text="diag.fraseQueda"></p>
                </template>
                <template x-if="diag.fraseHoje">
                  <p class="diag-texto" data-testid="diag-frase-hoje" x-text="diag.fraseHoje"></p>
                </template>

                <section class="diag-ler" data-testid="diag-ler" aria-labelledby="diag-ler-titulo">
                  <h3 class="diag-subtitulo" id="diag-ler-titulo">Como ler esta conta</h3>
                  <h4 class="diag-ler__sub">O que esta pergunta mede</h4>
                  <p class="diag-texto">O retorno sozinho não diz como foi o caminho. Duas carteiras podem chegar ao mesmo lugar, uma subindo devagar e outra caindo pela metade no meio do caminho. Aqui ficam três medidas desse caminho.</p>
                  <h4 class="diag-ler__sub">Os três números</h4>
                  <dl class="diag-ler__nums">
                    <dt>Oscilação (volatilidade)</dt>
                    <dd>O tamanho típico do solavanco: quanto o resultado costuma se afastar da média. Com <dfn>oscilação</dfn> de 12% ao ano, por exemplo (número inventado), num ano comum a carteira fica até uns 12 pontos acima ou abaixo do que costuma render, e, como regra de bolso, mais ou menos um ano em cada três sai dessa faixa. Quanto maior, mais acidentado.</dd>
                    <dt>Pior queda</dt>
                    <dd>A maior distância entre um pico e o fundo que veio depois. É a pergunta prática: qual foi o pior momento que você teria de atravessar sem vender? O gráfico "Quanto abaixo do pico" mostra isso mês a mês: a linha no zero é a carteira no maior valor que já tinha alcançado; cada vale é uma queda, e a volta ao zero é a recuperação.</dd>
                    <dt>Retorno pelo risco (Sharpe)</dt>
                    <dd>Quanto a carteira rendeu acima do CDI para cada ponto de oscilação. O CDI entra porque é o que você ganharia sem correr risco nenhum. Acima de zero, o risco foi pago; abaixo de zero, a carteira balançou e mesmo assim rendeu menos que o CDI.</dd>
                  </dl>
                  <h4 class="diag-ler__sub">Como ler o seu resultado</h4>
                  <p class="diag-texto">Olhe os três juntos: a oscilação diz o tamanho do solavanco, a <dfn>pior queda</dfn> diz o pior momento, e o <dfn>retorno pelo risco</dfn> diz se o solavanco valeu a pena. Para ter com o que comparar, "Ver a conta" mostra os mesmos números para a mesma carteira feita só de índices: se a sua oscilou mais que ela, o risco a mais veio das suas escolhas.</p>
                  <h4 class="diag-ler__sub">Os botões</h4>
                  <p class="diag-texto">Total, Brasil e EUA mostram a carteira inteira ou só uma parte. Na parte americana, BRL mostra o resultado em reais, com o efeito do dólar dentro; USD mostra em dólar, sem ele. Em dólar não há retorno pelo risco, porque o CDI é uma taxa em reais.</p>
                  <h4 class="diag-ler__sub">O que estes números não dizem</h4>
                  <p class="diag-texto">São medidos no fechamento de cada mês: uma queda que começa e termina dentro do mesmo mês não aparece, então a pior queda real pode ter sido maior. E o tamanho das quedas passadas não promete o tamanho da próxima.</p>
                </section>

                <details class="diag-conta">
                  <summary>Ver a conta</summary>
                  <div class="diag-conta__corpo">
                    <p class="diag-conta__nota diag-conta__abre">Os nomes técnicos e as fórmulas, para conferir.</p>
                    <table class="diag-tabela">
                      <caption class="sr-only">A carteira e a mesma carteira feita só de índices, na janela escolhida</caption>
                      <thead><tr><td></td><th scope="col">Sua carteira</th><th scope="col">Só com índices</th></tr></thead>
                      <tbody>
                        <template x-for="l in diag.conta.linhas" :key="l.rotulo">
                          <tr><th scope="row" x-text="l.rotulo"></th><td x-text="l.sua"></td><td x-text="l.ind"></td></tr>
                        </template>
                      </tbody>
                    </table>
                    <p class="diag-conta__nota" x-text="diag.conta.cdi"></p>
                    <p class="diag-conta__nota">Oscilação: desvio-padrão dos retornos mensais, vezes √12. Pior queda: a maior distância, num fechamento de mês, até o maior valor anterior da janela. Sharpe: retorno ao ano menos o CDI ao ano, dividido pela oscilação. Sortino: o mesmo, contando só os meses em que a carteira rendeu menos que o CDI. "Só com índices" é a mesma régua da Rentabilidade.</p>
                  </div>
                </details>
              </div>
            </template>

            <p class="diag-aviso">Rentabilidade passada não garante rentabilidade futura.</p>
          </article>
        </template>
      </section>

      <!-- ── Tela #/raiox/diagnostico: índice (7a.BR.2) ── -->
      <!-- Cinco perguntas (7a.BT.2), uma linha cada, lista de bordas finas, sem cards
           (família ensaio). Cada linha resume a janela desde o início; sem
           dado, a linha fica com o motivo e continua tocável (spec §6.2). O
           conteúdo das telas dos capítulos só monta na própria rota (x-if com a
           rota): a ponte do capítulo 3 não é calculada fora dele, e os
           seletores globais do capítulo 1 não enxergam o markup delas. -->
      <section class="tela-detalhes tela-diag-indice" x-show="rota === 'diagnostico'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        aria-labelledby="diag-indice-h1" x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent" id="diag-indice-h1">Diagnóstico</h1>
        </header>

        <template x-if="rota === 'diagnostico'">
          <article class="diag-ensaio diag-indice" aria-labelledby="diag-indice-titulo">
            <h2 class="diag-titulo diag-indice__titulo" id="diag-indice-titulo">A carteira está indo bem?</h2>
            <p class="diag-indice__instrucao">Cinco perguntas, lidas nesta ordem. Toque em uma para ver a conta.</p>
            <nav aria-label="Perguntas do diagnóstico">
              <ol class="diag-indice__lista">
                <template x-for="l in diagIndiceLinhas()" :key="l.n">
                  <li>
                    <a class="diag-indice__linha" :href="l.href" :data-testid="'diag-indice-' + l.n">
                      <span class="diag-indice__ordinal" aria-hidden="true" x-text="l.n"></span>
                      <span class="diag-indice__corpo">
                        <span class="diag-indice__pergunta" x-text="l.pergunta"></span>
                        <span class="diag-indice__estado" x-text="l.estado"></span>
                      </span>
                      <span class="diag-indice__chevron" aria-hidden="true">›</span>
                    </a>
                  </li>
                </template>
              </ol>
            </nav>
            <p class="diag-indice__caminho" data-testid="diag-indice-caminho"><strong>O caminho.</strong> A primeira pergunta olha quanto a carteira balançou. A segunda separa o resultado: o plano, o desvio do plano e os ativos escolhidos. A terceira pergunta se essas escolhas são habilidade ou sorte. A quarta olha o momento dos seus aportes. A quinta olha como a carteira está montada e quanto custam os fundos. Cada uma explica, por dentro, como ler a conta.</p>
            <p class="diag-indice__nota">Cada linha resume a janela desde o início. A conta, as outras janelas e os escopos ficam dentro de cada pergunta.</p>
            <p class="diag-aviso">Rentabilidade passada não garante rentabilidade futura.</p>
          </article>
        </template>
      </section>

      <!-- ── Tela #/raiox/diagnostico/politica: capítulo 2 (7a.BS.2) ── -->
      <!-- Sua carteira contra a carteira-modelo da política (bloco `atribuicao`,
           schema 2.37). Família ensaio, coluna única, sem escopo. Ousadia num
           lugar só: a cascata, no idioma do waterfall da Rentabilidade (totais
           em barra cheia, degraus num eixo comum, ▲/▼ com sinal e cor), sempre
           aberta e sem toque (as linhas não são botões). O conteúdo só monta na
           própria rota (x-if). -->
      <section class="tela-detalhes tela-diag-politica" x-show="rota === 'diag-politica'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        aria-labelledby="pol-h1" x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent" id="pol-h1">Diagnóstico</h1>
        </header>

        <template x-if="rota === 'diag-politica' && !pol">
          <p class="placeholder">De onde veio o resultado: indisponível hoje.</p>
        </template>

        <template x-if="rota === 'diag-politica' && pol">
          <article class="diag-ensaio pol-ensaio" aria-labelledby="pol-titulo">
            <p class="diag-ordinal" aria-hidden="true">2</p>
            <h2 class="diag-titulo" id="pol-titulo">De onde veio o resultado</h2>
            <p class="pol-pergunta">Sua carteira comparada com o plano que você definiu, para saber quanto do resultado veio do plano, de ter fugido dele e dos ativos que você escolheu.</p>

            <div class="diag-janelas" role="group" aria-label="Janela">
              <template x-for="j in pol.janelas" :key="j.chave">
                <button type="button" class="diag-janela diag-janela--herda"
                        :data-testid="'pol-janela-' + j.chave"
                        :aria-pressed="pol.chave === j.chave ? 'true' : 'false'"
                        :aria-disabled="j.disponivel ? null : 'true'"
                        :aria-describedby="j.disponivel ? null : 'pol-motivo'"
                        @click="polEscolherJanela(j.chave)"
                        x-text="j.rotulo"></button>
              </template>
            </div>
            <p class="diag-motivo" id="pol-motivo" data-testid="pol-motivo" aria-live="polite"
               x-show="pol.motivo" x-text="pol.motivo"></p>

            <template x-if="pol.semJanela">
              <p class="diag-sem-janela" data-testid="pol-sem-janela" x-text="pol.semJanela"></p>
            </template>

            <template x-if="!pol.semJanela">
              <div class="pol-corpo">
                <p class="diag-frase pol-frase" data-testid="pol-frase"><template x-for="(s, i) in pol.frase" :key="i"><span><template x-if="s.b"><strong x-text="s.t"></strong></template><template x-if="!s.b"><span x-text="s.t"></span></template></span></template></p>
                <p class="diag-ate" data-testid="pol-ate" x-text="pol.linhaAte"></p>
              </div>
            </template>

            <p class="pol-cinza pol-contrafactual" data-testid="pol-contrafactual">Como se a política de hoje tivesse sido seguida desde o início. Ela foi definida conhecendo este período, e por isso tende a parecer boa.</p>
            <template x-if="pol.registrada">
              <p class="pol-cinza pol-registrada" data-testid="pol-registrada" x-text="pol.registrada"></p>
            </template>

            <template x-if="pol.cascata">
              <section class="pol-cascata-secao" aria-label="Da política à sua carteira">
                <p class="pol-unidade" x-text="pol.cascata.unidade"></p>
                <div class="pol-cascata" aria-hidden="true">
                  <template x-for="l in pol.cascata.linhas" :key="l.tipo + '-' + (l.grupo || '') + '-' + l.id">
                    <div class="pol-linha" :class="'pol-linha--' + l.tipo" data-testid="pol-linha"
                         :data-tipo="l.tipo" :data-id="l.id" :data-grupo="l.grupo">
                      <span class="pol-rotulo">
                        <span class="pol-nome"><template x-if="l.estiloPonto"><span class="pol-ponto" :style="l.estiloPonto"></span></template><span x-text="l.rotulo"></span></span>
                      </span>
                      <template x-if="l.tipo !== 'grupo'">
                        <span class="pol-trilho">
                          <template x-if="l.estiloGuia"><span class="pol-guia" :style="l.estiloGuia"></span></template>
                          <span class="pol-barra" :class="'pol-barra--' + l.barra" :style="l.estiloBarra"></span>
                        </span>
                      </template>
                      <span class="pol-valor" :class="'is-' + l.sinal" x-text="l.texto"></span>
                      <!-- 7a.BU: a legenda na segunda linha do grid, fora do rótulo. -->
                      <template x-if="l.sub"><span class="pol-sub" x-text="l.sub"></span></template>
                    </div>
                  </template>
                </div>
                <!-- Tabela equivalente para leitor de tela (o .sr-only no
                     wrapper, como na ponte: tabela não encolhe a 1 px). -->
                <div class="sr-only">
                  <table data-testid="pol-tabela">
                    <caption x-text="pol.cascata.caption"></caption>
                    <thead><tr><th scope="col">Linha</th><th scope="col">Valor</th><th scope="col">Acumulado</th></tr></thead>
                    <tbody>
                      <template x-for="l in pol.cascata.linhas" :key="'t-' + l.tipo + '-' + (l.grupo || '') + '-' + l.id">
                        <tr><th scope="row" x-text="l.tipo === 'degrau' ? l.rotulo + ', em ' + (l.grupo === 'desvio' ? 'desvio do alvo' : 'suas escolhas') + ':' : l.rotulo + (l.sub ? ', ' + l.sub : '') + ':'"></th><td x-text="l.tabelaValor"></td><td x-text="l.tabelaAcum"></td></tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </section>
            </template>

            <template x-if="pol.dolar">
              <section class="pol-dolar" data-testid="pol-dolar" aria-labelledby="pol-dolar-titulo">
                <h3 class="diag-subtitulo" id="pol-dolar-titulo">O dólar</h3>
                <p class="diag-texto pol-dolar__frase" data-testid="pol-dolar-frase" x-text="pol.dolar"></p>
                <p class="pol-cinza" data-testid="pol-dolar-linha">É o que a parte americana ganhou ou perdeu só pela troca de moeda.</p>
              </section>
            </template>

            <section class="diag-ler" data-testid="pol-ler" aria-labelledby="pol-ler-titulo">
              <h3 class="diag-subtitulo" id="pol-ler-titulo">Como ler esta conta</h3>
              <h4 class="diag-ler__sub">Três carteiras</h4>
              <p class="diag-texto">A conta compara a sua carteira com duas carteiras imaginárias, e vai de uma para a outra.</p>
              <ol class="diag-ler__lista">
                <li><dfn>A política.</dfn> É o plano seguido à risca. Os pesos são os alvos de hoje do seu plano, os mesmos em todos os meses, e todo início de mês ela volta ao alvo, sem custo nem imposto. Dentro de cada categoria, os fundos do plano (por exemplo, um fundo que segue o Ibovespa, outro que segue o S&amp;P 500) rendem o retorno de cada um, e a parte que o plano reserva para ações e FIIs escolhidos um a um rende o índice da classe (IBOV, IFIX, S&amp;P 500). Antes de existirem, os fundos de renda fixa do plano rendem o índice que seguem. É o que você teria ganho seguindo o plano sem escolher nenhum ativo.</li>
                <li><dfn>Mesma carteira, só com índices.</dfn> Usa os pesos que você teve de verdade em cada mês, com o que sobrou ou faltou em cada categoria, mas faz o dinheiro de cada classe render o índice, ou o fundo do plano, e não os seus ativos. É o mesmo número que a Rentabilidade mostra.</li>
                <li><dfn>Sua carteira.</dfn> O que você ganhou de verdade.</li>
              </ol>
              <h4 class="diag-ler__sub">As duas diferenças</h4>
              <ul class="diag-ler__lista">
                <li><strong>Da política para "só com índices": o <dfn>desvio do alvo</dfn>.</strong> Nenhuma das duas tem os seus ativos escolhidos; o que muda é quanto dinheiro havia em cada categoria, e como ele se repartia dentro dela. Então essa diferença mede só o efeito dos pesos, nunca das escolhas de ativo. Por exemplo: ter ficado acima do alvo numa categoria que foi mal aparece aqui como ponto negativo; acima do alvo numa que foi bem, como ponto positivo. Na conta detalhada, o desvio de cada categoria se divide em duas partes: o peso da categoria, mais ou menos que o alvo, e a mistura dentro dela, como ter mais ações escolhidas que o plano prevê.</li>
                <li><strong>De "só com índices" para a sua carteira: <dfn>suas escolhas</dfn>.</strong> Agora os pesos são os mesmos; o que muda é quais ativos você teve dentro de cada classe: as suas ações contra o IBOV, os seus FIIs contra o IFIX, as suas ações americanas contra o S&amp;P 500.</li>
              </ul>
              <p class="diag-texto">A conta fecha sempre: a política, mais o desvio do alvo, mais as suas escolhas, dá a sua carteira.</p>
              <h4 class="diag-ler__sub">A unidade</h4>
              <p class="diag-texto">Os números da cascata são em pontos percentuais ao ano. Exemplo inventado: se a política rendeu 9% ao ano e a carteira 10%, a diferença é de 1 ponto.</p>
              <h4 class="diag-ler__sub">O dólar</h4>
              <p class="diag-texto">Parte do que a parte americana rendeu, em reais, veio só da subida ou da queda do dólar. A linha do dólar, quando aparece, separa esse pedaço: diz quanto do retorno da carteira veio do câmbio e quanto ela teria rendido com o dólar parado. Ela fica fora da cascata porque o dólar mexe nas três carteiras ao mesmo tempo.</p>
              <h4 class="diag-ler__sub">A ressalva</h4>
              <p class="diag-texto">A linha cinza logo abaixo da frase diz que a conta aplica o plano de hoje desde o início, inclusive em anos em que ele ainda não existia. Nos períodos em que a carteira estava longe do plano de hoje, o desvio do alvo sai grande: ele mostra o quanto você estava longe do plano atual, e não que você descumpriu um plano que tinha na época. E o plano foi definido já conhecendo esse período, então ele tende a parecer bom.</p>
              <h4 class="diag-ler__sub">O que fica de fora</h4>
              <p class="diag-texto">A cripto, como na Rentabilidade.</p>
            </section>

            <details class="diag-conta">
              <summary>Ver a conta</summary>
              <div class="diag-conta__corpo">
                <p class="diag-conta__nota diag-conta__abre">Os nomes técnicos e as fórmulas, para conferir.</p>
                <template x-for="tb in pol.conta.tabelas" :key="tb.chave">
                  <div class="pol-conta-janela">
                    <template x-if="tb.motivo">
                      <p class="diag-conta__nota" :data-janela="tb.chave"><strong class="pol-conta-rotulo" x-text="tb.rotulo + ':'"></strong> <span x-text="tb.motivo"></span></p>
                    </template>
                    <template x-if="!tb.motivo">
                      <table class="diag-tabela pol-conta-tabela" :data-janela="tb.chave">
                        <caption class="pol-conta-tabela__titulo" x-text="tb.rotulo"></caption>
                        <thead><tr><td></td><template x-for="cn in pol.conta.colunas" :key="cn"><th scope="col" x-text="cn"></th></template></tr></thead>
                        <tbody>
                          <template x-for="l in tb.linhas" :key="l.id">
                            <tr :data-linha="l.id"><th scope="row" x-text="l.rotulo"></th><template x-for="(v, i) in l.v" :key="i"><td x-text="v"></td></template></tr>
                          </template>
                        </tbody>
                      </table>
                    </template>
                  </div>
                </template>
                <p class="diag-conta__nota">Alvo: o peso de hoje da categoria na política. Peso real médio: a média, mês a mês, do peso que a categoria teve na sua carteira. Peso da categoria, mistura e desvio em pontos, com duas casas; o peso mais a mistura dá o desvio.</p>
                <p class="diag-conta__nota">A política: a carteira-modelo, com os pesos de hoje em todos os meses. Desvio do alvo: a mesma carteira, só com índices, menos a política. Peso da categoria: a parte do desvio que vem de a categoria ter pesado mais ou menos que o alvo. Mistura dentro dela: a parte que vem da composição dentro da categoria, como mais picks que o alvo ou um fundo acima do outro. Suas escolhas: a sua carteira menos a mesma carteira, só com índices, as mesmas linhas da Rentabilidade.</p>
                <p class="diag-conta__nota">É a atribuição de Brinson-Fachler (o termo de alocação, com a mistura dentro da categoria), ligada mês a mês pelo mesmo encadeamento da Rentabilidade (GRAP); a interação entre peso e escolha fica em suas escolhas, como na Rentabilidade.</p>
                <p class="diag-conta__nota">Os fundos da política rendem o retorno de mercado em todos os meses: a cotação com os proventos reinvestidos. Na mesma carteira, só com índices, o fundo que você teve rende pelo método de Dietz, que leva em conta o dinheiro que entrou no meio do mês; a pequena diferença entre os dois fica no desvio do alvo da categoria.</p>
                <p class="diag-conta__nota">Fontes dos fundos da política:</p>
                <ul class="pol-fontes">
                  <template x-for="(f, i) in pol.conta.fontes" :key="i">
                    <li data-testid="pol-fonte" x-text="f"></li>
                  </template>
                </ul>
                <template x-if="pol.dolar">
                  <p class="diag-conta__nota" data-testid="pol-conta-dolar">No dólar, as ações brasileiras negociadas em dólar ficam fora da conta, e os fluxos em dólar usam o câmbio da corretora; por isso o número carrega também a diferença entre esse câmbio e o de mercado.</p>
                </template>
              </div>
            </details>

            <p class="diag-aviso">Rentabilidade passada não garante rentabilidade futura.</p>
          </article>
        </template>
      </section>

      <!-- ── Tela #/raiox/diagnostico/selecao: capítulo 3 (7a.BR.2; o 2 até a 7a.BS.2) ── -->
      <!-- Picks de cada classe contra o índice da classe. Sem escopo: as três
           classes juntas, na ordem fixa. Ousadia num lugar só: a régua da
           confiança (SVG inline, t de −3 a +3, sem cor de ganho ou perda). -->
      <section class="tela-detalhes tela-diag-selecao" x-show="rota === 'diag-selecao'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        aria-labelledby="sel-h1" x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent" id="sel-h1">Diagnóstico</h1>
        </header>

        <template x-if="rota === 'diag-selecao' && !sel">
          <p class="placeholder">Confiança da seleção indisponível hoje.</p>
        </template>

        <template x-if="rota === 'diag-selecao' && sel">
          <article class="diag-ensaio sel-ensaio" aria-labelledby="sel-titulo">
            <p class="diag-ordinal" aria-hidden="true">3</p>
            <h2 class="diag-titulo" id="sel-titulo">Seus picks batem o índice?</h2>

            <div class="diag-janelas" role="group" aria-label="Janela">
              <button type="button" class="diag-janela diag-janela--herda" data-testid="sel-janela-3a"
                      :aria-pressed="selJanela === '3a' ? 'true' : 'false'" @click="selEscolherJanela('3a')">3 anos</button>
              <button type="button" class="diag-janela diag-janela--herda" data-testid="sel-janela-5a"
                      :aria-pressed="selJanela === '5a' ? 'true' : 'false'" @click="selEscolherJanela('5a')">5 anos</button>
              <button type="button" class="diag-janela diag-janela--herda" data-testid="sel-janela-desde"
                      :aria-pressed="selJanela === 'desde' ? 'true' : 'false'" @click="selEscolherJanela('desde')">Desde o início</button>
            </div>

            <template x-for="c in sel.classes" :key="c.classe">
              <section class="sel-classe" :data-classe="c.classe" :aria-labelledby="'sel-cab-' + c.classe">
                <h3 class="sel-classe__cab" :id="'sel-cab-' + c.classe"><span class="sel-ponto" :class="'sel-ponto--' + c.classe" aria-hidden="true"></span><span class="sel-classe__nome" x-text="c.nome"></span><span class="sel-classe__indice" x-text="c.indice"></span></h3>

                <template x-if="c.motivo">
                  <p class="sel-motivo" data-testid="sel-motivo" x-text="c.motivo"></p>
                </template>

                <template x-if="!c.motivo">
                  <div class="sel-classe__corpo">
                    <p class="sel-frase" data-testid="sel-frase"><template x-for="(s, i) in c.frase" :key="i"><span><template x-if="s.b"><strong x-text="s.t"></strong></template><template x-if="!s.b"><span x-text="s.t"></span></template></span></template></p>
                    <template x-if="c.regua">
                      <figure class="sel-regua">
                        <svg viewBox="0 0 300 36" role="img" :aria-label="c.regua.aria">
                          <rect class="sel-regua__faixa" x="104" y="11" width="92" height="14" rx="3"></rect>
                          <line class="sel-regua__eixo" x1="12" y1="18" x2="288" y2="18"></line>
                          <line class="sel-regua__traco" x1="58" y1="12" x2="58" y2="24"></line>
                          <line class="sel-regua__traco" x1="104" y1="9" x2="104" y2="27"></line>
                          <line class="sel-regua__zero" x1="150" y1="5" x2="150" y2="31"></line>
                          <line class="sel-regua__traco" x1="196" y1="9" x2="196" y2="27"></line>
                          <line class="sel-regua__traco" x1="242" y1="12" x2="242" y2="24"></line>
                          <circle class="sel-regua__ponto" :cx="c.regua.x" cy="18" r="6"></circle>
                        </svg>
                        <p class="sel-regua__rotulos" aria-hidden="true"><span>atrás do índice</span><span>à frente</span></p>
                      </figure>
                    </template>
                    <p class="sel-grau" data-testid="sel-grau"><strong x-text="c.grau.rotulo"></strong> <span x-text="c.grau.texto"></span></p>
                    <p class="sel-linha"><template x-if="c.anos"><span data-testid="sel-anos" x-text="c.anos"></span></template><span data-testid="sel-meses" x-text="c.meses"></span><template x-if="c.divergem"><span data-testid="sel-divergem" x-text="c.divergem"></span></template></p>
                  </div>
                </template>

                <template x-if="c.fundos">
                  <p class="sel-linha sel-fundos" data-testid="sel-fundos" x-text="c.fundos"></p>
                </template>
              </section>
            </template>

            <section class="diag-ler" data-testid="sel-ler" aria-labelledby="sel-ler-titulo">
              <h3 class="diag-subtitulo" id="sel-ler-titulo">Como ler esta conta</h3>
              <h4 class="diag-ler__sub">O que esta pergunta mede</h4>
              <p class="diag-texto">"Picks" são as ações e os FIIs que você escolheu um a um, em vez de comprar o índice. Cada classe é comparada com o próprio índice: ações brasileiras com o IBOV, FIIs com o IFIX, ações americanas com o S&amp;P 500, em dólar, para a alta ou a queda do dólar não entrar na nota das escolhas. A pergunta não é só se os picks ganharam do índice, é se ganharam (ou perderam) por habilidade ou por sorte. Até ativos escolhidos no cara ou coroa batem o índice em alguns anos.</p>
              <h4 class="diag-ler__sub">A lógica é a de um ensaio clínico</h4>
              <p class="diag-texto">Uma diferença entre dois grupos só convence quando é grande perto da variabilidade e quando há observações suficientes. Aqui, cada mês é uma observação: a régua junta o tamanho da diferença média mês a mês, o quanto ela varia de um mês para o outro e o número de meses, e devolve um único número. O nome técnico dele está em "Ver a conta".</p>
              <h4 class="diag-ler__sub">A régua</h4>
              <ul class="diag-ler__lista">
                <li>O ponto à direita do zero quer dizer picks à frente do índice; à esquerda, atrás.</li>
                <li>A faixa cinza, entre −1 e +1, é onde a sorte explica o resultado: <dfn>inconclusivo</dfn>.</li>
                <li>Do primeiro traço em diante, <dfn>indício</dfn>: a diferença começa a ir além da sorte, mas ainda não é prova.</li>
                <li>Do segundo traço em diante, <dfn>consistente</dfn>: difícil explicar só por sorte. Esse traço corresponde, grosso modo, ao "p &lt; 0,05" dos estudos.</li>
                <li>Com menos de 3 anos de picks na janela, a régua não aparece: é cedo para dizer.</li>
              </ul>
              <h4 class="diag-ler__sub">Por que as janelas discordam</h4>
              <p class="diag-texto">Janela mais curta tem menos meses, e menos meses pedem uma diferença maior para convencer. Um indício em 3 anos que some no "Desde o início" diz que a vantagem é recente.</p>
              <h4 class="diag-ler__sub">Duas medidas que às vezes discordam</h4>
              <p class="diag-texto">A frase de cada classe usa o retorno acumulado dos picks contra o do índice. A régua usa a média mês a mês. Quando poucos meses muito bons ou muito ruins pesam no acumulado, as duas podem apontar para lados opostos, e a tela avisa.</p>
              <h4 class="diag-ler__sub">Sem viés de sobrevivência</h4>
              <p class="diag-texto">Os picks incluem os ativos que você já vendeu. Contar só os que ficaram seria como analisar só os pacientes que terminaram o estudo. ETFs de índice ficam fora, porque não são escolha de ativo.</p>
              <h4 class="diag-ler__sub">A diferença para o capítulo 2</h4>
              <p class="diag-texto">Lá, "suas escolhas" diz quanto as escolhas somaram ou tiraram da carteira, em pontos. Aqui, a pergunta é se dá para confiar que essa diferença vem de habilidade.</p>
              <h4 class="diag-ler__sub">O que a régua não diz</h4>
              <p class="diag-texto">Ela fala do passado. Uma diferença consistente até hoje não garante que continue.</p>
            </section>

            <details class="diag-conta">
              <summary>Ver a conta</summary>
              <div class="diag-conta__corpo">
                <p class="diag-conta__nota diag-conta__abre">Os nomes técnicos e as fórmulas, para conferir.</p>
                <template x-for="tb in sel.tabelas" :key="tb.chave">
                  <table class="diag-tabela sel-tabela" :data-janela="tb.chave">
                    <caption class="sel-tabela__titulo" x-text="tb.rotulo"></caption>
                    <thead><tr><td></td><template x-for="cn in sel.colunas" :key="cn"><th scope="col" x-text="cn"></th></template></tr></thead>
                    <tbody>
                      <template x-for="l in tb.linhas" :key="l.id">
                        <tr :data-linha="l.id"><th scope="row" x-text="l.rotulo"></th><template x-for="(v, i) in l.v" :key="i"><td x-text="v"></td></template></tr>
                      </template>
                    </tbody>
                  </table>
                </template>
                <p class="diag-conta__nota">Diferença média ao ano: a média mês a mês de quanto os picks renderam acima do índice, vezes 12. Oscilação da diferença (tracking error): o desvio-padrão dessa diferença mês a mês, vezes √12. Razão (Information Ratio): a diferença média ao ano dividida pela oscilação da diferença. Estatística t: a razão vezes a raiz do número de anos da janela; de 1 em diante é indício, de 2 em diante, consistente. A frase de cada classe usa a diferença composta: o retorno acumulado dos picks contra o do índice, ao ano.</p>
                <p class="diag-conta__nota">Diferente da Rentabilidade: a ponte mostra quanto cada classe somou à carteira; a régua mede os picks contra o próprio índice.</p>
              </div>
            </details>

            <p class="diag-aviso">Rentabilidade passada não garante rentabilidade futura.</p>
          </article>
        </template>
      </section>

      <!-- ── Tela #/raiox/diagnostico/aportes: capítulo 4 (7a.BR.2; o 3 até a 7a.BS.2) ── -->

      <section class="tela-detalhes tela-diag-aportes" x-show="rota === 'diag-aportes'"

        <template x-if="rota === 'diag-aportes' && apor">

            <p class="diag-ordinal" aria-hidden="true">4</p>
