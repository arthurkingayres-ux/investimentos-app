               x-show="apor.motivo" x-text="apor.motivo"></p>

            <template x-if="apor.semJanela">
              <p class="diag-sem-janela" data-testid="apor-sem-janela" x-text="apor.semJanela"></p>
            </template>

            <template x-if="!apor.semJanela">
              <div class="diag-corpo">
                <p class="diag-frase apor-frase" data-testid="apor-frase"><template x-for="(s, i) in apor.frase" :key="i"><span><template x-if="s.b"><strong x-text="s.t"></strong></template><template x-if="!s.b"><span x-text="s.t"></span></template></span></template></p>
                <p class="diag-ate" data-testid="apor-ate" x-text="apor.linhaAte"></p>

                <dl class="diag-pares">
                  <div class="diag-par">
                    <dt>A carteira</dt>
                    <dd data-testid="apor-carteira" x-text="apor.carteira"></dd>
                    <dd class="diag-par__linha" data-testid="apor-carteira-linha">Como se o dinheiro tivesse ficado parado do começo ao fim.</dd>
                  </div>
                  <template x-if="!apor.semXirr">
                    <div class="diag-par">
                      <dt>O seu dinheiro</dt>
                      <dd data-testid="apor-dinheiro" x-text="apor.dinheiro"></dd>
                      <dd class="diag-par__linha" data-testid="apor-dinheiro-linha">Considera quando e quanto entrou e saiu.</dd>
                    </div>
                  </template>
                </dl>
              </div>
            </template>

            <section class="diag-ler" data-testid="apor-ler" aria-labelledby="apor-ler-titulo">
              <h3 class="diag-subtitulo" id="apor-ler-titulo">Como ler esta conta</h3>
              <h4 class="diag-ler__sub">Dois retornos, duas perguntas</h4>
              <p class="diag-texto">A carteira e o seu dinheiro podem render diferente, e os dois números estão certos.</p>
              <ul class="diag-ler__lista">
                <li><dfn>A carteira</dfn> mede como os ativos se saíram, como se o dinheiro tivesse ficado parado do começo ao fim. É como a cota de um fundo: não depende de quando você colocou dinheiro. É o número para comparar com índices e com outros investidores.</li>
                <li><dfn>O seu dinheiro</dfn> mede quanto o seu dinheiro cresceu de fato, levando em conta quando e quanto entrou e saiu. É a taxa de um investimento com vários depósitos, como a de um financiamento lida ao contrário.</li>
              </ul>
              <h4 class="diag-ler__sub">Um exemplo</h4>
              <p class="diag-texto">Duas pessoas têm a mesma carteira. Uma faz o aporte grande logo antes de um mês de alta; a outra, logo antes de uma queda. A carteira rendeu igual para as duas. O dinheiro da primeira rendeu mais, e o da segunda, menos. A diferença entre os dois números é exatamente isso: o efeito do calendário dos aportes.</p>
              <h4 class="diag-ler__sub">Como ler o seu resultado</h4>
              <p class="diag-texto">Se o seu dinheiro rendeu mais que a carteira, os aportes caíram, em média, antes de meses bons; se rendeu menos, antes de meses ruins. A diferença muda de sinal conforme a janela, porque cada janela pega um conjunto diferente de aportes.</p>
              <h4 class="diag-ler__sub">O que este número não diz</h4>
              <p class="diag-texto">Não mede acerto: quem aporta todo mês pelo salário ganha ou perde essa diferença sem ter escolhido o momento. Proventos que saíram da carteira contam como dinheiro que saiu. Os botões Total, Brasil, EUA e BRL/USD funcionam como no capítulo 1.</p>
            </section>

            <template x-if="!apor.semJanela">
              <details class="diag-conta">
                <summary>Ver a conta</summary>
                <div class="diag-conta__corpo">
                  <p class="diag-conta__nota diag-conta__abre">Os nomes técnicos e as fórmulas, para conferir.</p>
                  <table class="diag-tabela">
                    <caption class="sr-only">Os dois retornos da janela escolhida, com o nome técnico</caption>
                    <tbody>
                      <tr><th scope="row">A carteira (TWR)</th><td x-text="apor.conta.twr"></td></tr>
                      <tr><th scope="row">O seu dinheiro (XIRR)</th><td x-text="apor.conta.xirr"></td></tr>
                    </tbody>
                  </table>
                  <p class="diag-conta__nota" x-text="apor.conta.periodo"></p>
                  <p class="diag-conta__nota">TWR, a régua da carteira: o retorno de cada mês encadeado. XIRR, a régua do seu dinheiro: a taxa que iguala o valor de hoje a tudo o que entrou e saiu, cada fluxo na sua data. A diferença, XIRR menos TWR, é o que o calendário dos aportes somou ou tirou.</p>
                </div>
              </details>
            </template>

            <p class="diag-aviso">Rentabilidade passada não garante rentabilidade futura.</p>
          </article>
        </template>
      </section>

      <!-- ── Tela #/raiox/diagnostico/construcao: capítulo 5 (7a.BT.2) ── -->
      <!-- Como a carteira está montada (bloco `construcao`, schema 2.38):
           concentração de hoje, a parte de cada classe na oscilação por janela
           e o custo da taxa dos fundos. Família ensaio, coluna única, sem
           escopo. Ousadia num lugar só: a régua dupla "pesou × somou à
           oscilação", sem cor de ganho ou perda. O conteúdo só monta na
           própria rota (x-if). -->
      <section class="tela-detalhes tela-diag-construcao" x-show="rota === 'diag-construcao'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        aria-labelledby="cons-h1" x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent" id="cons-h1">Diagnóstico</h1>
        </header>

        <template x-if="rota === 'diag-construcao' && !cons">
          <p class="placeholder" data-testid="cons-indisponivel">Como a carteira está montada: indisponível hoje.</p>
        </template>

        <template x-if="rota === 'diag-construcao' && cons">
          <article class="diag-ensaio cons-ensaio" aria-labelledby="cons-titulo">
            <p class="diag-ordinal" aria-hidden="true">5</p>
            <h2 class="diag-titulo" id="cons-titulo">Como a carteira está montada</h2>
            <p class="pol-pergunta" data-testid="cons-pergunta">Quanto ela depende dos maiores ativos, de onde vem a oscilação e quanto custam os fundos.</p>

            <!-- Concentração: hoje, sem janela (spec §6.3 itens 2 e 3). -->
            <h3 class="diag-subtitulo" id="cons-maiores-titulo">Os maiores ativos</h3>
            <p class="diag-frase cons-frase" data-testid="cons-conc-frase"><template x-for="(s, i) in cons.conc.frase" :key="i"><span><template x-if="s.b"><strong x-text="s.t"></strong></template><template x-if="!s.b"><span x-text="s.t"></span></template></span></template></p>
            <p class="diag-ate" data-testid="cons-conc-ate" x-text="cons.conc.ate"></p>
            <ol class="cons-lista" data-testid="cons-maiores" aria-labelledby="cons-maiores-titulo">
              <template x-for="m in cons.conc.maiores" :key="m.ticker">
                <li class="cons-item"><span class="cons-ponto" :style="m.ponto" aria-hidden="true"></span><span class="cons-ticker" x-text="m.ticker"></span><span class="cons-peso" x-text="m.peso"></span></li>
              </template>
            </ol>

            <!-- A oscilação por janela e a régua dupla (itens 4 a 6). -->
            <h3 class="diag-subtitulo" id="cons-osc-titulo">De onde vem a oscilação</h3>
            <template x-if="!cons.osc">
              <p class="diag-texto" data-testid="cons-osc-indisponivel">A oscilação por classe está indisponível hoje.</p>
            </template>
            <template x-if="cons.osc">
              <div class="cons-osc">
                <div class="diag-janelas" role="group" aria-label="Janela">
                  <template x-for="j in cons.osc.janelas" :key="j.chave">
                    <button type="button" class="diag-janela diag-janela--herda"
                            :data-testid="'cons-janela-' + j.chave"
                            :aria-pressed="cons.osc.chave === j.chave ? 'true' : 'false'"
                            :aria-disabled="j.disponivel ? null : 'true'"
                            :aria-describedby="j.disponivel ? null : 'cons-motivo'"
                            @click="consEscolherJanela(j.chave)"
                            x-text="j.rotulo"></button>
                  </template>
                </div>
                <p class="diag-motivo" id="cons-motivo" data-testid="cons-motivo" aria-live="polite"
                   x-show="cons.osc.motivo" x-text="cons.osc.motivo"></p>

                <template x-if="cons.osc.semJanela">
                  <p class="diag-sem-janela" data-testid="cons-sem-janela" x-text="cons.osc.semJanela"></p>
                </template>

                <template x-if="!cons.osc.semJanela">
                  <div class="cons-osc-corpo">
                    <template x-if="cons.osc.frase.length">
                      <p class="diag-frase cons-frase" data-testid="cons-osc-frase"><template x-for="(s, i) in cons.osc.frase" :key="i"><span><template x-if="s.b"><strong x-text="s.t"></strong></template><template x-if="!s.b"><span x-text="s.t"></span></template></span></template></p>
                    </template>
                    <p class="diag-ate" data-testid="cons-osc-ate" x-text="cons.osc.ate"></p>

                    <div class="cons-regua">
                      <template x-for="l in cons.osc.linhas" :key="l.id">
                        <div class="cons-regua-linha" data-testid="cons-regua-linha" role="img" :aria-label="l.label" :data-id="l.id">
                          <span class="cons-nome"><span class="cons-ponto" :style="l.ponto"></span><span x-text="l.nome"></span></span>
                          <span class="cons-trilho-linha">
                            <span class="cons-trilho"><span class="cons-barra cons-barra--pesou" :style="l.estiloPesou"></span></span>
                            <span class="cons-valor cons-valor--pesou" data-testid="cons-pesou" x-text="l.pesou"></span>
                          </span>
                          <template x-if="l.somou">
                            <span class="cons-trilho-linha">
                              <span class="cons-trilho"><span class="cons-barra cons-barra--somou" :style="l.estiloSomou"></span></span>
                              <span class="cons-valor cons-valor--somou" data-testid="cons-somou" x-text="l.somou"></span>
                            </span>
                          </template>
                        </div>
                      </template>
                    </div>
                    <!-- Tabela equivalente para leitor de tela (o .sr-only no wrapper). -->
                    <div class="sr-only">
                      <table data-testid="cons-tabela">
                        <caption>Quanto cada classe pesou na carteira e somou à oscilação, em %</caption>
                        <thead><tr><th scope="col">Classe</th><th scope="col">Pesou</th><th scope="col">Somou à oscilação</th></tr></thead>
                        <tbody>
                          <template x-for="l in cons.osc.linhas" :key="'t-' + l.id">
                            <tr><th scope="row" x-text="l.nome"></th><td x-text="l.tabPesou"></td><td x-text="l.tabSomou"></td></tr>
                          </template>
                        </tbody>
                      </table>
                    </div>

                    <template x-if="cons.osc.curto">
                      <p class="diag-texto" data-testid="cons-curto">Histórico curto para medir a oscilação.</p>
                    </template>
                    <template x-if="!cons.osc.curto">
                      <div class="cons-ativos-bloco">
                        <h4 class="cons-h4" id="cons-ativos-titulo">Os ativos que mais mexeram na oscilação</h4>
                        <ol class="cons-lista" data-testid="cons-ativos" aria-labelledby="cons-ativos-titulo">
                          <template x-for="a in cons.osc.ativos" :key="a.ticker">
                            <li class="cons-item"><span class="cons-ponto" :style="a.ponto" aria-hidden="true"></span><span class="cons-ticker" x-text="a.ticker"></span><span class="cons-ativo-vals"><span class="cons-ativo-pesou" x-text="a.pesou"></span><span class="cons-ativo-somou" x-text="a.somou"></span></span></li>
                          </template>
                        </ol>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>

            <!-- O custo (item 7). -->
            <h3 class="diag-subtitulo" id="cons-custo-titulo">Quanto custam os fundos</h3>
            <p class="diag-frase cons-frase" data-testid="cons-custo-frase"><template x-for="(s, i) in cons.custo.frase" :key="i"><span><template x-if="s.b"><strong x-text="s.t"></strong></template><template x-if="!s.b"><span x-text="s.t"></span></template></span></template></p>
            <p class="pol-cinza" data-testid="cons-custo-fora" x-text="cons.custo.fora"></p>
            <p class="pol-cinza" data-testid="cons-custo-banco">Corretagem, emolumentos e o imposto retido nos proventos ainda não estão no banco; quando estiverem, entram aqui.</p>

            <section class="diag-ler" data-testid="cons-ler" aria-labelledby="cons-ler-titulo">
              <h3 class="diag-subtitulo" id="cons-ler-titulo">Como ler esta conta</h3>
              <h4 class="diag-ler__sub">O que esta pergunta mede</h4>
              <p class="diag-texto">Uma carteira pode render bem e depender demais de poucos ativos, ou ter uma parte pequena que responde pela maior parte dos solavancos. Aqui ficam três olhares sobre a montagem: o peso dos maiores, de onde vem a oscilação e quanto os fundos cobram.</p>
              <h4 class="diag-ler__sub">Os números</h4>
              <dl class="diag-ler__nums">
                <dt>Os 5 e os 10 maiores</dt>
                <dd>Quanto da carteira está nos maiores ativos. Quanto maior, mais o resultado depende deles.</dd>
                <dt>Carteira de N ativos de mesmo peso</dt>
                <dd>Uma forma de contar a diversificação: com 40 ativos (número inventado), se poucos pesam muito, a carteira se comporta como se tivesse bem menos. Um fundo de índice conta como um ativo, mesmo tendo centenas de empresas dentro, então este número subestima a diversificação dos fundos.</dd>
                <dt>Pesou × somou à oscilação</dt>
                <dd>O primeiro é o peso médio da classe na janela; o segundo, quanto ela respondeu pelos solavancos da carteira. Uma classe que pesa pouco e soma muito é a que mais balança, ou a que balança junto com o resto. Uma classe que "reduziu" a oscilação costuma subir quando as outras caem.</dd>
                <dt>A taxa dos fundos</dt>
                <dd>O que os fundos descontam por ano, em porcentagem da carteira inteira. Sai da ficha de cada fundo, e entra só o fundo que tem ficha registrada.</dd>
              </dl>
              <h4 class="diag-ler__sub">Como ler o seu resultado</h4>
              <p class="diag-texto">Compare as duas colunas da régua: onde "somou" passa muito de "pesou", ali está a parte que mais mexe com a carteira. No custo, compare com a política: a diferença vem de ter mais ou menos fundo do que o alvo, e de quais fundos.</p>
              <h4 class="diag-ler__sub">O que estes números não dizem</h4>
              <p class="diag-texto">A oscilação é a do passado, com os pesos de cada mês: a carteira de hoje pode se comportar diferente. A concentração não sabe que dois ativos podem ser da mesma empresa ou do mesmo setor. E o custo ainda não inclui corretagem, emolumentos e o imposto retido.</p>
            </section>

            <details class="diag-conta">
              <summary>Ver a conta</summary>
              <div class="diag-conta__corpo">
                <p class="diag-conta__nota diag-conta__abre">Os nomes técnicos e as fórmulas, para conferir.</p>
                <p class="diag-conta__nota" x-text="cons.conta.herf"></p>
                <p class="diag-conta__nota">A parte de cada classe na oscilação é a contribuição de cada classe à variância (covariância da contribuição mensal com o retorno da carteira, sobre a variância). As partes somam 100%.</p>
                <template x-if="cons.conta.corr.length">
                  <p class="diag-conta__nota">Correlação entre as classes, mês a mês, em cada janela:</p>
                </template>
                <template x-for="tb in cons.conta.corr" :key="tb.chave">
                  <div class="pol-conta-janela">
                    <template x-if="tb.motivo">
                      <p class="diag-conta__nota" :data-janela="tb.chave"><strong class="pol-conta-rotulo" x-text="tb.rotulo + ':'"></strong> <span x-text="tb.motivo"></span></p>
                    </template>
                    <template x-if="!tb.motivo">
                      <table class="diag-tabela" data-testid="cons-corr" :data-janela="tb.chave">
                        <caption class="pol-conta-tabela__titulo" x-text="tb.rotulo"></caption>
                        <tbody>
                          <template x-for="l in tb.linhas" :key="l.par">
                            <tr><th scope="row" x-text="l.rotulo"></th><td x-text="l.valor"></td></tr>
                          </template>
                        </tbody>
                      </table>
                    </template>
                  </div>
                </template>
                <table class="diag-tabela" data-testid="cons-fundos">
                  <caption class="pol-conta-tabela__titulo">A taxa de cada fundo</caption>
                  <thead><tr><td></td><th scope="col">Taxa ao ano</th><th scope="col">Peso</th></tr></thead>
                  <tbody>
                    <template x-for="f in cons.conta.fundos" :key="f.ticker">
                      <tr><th scope="row" x-text="f.ticker"></th><td x-text="f.ter"></td><td x-text="f.peso"></td></tr>
                    </template>
                  </tbody>
                </table>
                <p class="diag-conta__nota">Fonte de cada taxa:</p>
                <ul class="pol-fontes">
                  <template x-for="(f, i) in cons.conta.fontes" :key="i">
                    <li data-testid="cons-fonte" x-text="f"></li>
                  </template>
                </ul>
                <template x-if="cons.conta.cripto">
                  <p class="diag-conta__nota" data-testid="cons-cripto" x-text="cons.conta.cripto"></p>
                </template>
                <p class="diag-conta__nota">Os pesos de hoje são os da Alocação, sem a cripto.</p>
              </div>
            </details>

            <p class="diag-aviso">Rentabilidade passada não garante rentabilidade futura.</p>
          </article>
        </template>
      </section>

      <!-- ── Tela #aportar (Fase 7a.H.1) ──────────────────────────────── -->
      <section class="tela-detalhes tela-aportar" x-show="rota === 'aportar'" x-transition:enter.opacity.duration.220ms x-cloak>
        <header class="breadcrumb">
          <h1 class="eyebrow">Próximo aporte</h1>
        </header>

        <!-- 7a.AU: onde está o dinheiro, antes de quanto. Reusa o
             .escopo-toggle (nenhum componente novo), com o padrão a11y de
             #proventos: role="tab" + aria-selected. -->
        <div class="escopo-toggle aporte-mercado-toggle" role="tablist" aria-label="Mercado do aporte">
          <button data-mercado="tudo" type="button"
            @click="selecionarAporteMercado('tudo')"
            role="tab" :aria-selected="aporteMercado === 'tudo'"
            :class="{ active: aporteMercado === 'tudo' }">Tudo</button>
          <button data-mercado="brasil" type="button" aria-label="Brasil"
            @click="selecionarAporteMercado('brasil')"
            role="tab" :aria-selected="aporteMercado === 'brasil'"
            :class="{ active: aporteMercado === 'brasil' }"><span aria-hidden="true">🇧🇷</span> Brasil</button>
          <button data-mercado="eua" type="button" aria-label="Estados Unidos"
            @click="selecionarAporteMercado('eua')"
            role="tab" :aria-selected="aporteMercado === 'eua'"
            :class="{ active: aporteMercado === 'eua' }"><span aria-hidden="true">🇺🇸</span> EUA</button>
        </div>

        <div class="aporte-input-block">
          <label for="aporte-valor" class="aporte-label">Valor disponível</label>
          <input
            id="aporte-valor"
            type="text"
            inputmode="decimal"
            class="aporte-input"
            placeholder="R$ 0,00"
            x-model="aporteValor"
            @input.debounce.150ms="recalcularAporte()"
            autocomplete="off">
          <p class="aporte-helper" x-text="aporteHelperText()"></p>
          <p class="aporte-cap" x-html="aporteApcapHtml()"></p>
        </div>

        <!-- 7a.S.10: chips rápidos (Repetir/último aporte + atalhos) ────── -->
        <div class="aporte-chips">
          <button type="button" class="aporte-chip aporte-chip--hero"
                  x-show="json && json.ultimo_aporte && json.ultimo_aporte.total_brl" x-cloak
                  @click="aporteSetValor(json.ultimo_aporte.total_brl, true)"
                  x-text="'Repetir · ' + aporteFmtBrl0(json && json.ultimo_aporte ? json.ultimo_aporte.total_brl : 0)"></button>
          <button type="button" class="aporte-chip aporte-chip--add5k" @click="aporteAdd(5000)">+ 5.000</button>
          <button type="button" class="aporte-chip aporte-chip--add10k" @click="aporteAdd(10000)">+ 10.000</button>
          <button type="button" class="aporte-chip aporte-chip--zero" @click="aporteSetValor(0, true)">zerar</button>
        </div>

        <!-- 7a.S.10: scrubber "e se fosse mais?" (0–20.000, passo 100) ──── -->
        <div class="aporte-scrub-wrap">
          <div class="aporte-scrub-lbl">
            <span>E se fosse mais?</span>
            <span x-text="'R$ 0 — ' + aporteFmtBrl0(aporteScrubMax)"></span>
          </div>
          <div class="aporte-scrub">
            <div class="aporte-scrub-fill" :style="`width: ${aporteScrubPct()}%`"></div>
            <div class="aporte-scrub-knob" :style="`left: ${aporteScrubPct()}%`"></div>
            <input type="range" class="aporte-scrub-input"
                   min="0" :max="aporteScrubMax" step="100"
                   :value="Math.min(_parseAporteValor(aporteValor), aporteScrubMax)"
                   @input="aporteSetValor($event.target.valueAsNumber, false)"
                   aria-label="Arrastar para escolher o valor do aporte"
                   aria-valuemin="0" :aria-valuemax="aporteScrubMax"
                   :aria-valuenow="Math.min(_parseAporteValor(aporteValor), aporteScrubMax)">
          </div>
        </div>

        <p class="aporte-nota">
          <span x-text="aporteNotaTexto()">O plano prioriza as categorias abaixo do alvo, equal-weight nos picks — zero sobra.</span>
          <!-- 7a.AU: x-if, não x-show — no modo Tudo a linha não existe no DOM. -->
          <template x-if="aporteMercado !== 'tudo'">
            <span class="aporte-nota-mercado" x-text="aporteNotaMercado()"></span>
          </template>
          <span class="writes">Simulação pura: nada é enviado, nada é gravado.</span>
        </p>

        <div class="aporte-banner" x-show="aporteBanner" x-cloak>
          <p x-text="aporteBanner"></p>
        </div>

        <template x-for="cat in aporteCategoriasRecebedoras" :key="cat.nome">
          <article class="card aporte-card" :data-cat-nome="cat.nome">
            <header class="aporte-cat-head">
              <span class="aporte-cat-name" x-text="cat.nome"></span>
              <span class="aporte-cat-tag" x-text="aporteCatTagTexto(cat)"></span>
            </header>
            <div class="aloc-trilha aporte-trilha">
              <div class="aloc-preenchimento"
                   :style="`width: ${Math.min(Math.max(cat.atualPct, 0), 100)}%; background: var(--g-700)`"></div>
              <div class="aporte-trilha-delta"
                   :style="`left: ${Math.min(Math.max(cat.atualPct, 0), 100)}%; width: ${Math.min(cat.deltaPct, 100 - cat.atualPct)}%`"></div>
              <div class="aloc-alvo"
                   x-show="cat.alvoPct > 0"
                   :style="`left: ${Math.min(Math.max(cat.alvoPct, 0), 100)}%`"></div>
            </div>
            <p class="aporte-trilha-line">
              <span x-text="`${cat.atualPct.toFixed(1).replace('.', ',')}% → ${cat.posPct.toFixed(1).replace('.', ',')}%`"></span>
              <span x-text="`alvo ${cat.alvoPct}% · fecha ${cat.deltaPct.toFixed(1).replace('.', ',')}pp`"></span>
            </p>
            <ul class="aporte-compras">
              <template x-for="row in cat.compras" :key="row.ticker">
                <li class="aporte-compra-row">
                  <span class="flag" :aria-label="row.bandeiraLabel" x-text="row.bandeira"></span>
                  <span class="aporte-compra-main">
                    <span class="aporte-compra-tk" x-text="row.ticker"></span>
                    <span class="aporte-compra-sub" x-text="`${row.tipoLabel} · ${row.pesoIntraPct}% do bucket`"></span>
                  </span>
                  <span class="aporte-compra-qty-block">
                    <!-- 7a.S.10: sem x-text — dono exclusivo do textContent é
                         _aporteAnimarPlano (count-up via applyCountUp). Um
                         x-text reativo aqui disputaria com o RAF (mesmo
                         racional do #hero-patrimonio, ver ativarCountUpHero).
                         data-cotas/-frac carregam o valor final pro JS ler. -->
                    <span class="aporte-compra-qty"
                          :data-cotas="row.cotas"
                          :data-cotas-frac="row.cotasFormatadas.includes(',') ? 1 : 0"></span>
                    <span class="aporte-compra-qty-sub" x-text="row.valorFormatado"></span>
                  </span>
                </li>
              </template>
            </ul>
          </article>
        </template>

        <!-- 7a.BW.6: com resposta do Comitê que traz o seu grifo (a razão
             principal, ou o aviso de dado velho), este vira texto comum: um
             grifo por tela (spec 7a.BW §13.1). -->
        <div class="aporte-grifo" :class="{ grifo: !comiteTomaGrifo() }" x-show="aporteGrifoHtml()" x-cloak x-html="aporteGrifoHtml()"></div>

        <section class="aporte-outras" x-show="aporteCategoriasNaoRecebedoras.length > 0" x-cloak>
          <h2 class="aporte-section-label">Outras categorias (sem aporte)</h2>
          <template x-for="cat in aporteCategoriasNaoRecebedoras" :key="cat.nome">
            <p class="aporte-outras-row">
              <span x-text="`▸ ${cat.nome}`"></span>
              <span x-text="`${cat.atualPct.toFixed(1).replace('.', ',')}% · alvo ${cat.alvoPct}% (${cat.label})`"></span>
            </p>
          </template>
        </section>

        <section class="aporte-pausados" x-show="aportePausados.length > 0" x-cloak>
          <p>
            <strong>Acima do alvo (não aporta)</strong><br>
            <template x-for="(ticker, i) in aportePausados" :key="ticker">
              <span>
                <span class="aporte-pausados-tk" x-text="ticker"></span>
                <span x-show="i < aportePausados.length - 1"> · </span>
              </span>
            </template>
          </p>
        </section>

        <p class="aporte-sem-posicao" x-show="aporteTickersSemPosicao.length > 0" x-cloak>
          <span>Tickers da política sem posição vigente (sem cotação para incluir no cálculo): </span>
          <span x-text="aporteTickersSemPosicao.join(', ')"></span>
        </p>

        <!-- 7a.BW.5: o pedido do Comitê (js/comite.js). Abaixo do plano da
             regra, que fica como está (spec 7a.BW §13.1). Um toque envia,
             sem modal; os campos opcionais ficam recolhidos. A resposta
             lado a lado chega na BW.6. -->
        <section class="comite-bloco" aria-labelledby="comite-titulo" x-init="comiteIniciar()">
          <h2 class="comite-titulo" id="comite-titulo">Comitê</h2>
          <p class="comite-ajuda">O Comitê lê a carteira e propõe onde pôr este aporte, ao lado do plano da regra acima.</p>

          <details class="comite-opcoes">
            <summary>Remessa, nota e horário</summary>
            <div class="comite-campo">
              <label for="comite-remetido">Já remeti para a Avenue (US$)</label>
              <input id="comite-remetido" class="comite-input" type="text" inputmode="decimal"
                     autocomplete="off" placeholder="0" x-model="comiteRemetido"
                     :aria-invalid="comiteErroCampo ? 'true' : 'false'"
                     aria-describedby="comite-remetido-erro">
              <p class="comite-erro" id="comite-remetido-erro" x-show="comiteErroCampo" x-text="comiteErroCampo" x-cloak></p>
            </div>
            <div class="comite-campo">
              <label for="comite-nota">Nota para o Comitê</label>
              <textarea id="comite-nota" class="comite-input comite-nota" rows="3"
                        :maxlength="comiteNotaMax" x-model="comiteNota"
                        aria-describedby="comite-nota-conta"></textarea>
              <p class="comite-conta" id="comite-nota-conta" x-text="comiteNota.length + '/' + comiteNotaMax"></p>
            </div>
            <div class="comite-campo comite-campo--check">
              <input id="comite-agora" type="checkbox" x-model="comiteAgora" aria-describedby="comite-agora-ajuda">
              <label for="comite-agora">Rodar agora</label>
              <p class="comite-ajuda-campo" id="comite-agora-ajuda">Sem marcar, roda às 3h30. Agora pode falhar se você estiver usando o Claude, porque a cota é a mesma.</p>
            </div>
          </details>

          <button type="button" class="comite-pedir" @click="comiteEnviar()"
                  :disabled="comiteBotaoDesabilitado()"
                  :aria-busy="comiteEstado === 'enviando' ? 'true' : 'false'"
                  x-text="comiteBotaoTexto()">Pedir proposta</button>
          <p class="comite-ajuda-campo" x-show="!(comiteValor() > 0)" x-cloak>Digite o valor acima para pedir uma proposta.</p>

          <p class="comite-status" :data-estado="comiteEstado" aria-live="polite" x-text="comiteMensagem"></p>
          <button type="button" class="comite-reenviar" x-show="comiteTemRascunho()" x-cloak
                  @click="comiteReenviar()" x-text="comiteTextoReenviar()"></button>

          <!-- 7a.BW.6: a resposta, lado a lado com a regra (§13.1, D5). x-if:
               sem resposta decifrada o nó não existe. Coluna do Comitê antes
               da Regra; a razão principal é o grifo único da tela (ou o aviso
               de dado velho, quando os dados passaram de 35 dias); argumento
               contrário visível, nada recolhido. -->
          <template x-if="comiteAtual()">
            <article class="comite-resposta" aria-labelledby="comite-resposta-cab">
              <p class="comite-cabeca" id="comite-resposta-cab" x-text="comiteCabecalho()"></p>
              <template x-if="comiteAntiga()">
                <p class="comite-rotulo comite-antiga" x-text="comiteTextoAntiga()"></p>
              </template>
              <p class="comite-rotulo comite-outro-valor" x-show="comiteOutroValor()" x-text="comiteTextoOutroValor()"></p>
              <template x-if="comiteDadoVelho() || comiteTextoIdade()">
                <p class="comite-idade" :class="{ 'grifo comite-dado-velho': comiteDadoVelho() }" x-text="comiteTextoIdade()"></p>
              </template>

              <template x-if="comiteTemProposta()">
                <p class="comite-razao" :class="{ grifo: !comiteDadoVelho() }" x-text="comiteAtual().comite.razao_principal"></p>
              </template>
              <template x-if="!comiteTemProposta()">
                <p class="comite-recusa" x-text="comiteTextoRecusa()"></p>
              </template>

              <table class="comite-comparacao">
                <caption x-text="comiteTemProposta() ? 'O que o Comitê propõe, ao lado da regra' : 'O plano da regra'"></caption>
                <thead>
                  <tr>
                    <th scope="col"><span class="sr-only">Ativo</span></th>
                    <template x-if="comiteTemProposta()"><th scope="col" class="comite-col">Comitê</th></template>
                    <th scope="col" class="comite-col">Regra</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="l in comiteLinhas()" :key="l.ticker">
                    <tr class="comite-linha" :data-ticker="l.ticker" :data-dif="l.dif">
                      <th scope="row">
                        <span class="comite-tk" x-text="l.ticker"></span>
                        <span class="comite-dif" x-show="l.dif" x-text="l.dif"></span>
                      </th>
                      <template x-if="comiteTemProposta()">
                        <td class="comite-num comite-col-comite" :class="{ 'comite-num--nada': l.comite == null }" x-text="comiteFmt(l.comite)"></td>
                      </template>
                      <td class="comite-num comite-col-regra" :class="{ 'comite-num--nada': l.regra == null }" x-text="comiteFmt(l.regra)"></td>
                    </tr>
                  </template>
                </tbody>
                <tfoot>
                  <tr class="comite-linha-custo">
                    <th scope="row">Custo estimado</th>
                    <template x-if="comiteTemProposta()">
                      <td class="comite-num" x-text="comiteCusto('comite')"></td>
                    </template>
                    <td class="comite-num" x-text="comiteCusto('regra')"></td>
                  </tr>
                </tfoot>
              </table>
              <p class="comite-custo-nota" x-text="comiteCustoNota()"></p>
              <template x-if="comiteEconomia()">
                <p class="comite-economia" x-text="comiteEconomia()"></p>
              </template>

              <template x-if="comiteTemProposta()">
                <div class="comite-leitura">
                  <template x-if="(comiteAtual().comite.porque || []).length">
                    <section class="comite-parte">
                      <h3 class="comite-parte__tit">Por quê</h3>
                      <ul class="comite-porque">
                        <template x-for="(p, i) in comiteAtual().comite.porque" :key="i">
                          <li x-text="p.texto"></li>
                        </template>
                      </ul>
                    </section>
                  </template>
                  <template x-if="comiteRisco()">
                    <section class="comite-parte">
                      <h3 class="comite-parte__tit">Risco e retorno</h3>
                      <p class="comite-risco" x-text="comiteRisco()"></p>
                    </section>
                  </template>
                  <section class="comite-parte">
                    <h3 class="comite-parte__tit">Argumento contrário</h3>
                    <p class="comite-contrario" x-text="comiteAtual().comite.argumento_contrario"></p>
                  </section>
                  <section class="comite-parte">
                    <h3 class="comite-parte__tit">O que mudaria a proposta</h3>
                    <p class="comite-mudaria" x-text="comiteAtual().comite.o_que_mudaria"></p>
                  </section>
                  <p class="comite-confianca" x-text="comiteConfianca()"></p>
                </div>
              </template>

              <template x-if="comiteAvisos().length">
                <ul class="comite-avisos">
                  <template x-for="(a, i) in comiteAvisos()" :key="i">
                    <li x-text="a"></li>
                  </template>
                </ul>
              </template>
            </article>
          </template>
          <template x-if="comiteResposta">
            <a class="comite-link-registros" href="#comite"><span x-text="comiteLinkRegistros()"></span> <span aria-hidden="true">›</span></a>
          </template>
        </section>
      </section>

      <!-- ── Tela #comite (Fase 7a.BW.6) ──────────────────────────────────
           Push child da tab Aportar: os registros estratégicos do Comitê
           (do mais novo ao mais antigo) e a linha do placar. Leitura pura. -->
      <section class="tela-detalhes tela-comite" x-show="rota === 'comite'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        aria-labelledby="comite-tela-titulo" x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent" id="comite-tela-titulo">Comitê</h1>
        </header>
        <p class="comite-tela-ajuda">O que o Comitê anotou para a revisão estrutural da política. Os registros nunca mexem no aporte.</p>
        <template x-if="comiteResposta">
          <div>
            <p class="comite-placar" x-text="comitePlacar()"></p>
            <p class="comite-ultima" x-show="comiteUltimaRodada()" x-text="comiteUltimaRodada()"></p>
          </div>
        </template>
        <template x-if="comiteRegistros().length === 0">
          <p class="comite-vazio">Nenhum registro ainda. Eles chegam com cada proposta e na rodada mensal do dia 12.</p>
        </template>
        <ol class="comite-registros" x-show="comiteRegistros().length > 0">
          <template x-for="r in comiteRegistros()" :key="r.id">
            <li class="comite-registro" :data-tipo="r.tipo">
              <p class="comite-registro__cab">
                <span class="comite-registro__tipo" x-text="comiteTipoRegistro(r.tipo)"></span>
                <span class="comite-registro__data" x-text="comiteData(r.criado_em)"></span>
              </p>
              <p class="comite-registro__texto" x-text="r.texto"></p>
              <template x-if="(r.evidencias || []).length">
                <div class="comite-registro__bloco">
                  <p class="comite-registro__rot">Evidências</p>
                  <ul class="comite-registro__evidencias">
                    <template x-for="(e, i) in r.evidencias" :key="i"><li x-text="comiteEvidencia(e)"></li></template>
                  </ul>
                </div>
              </template>
              <template x-if="r.confirmaria">
                <p class="comite-registro__confirmaria"><span class="comite-registro__rot">Confirmaria</span> <span x-text="r.confirmaria"></span></p>
              </template>
              <template x-if="r.derrubaria">
                <p class="comite-registro__derrubaria"><span class="comite-registro__rot">Derrubaria</span> <span x-text="r.derrubaria"></span></p>
              </template>
              <template x-if="(r.tickers || []).length">
                <p class="comite-registro__tickers" x-text="r.tickers.join(', ')"></p>
              </template>
            </li>
          </template>
        </ol>
      </section>

      <!-- ── Tela #relatorio (Fase 7a.Q.3) ──────────────────────────────── -->
      <section class="tela-detalhes tela-relatorio" x-show="rota === 'relatorio'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        x-cloak>
        <header class="breadcrumb rel-breadcrumb">
          <button @click="voltarDoRelatorio()" aria-label="Voltar ao Raio-X" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent">Relatório</h1>
          <div class="rel-seletor" @keydown.escape="relSeletorAberto = false">
            <button class="rel-seletor__btn" type="button"
              :aria-expanded="relSeletorAberto"
              @click="relSeletorAberto = !relSeletorAberto">
              <span x-text="relMes ? formatMesAno(relMes.mes) : 'Meses'"></span>
              <span aria-hidden="true">▾</span>
            </button>
            <ul class="rel-seletor__lista" x-show="relSeletorAberto" x-cloak
              @click.outside="relSeletorAberto = false">
              <template x-for="m in (relIndice?.meses || [])" :key="m.mes">
                <li>
                  <button class="rel-seletor__item" type="button"
                    :class="m.mes === relMesAtual ? 'is-atual' : ''"
                    @click="selecionarMesRelatorio(m.mes)">
                    <span x-text="formatMesAno(m.mes)"></span>
                    <!-- 7a.S.9 Task 2: evento mensal — ponto "não lido" por mês. -->
                    <span class="rel-dot" x-show="!mesLido(m.mes)" aria-hidden="true" x-cloak></span>
                    <span class="sr-only" x-show="!mesLido(m.mes)" x-cloak>não lido</span>
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </header>

        <!-- 7a.S.9 Task 1: capa editorial — mês em poster + veredito derivado
             do artefato (NUNCA fabricado: 1ª frase da seção "leitura_mes"). -->
        <div class="rel-capa" x-show="relMes && !relCarregando && !relErro" x-cloak>
          <div class="rel-poster">
            <span x-text="relPosterMes"></span><br>
            <span x-text="relPosterAno"></span>
          </div>
          <p class="rel-veredito-linha" x-show="relVeredito" x-cloak>
            <b>Veredito do mês:</b> <span x-text="relVeredito"></span>
          </p>
        </div>

        <div class="rel-loading" x-show="relCarregando" x-cloak aria-live="polite">
          <div class="rel-skeleton"></div>
          <div class="rel-skeleton"></div>
          <div class="rel-skeleton rel-skeleton--short"></div>
        </div>

        <div class="rel-erro" x-show="!relCarregando && relErro" x-cloak>
          <p x-text="relErro"></p>
          <button class="rel-erro__voltar" type="button" x-show="relUltimoMes"
            @click="selecionarMesRelatorio(relUltimoMes.mes)">Voltar ao último mês</button>
        </div>

        <div class="rel-vazio" x-show="!relCarregando && !relErro && !relMes" x-cloak>
          <p>Ainda não há relatórios publicados.</p>
        </div>

        <template x-if="relMes && !relCarregando && !relErro">
          <div class="rel-corpo">
            <template x-for="sec in (relMes.secoes || [])" :key="sec.id">
              <section class="rel-secao" :class="classeSecao(sec.id)" :data-secao="sec.id">
                <h2 class="rel-secao__titulo" x-text="sec.titulo"></h2>
                <div class="rel-prosa" x-html="prosaParaHtml(sec.corpo, relMes.citacoes)"></div>
                <!-- enriquecimentos por id -->
                <template x-if="sec.id === 'radar'">
                  <ul class="rel-radar">
                    <template x-for="r in radarFiltrado(false)" :key="r.ticker">
                      <li class="rel-radar-card">
                        <div class="rel-radar-card__head">
                          <!-- 7a.R.3.b: ticker com dossiê vira link; sem dossiê
                               fica texto. Dois x-if mutuamente exclusivos (não
                               x-show: este deixaria os DOIS nós no DOM). O
                               .rel-selo ao lado não muda. -->
                          <template x-if="temDossie(r.ticker)">
                            <a class="rel-radar-card__ticker rel-radar-card__ticker--link"
                              :href="'#/dossie/' + r.ticker"
                              @click="registrarOrigemDossie()"
                              x-text="r.ticker"></a>
                          </template>
                          <template x-if="!temDossie(r.ticker)">
                            <span class="rel-radar-card__ticker" x-text="r.ticker"></span>
                          </template>
                          <span class="rel-selo" :class="vereditoSelo(r.veredito).classe">
                            <span class="rel-selo__marca" aria-hidden="true"
                              x-text="vereditoSelo(r.veredito).marca"></span>
                            <span x-text="vereditoSelo(r.veredito).label"></span>
                          </span>
                        </div>
                        <!-- 7a.AT.1: blocos rotulados. O conteudo passa pelo
                             renderizador de marcacao: o `gatilho` agora carrega
                             o evento numa linha e as duas condicoes em lista. -->
                        <div class="rel-bloco">
                          <span class="rel-bloco__rotulo">Observar</span>
                          <div class="rel-bloco__corpo"
                            x-html="prosaParaHtml(r.observar, relMes.citacoes)"></div>
                        </div>
                        <div class="rel-bloco">
                          <span class="rel-bloco__rotulo">Gatilho</span>
                          <div class="rel-bloco__corpo"
                            x-html="prosaParaHtml(r.gatilho, relMes.citacoes)"></div>
                        </div>
                      </li>
                    </template>
                  </ul>
                </template>
                <template x-if="sec.id === 'nao_funcionando'">
                  <div class="rel-veredito" x-show="radarFiltrado(true).length > 0">
                    <template x-for="r in radarFiltrado(true)" :key="'sel-' + r.ticker">
                      <span class="rel-selo" :class="vereditoSelo(r.veredito).classe">
                        <span class="rel-selo__marca" aria-hidden="true"
                          x-text="vereditoSelo(r.veredito).marca"></span>
                        <span x-text="r.ticker + ' · ' + vereditoSelo(r.veredito).label"></span>
                      </span>
                    </template>
                  </div>
                </template>
                <template x-if="sec.id === 'como_voce_foi'">
                  <div class="rel-kpis">
                    <div class="kpi">
                      <span class="kpi-label">Retorno do mês</span>
                      <span class="kpi-valor" x-text="formatPct(relMes.dossie?.performance?.Total?.retorno_mes_pct)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">CDI</span>
                      <span class="kpi-valor" x-text="formatPct(relMes.dossie?.performance?.Total?.benchmarks?.CDI)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">IBOV</span>
                      <span class="kpi-valor" x-text="formatPct(relMes.dossie?.performance?.Total?.benchmarks?.IBOV)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">S&amp;P 500</span>
                      <span class="kpi-valor" x-text="formatPct(relMes.dossie?.performance?.Total?.benchmarks?.SP500)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">Aportes líq.</span>
                      <span class="kpi-valor" x-text="formatBrl(relMes.dossie?.decomposicao?.Total?.aportes_liq_brl)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">Proventos</span>
                      <span class="kpi-valor" x-text="formatBrl(relMes.dossie?.decomposicao?.Total?.proventos_brl)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">Mercado</span>
                      <span class="kpi-valor" :class="(relMes.dossie?.decomposicao?.Total?.mercado_brl ?? 0) < 0 ? 'is-neg' : ''"
                        x-text="formatBrl(relMes.dossie?.decomposicao?.Total?.mercado_brl)"></span>
                    </div>
                  </div>
                </template>
                <template x-if="sec.id === 'renda'">
                  <div class="rel-kpis">
                    <div class="kpi">
                      <span class="kpi-label">Proventos do mês</span>
                      <span class="kpi-valor" x-text="formatBrl(relMes.dossie?.renda?.proventos_mes_brl)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">Proventos 12m</span>
                      <span class="kpi-valor" x-text="formatBrl(relMes.dossie?.renda?.proventos_12m_brl)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">DY carteira</span>
                      <span class="kpi-valor" x-text="formatPct(relMes.dossie?.renda?.dy_trailing?.total?.dy)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">Run-rate anual</span>
                      <span class="kpi-valor" x-text="formatBrl(relMes.dossie?.renda?.run_rate_mes_anualizado_brl)"></span>
                    </div>
                  </div>
                </template>
                <template x-if="sec.id === 'alinhamento'">
                  <ul class="rel-concentracao">
                    <template x-for="c in (relMes.dossie?.alinhamento?.concentracao_top || [])" :key="c.ticker">
                      <li>
                        <span class="flag" aria-hidden="true" x-text="c.bandeira"></span>
                        <span class="rel-conc__ticker" x-text="c.ticker"></span>
                        <span class="rel-conc__peso" x-text="formatPct(c.peso)"></span>
                        <span class="rel-conc__valor" x-text="formatBrl(c.valor_brl)"></span>
                      </li>
                    </template>
                  </ul>
                </template>
                <template x-if="sec.id === 'prestacao_contas'">
                  <ul class="rel-prestacao" x-show="(relMes.prestacao_contas || []).length > 0">
                    <template x-for="p in (relMes.prestacao_contas || [])" :key="'pc-' + p.ticker">
                      <li>
                        <div class="rel-prestacao__head">
                          <template x-if="temDossie(p.ticker)">
                            <a class="rel-prestacao__ticker rel-prestacao__ticker--link"
                              :href="'#/dossie/' + p.ticker"
                              @click="registrarOrigemDossie()"
                              x-text="p.ticker"></a>
                          </template>
                          <template x-if="!temDossie(p.ticker)">
                            <span class="rel-prestacao__ticker" x-text="p.ticker"></span>
                          </template>
                          <!-- 7a.AT.1: pertencimento ANTES de vereditoSelo — aquela
                               funcao devolve "Tese intacta" p/ valor desconhecido,
                               entao um typo renderizaria o selo mais otimista.
                               Relatorio antigo nao tem `veredito`: fica sem selo. -->
                          <template x-if="temSeloVeredito(p.veredito)">
                            <span class="rel-selo" :class="vereditoSelo(p.veredito).classe">
                              <span class="rel-selo__marca" aria-hidden="true"
                                x-text="vereditoSelo(p.veredito).marca"></span>
                              <span x-text="vereditoSelo(p.veredito).label"></span>
                            </span>
                          </template>
                        </div>
                        <div class="rel-bloco">
                          <span class="rel-bloco__rotulo">O que eu disse</span>
                          <div class="rel-bloco__corpo rel-prestacao__sin"
                            x-html="prosaParaHtml(p.sinalizado, relMes.citacoes)"></div>
                        </div>
                        <div class="rel-bloco">
                          <span class="rel-bloco__rotulo">O que aconteceu</span>
                          <div class="rel-bloco__corpo rel-prestacao__res"
                            x-html="prosaParaHtml(p.resultado, relMes.citacoes)"></div>
                        </div>
                      </li>
                    </template>
                  </ul>
                </template>
                <template x-if="sec.id === 'evidencias'">
                  <ol class="rel-evidencias" id="rel-evidencias">
                    <template x-for="c in (relMes.citacoes || [])" :key="'cit-' + c.id">
                      <li :value="c.id">
                        <!-- 7a.AT.1: a lista de fontes injetava `c.url` CRU, sem
                             checar esquema — segundo vetor do mesmo furo que o
                             renderizador fechou, achado pelo teste da fase (o
                             varredor olha TODO `a.rel-cit` da pagina, nao so os
                             da prosa). Mesma allowlist, mesmo alvo condicional. -->
                        <a class="rel-cit" :href="_hrefCitacaoSegura(c.url)"
                          :target="_hrefCitacaoSegura(c.url) === '#rel-evidencias' ? null : '_blank'"
                          :rel="_hrefCitacaoSegura(c.url) === '#rel-evidencias' ? null : 'noopener'"
                          x-text="c.afirmacao"></a>
                        <span class="rel-evid__fonte" x-text="' — ' + c.fonte"></span>
                        <span class="rel-evid__incerto" x-show="c.confianca === 'baixa'"> · <em>sinal incerto</em></span>
                      </li>
                    </template>
                  </ol>
                </template>
              </section>
            </template>
          </div>
        </template>
      </section>

      <!-- ── Tela #/dossie/<TICKER> — dossiê de empresa (7a.R.3.b) ───────
           Memória viva: por que eu tenho isso, e contra qual tese. NÃO é um
           segundo #ativo (spec §6.1): zero preço, zero DY, zero KPI vivo. -->
      <section class="tela-detalhes tela-dossie" x-show="rota === 'dossie'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltarDoDossie()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent">Dossiê</h1>
        </header>

        <!-- Estados espelham os do Relatório por seletor agrupado no CSS, mas
             com classes PRÓPRIAS: um segundo `.rel-erro`/`.rel-vazio` no DOM
             faria os locators sem escopo de relatorio-mensal.spec.ts
             resolverem a 2 elementos (strict mode). -->
        <div class="dossie-loading" x-show="dossieCarregando" x-cloak aria-live="polite">
          <div class="dossie-skeleton"></div>
          <div class="dossie-skeleton"></div>
          <div class="dossie-skeleton dossie-skeleton--short"></div>
        </div>

        <div class="dossie-erro" x-show="!dossieCarregando && dossieErro" x-cloak>
          <p x-text="dossieErro"></p>
          <button class="dossie-erro__acao" type="button"
            @click="carregarDossie(dossieTicker)">Tentar de novo</button>
        </div>

        <div class="dossie-vazio" x-show="!dossieCarregando && !dossieErro && !dossieAtual" x-cloak>
          <p>Ainda não há dossiê para este ativo.</p>
        </div>

        <template x-if="dossieAtual && !dossieCarregando && !dossieErro">
          <div class="dossie-corpo">
            <!-- 1. Cabeçalho -->
            <div class="dossie-cabecalho">
              <div class="dossie-cabecalho__linha">
                <span class="dossie-dot" aria-hidden="true"
                  :style="dossieCatStyle(dossieAtual.categoria)"></span>
                <span class="flag" aria-hidden="true"
                  x-text="dossieBandeira(dossieAtual.escopo)"></span>
                <span class="dossie-ticker" x-text="dossieAtual.ticker"></span>
              </div>
              <p class="dossie-sub" x-text="dossieSubtitulo"></p>
            </div>

            <!-- 2. Mini-mapa do arco: glifos de veredito sob os anos. Forma +
                 texto (par .sr-only), nunca cor sozinha. -->
            <div class="dossie-arco" x-show="dossieArco.length" x-cloak>
              <ol class="dossie-arco__linha" aria-hidden="true">
                <template x-for="(p, i) in dossieArco" :key="i">
                  <li class="dossie-arco__ponto">
                    <span class="dossie-arco__ano" x-text="p.rotuloAno"></span>
                    <span class="dossie-arco__marca" x-text="p.marca"></span>
                  </li>
                </template>
              </ol>
              <span class="sr-only" x-text="'Arco da tese: ' + dossieArcoTexto"></span>
            </div>

            <!-- 3. Linha de frescor -->
            <p class="dossie-frescor" x-show="dossieFrescor" x-cloak
              x-text="dossieFrescor"></p>

            <!-- 4. TESE — lidera a tela: é a invariante compartilhada pelos
                 dois caminhos de chegada ("por que eu tenho isso?" e "sob
                 pressão contra o quê?"). O grifo accent no `quebra_se` é a
                 ÚNICA ocorrência da tela (anti-pattern #14). -->
            <section class="dossie-tese">
              <h2 class="dossie-h">Tese</h2>
              <div class="rel-prosa" x-text="dossieAtual.tese?.resumo"></div>
              <!-- x-if (não x-show): sem `quebra_se` o grifo não deve EXISTIR.
                   Com x-show o nó ficaria no DOM, tornando a invariante "uma
                   .grifo por tela" invisível ao teste e deixando um nó fantasma
                   para o leitor de tela. -->
              <template x-if="dossieAtual.tese?.quebra_se">
                <div class="grifo dossie-grifo">
                  <span class="dossie-grifo__rot">A tese quebra se</span>
                  <p x-text="dossieAtual.tese?.quebra_se"></p>
                </div>
              </template>
              <p class="dossie-revisada" x-show="dossieAtual.tese?.revisada_em" x-cloak
                x-text="'Tese revisada em ' + formatDataIso(dossieAtual.tese?.revisada_em)"></p>
              <!-- Selo DERIVADO (7a.AD.2): fora do `.grifo` de propósito — a
                   tela já gastou seu único grifo no `quebra_se` (anti-pattern
                   #14) e o selo não pode competir com ele. Fecha o bloco da
                   tese porque é a leitura FINAL dela: "esta aqui envelheceu".
                   A11y em forma + TEXTO: o glifo é decorativo, o texto é real
                   e é o que o leitor de tela lê — nunca cor sozinha. -->
              <p class="dossie-pede-revisao" x-show="dossiePedeRevisao" x-cloak>
                <span aria-hidden="true">⟳</span>
                <span>esta tese pede revisão</span>
              </p>
            </section>

            <!-- 5. LINHA DO TEMPO — ordem cronológica ASCENDENTE, todas as
                 entradas abertas. Documento contínuo separado por hairline;
                 sem card por entrada, sem espinha vertical, sem side-stripe
                 (#14 já gasto no grifo da tese). Nada é colapsável: com 3 a 5
                 entradas o scroll É a leitura, e o mini-mapa já orienta. -->
            <section class="dossie-tl">
              <h2 class="dossie-h">Linha do tempo</h2>
              <p class="dossie-tl-vazio" x-show="!(dossieAtual.timeline || []).length"
                x-cloak>sem entradas ainda</p>
              <template x-for="(e, i) in (dossieAtual.timeline || [])" :key="e.data + '-' + i">
                <article class="dossie-tl__item">
                  <div class="dossie-tl__marco">
                    <h3 class="dossie-tl__data" x-text="formatMarcoMes(e.data)"></h3>
                    <span class="rel-selo" :class="vereditoSelo(e.veredito).classe">
                      <span class="rel-selo__marca" aria-hidden="true"
                        x-text="vereditoSelo(e.veredito).marca"></span>
                      <span x-text="vereditoSelo(e.veredito).label"></span>
                    </span>
                  </div>
                  <p class="dossie-tl__gatilho" x-show="e.gatilho" x-cloak
                    x-text="e.gatilho"></p>
                  <div class="rel-prosa" x-html="leituraParaHtml(e.leitura)"></div>
                  <dl class="dossie-numeros"
                    x-show="paresNumeros(e.numeros_reportados).length" x-cloak>
                    <template x-for="(p, j) in paresNumeros(e.numeros_reportados)" :key="j">
                      <div class="dossie-numeros__par">
                        <dt x-show="p.rotulo" x-text="p.rotulo"></dt>
                        <dd x-text="p.valor"></dd>
                      </div>
                    </template>
                  </dl>
                  <ul class="dossie-fontes">
                    <template x-for="(f, k) in (e.fontes || [])" :key="k">
                      <li>
                        <!-- Dois x-if mutuamente exclusivos: x-show deixaria os
                             DOIS nós no DOM (nó fantasma + locator a 2). -->
                        <template x-if="urlFonteSegura(f.url)">
                          <a :href="urlFonteSegura(f.url)" target="_blank" rel="noopener"
                            x-text="f.titulo"></a>
                        </template>
                        <template x-if="!urlFonteSegura(f.url)">
                          <span x-text="f.titulo"></span>
                        </template>
                      </li>
                    </template>
                  </ul>
                </article>
              </template>
            </section>
          </div>
        </template>
      </section>

      </div>
    </template>

    <template x-if="fase === 'raiox'">
      <nav class="tab-bar" role="navigation" aria-label="Navegação principal">
        <span class="tab-bar-indicator" aria-hidden="true"></span>
        <a href="#" data-tab="raiox" :aria-current="tab === 'raiox' ? 'page' : null" @click.prevent="rota = ''; tab = 'raiox'; history.replaceState(null, '', location.pathname); $nextTick(() => iniciarAbertura())">Raio-X</a>
        <a href="#rentabilidade" data-tab="rentab" :aria-current="tab === 'rentab' ? 'page' : null">Rentabilidade</a>
        <a href="#alocacao" data-tab="aloca" :aria-current="tab === 'aloca' ? 'page' : null">Alocação</a>
        <a href="#proventos" data-tab="provent" :aria-current="tab === 'provent' ? 'page' : null">Proventos</a>
        <a href="#aportar" data-tab="aportar" :aria-current="tab === 'aportar' ? 'page' : null">Aportar</a>
      </nav>
    </template>
  </main>

  <!-- Aviso de nova versão do app (shell). Surge via evento window
       "sw:update-available" (js/sw-update.js) → estado atualizacaoDisponivel.
       Superfície teal sólida; sem border-left; copy sem travessão. -->
  <div class="update-snackbar versao-snackbar" x-show="atualizacaoDisponivel && !acessoVencido"
       x-transition:enter="us-enter"
       x-transition:enter-start="us-enter-start"
       x-transition:enter-end="us-enter-end"
       role="status" aria-live="polite" x-cloak>
    <span class="update-snackbar__icone" aria-hidden="true">↻</span>
    <span class="update-snackbar__texto">Nova versão disponível</span>
    <button type="button" class="update-snackbar__acao" @click="recarregarVersao()">Recarregar</button>
    <button type="button" class="update-snackbar__fechar" @click="dispensarAtualizacao()"
            aria-label="Dispensar aviso">✕</button>
  </div>

  <!-- 7a.BW.2: sessão do Cloudflare Access vencida. A carteira na tela é a
       última guardada; "Entrar" abre o login (código por e-mail). Mesma
       superfície do aviso de nova versão, que cede a vez a este. -->
  <div class="update-snackbar acesso-snackbar" x-show="acessoVencido"
       x-transition:enter="us-enter"
       x-transition:enter-start="us-enter-start"
       x-transition:enter-end="us-enter-end"
       role="status" aria-live="polite" x-cloak>
    <span class="update-snackbar__texto">Sessão expirada. Entre para atualizar a carteira.</span>
    <button type="button" class="update-snackbar__acao" @click="entrarDeNovo()">Entrar</button>
    <button type="button" class="update-snackbar__fechar" @click="dispensarAcessoVencido()"
            aria-label="Dispensar aviso">✕</button>
  </div>
</body>
</html>
