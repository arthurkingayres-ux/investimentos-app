<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#064e3b">
  <title>Carteira Arthur</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="css/app.css?v=93">
  <script src="js/vendor/echarts.min.js?v=40"></script>
  <script src="js/echarts-theme.js?v=41"></script>
  <script src="js/crypto.js?v=64"></script>
  <script src="js/format.js?v=46"></script>
  <script src="js/transitions.js?v=41"></script>
  <script src="js/aportar.js?v=42"></script>
  <script src="js/comite.js?v=8"></script>
  <script src="js/app.js?v=100"></script>
  <script defer src="js/vendor/alpine.min.js?v=40"></script>
  <script src="js/sw-update.js?v=2"></script>
</head>
<body x-data="app" x-cloak>
  <div
    class="toast"
    :class="toast.tom ? ('toast-' + toast.tom) : ''"
    x-show="toast.visible"
    x-transition.opacity
    role="status"
    aria-live="polite"
    x-text="toast.mensagem"></div>
  <main>
    <!-- 7a.W.3.b — cadastro da frase de acesso. Cerimônia sóbria, vista uma
         vez por aparelho: a gravidade comunica que aquela frase importa.
         Estratégia Restrained (default do produto), nenhuma cor nova, peso
         vindo de espaço e tipografia. Âncoras: página de rosto de livro,
         recibo de cartório, o hero Monument. Rejeitados por reflexo de
         categoria: cadeado, escudo, terminal escuro, mono-verde. -->
    <template x-if="fase === 'frase'">
      <section class="frase-screen">
        <p class="eyebrow" x-text="fraseMotivo === 'republicado'
             ? 'A CARTEIRA FOI REPUBLICADA'
             : 'PRIMEIRO ACESSO NESTE APARELHO'"></p>
        <h1 x-text="fraseMotivo === 'republicado'
             ? 'Uma frase nova'
             : 'Sua frase de acesso'"></h1>

        <template x-if="fraseEtapa === 'frase'">
          <form @submit.prevent="submitFrase">
            <p class="frase-razao" x-text="fraseMotivo === 'republicado'
                 ? 'A carteira foi republicada com uma frase nova. Digite a frase atual para voltar a abrir neste aparelho.'
                 : 'Seis palavras. Elas abrem a carteira neste aparelho e não ficam em nenhum servidor.'"></p>
            <!-- Campo ÚNICO de texto, não seis caixinhas: caixinhas viram OTP,
                 brigam com colar e forçam navegação entre campos no teclado do
                 celular. VISÍVEL, porque ele precisa conferir as palavras.
                 autocapitalize/autocorrect/spellcheck desligados: o corretor do
                 celular destrói palavras diceware em silêncio, e este é o
                 detalhe que mais provavelmente arruinaria o fluxo. -->
            <label for="frase-input" class="sr-only">Frase de acesso</label>
            <input
              id="frase-input"
              class="frase-input"
              type="text"
              inputmode="text"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              autocomplete="off"
              x-model="frase"
              :disabled="carregando"
              placeholder="seis palavras separadas por espaço"
              autofocus>
            <p class="frase-contador" x-text="fraseTokens + ' de 6 palavras'"></p>
            <button type="submit" class="frase-submit"
              :disabled="carregando || fraseTokens !== 6">
              <span x-show="!carregando">Abrir a carteira</span>
              <span x-show="carregando">Abrindo…</span>
            </button>
            <p class="frase-erro" x-show="fraseErro" x-cloak role="alert" x-text="fraseErro"></p>
          </form>
        </template>

        <!-- Etapa 2, SÓ em aparelho virgem: o PIN local. Aparelho que já tem
             PIN guardado reusa o existente (spec §7.4). -->
        <template x-if="fraseEtapa === 'pin'">
          <form @submit.prevent="submitFrasePin">
            <p class="frase-razao">Escolha 6 dígitos para desbloquear no dia a dia. Eles ficam só neste aparelho.</p>
            <label for="frase-pin-input" class="sr-only">PIN deste aparelho</label>
            <input
              id="frase-pin-input"
              class="frase-pin-input pin-input"
              type="tel"
              inputmode="numeric"
              pattern="\d{6}"
              maxlength="6"
              autocomplete="off"
              x-model="frasePinNovo"
              :disabled="carregando"
              placeholder="••••••"
              autofocus>
            <button type="submit" class="frase-pin-submit pin-submit"
              :disabled="carregando || frasePinNovo.length !== 6">Guardar e entrar</button>
            <p class="frase-erro" x-show="fraseErro" x-cloak role="alert" x-text="fraseErro"></p>
          </form>
        </template>
      </section>
    </template>

    <template x-if="fase === 'pin'">
      <section class="pin-screen" :class="{ 'is-shaking': shake, 'pin-dissolve': pinDissolvendo }">
        <h1>Carteira</h1>
        <label for="pin-input" class="subtitle" x-show="!estaBloqueado">Digite o PIN para visualizar</label>
        <p class="subtitle pin-block-msg" x-show="estaBloqueado"
           x-text="'Muitas tentativas. Aguarde ' + bloqueioRestanteMin + ' min'"></p>
        <form @submit.prevent="submitPin">
          <input
            id="pin-input"
            type="tel"
            inputmode="numeric"
            pattern="\d{6}"
            maxlength="6"
            autocomplete="off"
            x-model="pin"
            :disabled="carregando || estaBloqueado"
            placeholder="••••••"
            class="pin-input"
            autofocus>
          <button type="submit"
            :disabled="carregando || estaBloqueado || pin.length !== 6"
            class="pin-submit">
            <span x-show="!carregando && !estaBloqueado">Entrar</span>
            <span x-show="carregando">Decifrando…</span>
            <span x-show="!carregando && estaBloqueado"
              x-text="'Aguarde ' + bloqueioRestanteMin + ' min'"></span>
          </button>
          <p class="pin-error" x-show="pinError && !estaBloqueado" x-text="pinError"></p>
        </form>
      </section>
    </template>

    <template x-if="fase === 'raiox'">
      <div>
      <section class="raiox" x-show="rota === ''" x-transition:enter.opacity.duration.220ms x-cloak
               x-init="iniciarAbertura()">
        <h1 class="eyebrow">Raio X</h1>
        <!-- 7a.S.12 — Modo Plantão: toggle ☽/☀ manual + persistido (localStorage
             "tema"), NUNCA prefers-color-scheme. Glifo decorativo (aria-hidden);
             o botão em si carrega o rótulo real via aria-label/aria-pressed. -->
        <button type="button" class="theme-toggle" @click="alternarTema()"
          :aria-pressed="tema === 'dark'" aria-label="Alternar tema (claro/plantão)">
          <span aria-hidden="true" x-text="tema === 'dark' ? '☀' : '☾'"></span>
        </button>

        <!-- 7a.S.5: o hero virou um card de facetas — tap/Enter/Space/dots
             ciclam 4 fatos read-only (patrimônio · divisão BR/EUA · variação
             7d · desde a origem). O conteúdo de #hero-body é gerido de forma
             imperativa (montarHeroFacetas/_renderHeroFace), no mesmo espírito
             de ativarCountUpHero — evita a reatividade do Alpine disputar com
             a transição de duas camadas (.hero-face.out/.on). -->
        <div class="hero"
             id="hero"
             role="button"
             tabindex="0"
             aria-label="Patrimônio — toque para alternar a leitura"
             x-init="montarHeroFacetas()"
             @click="ciclarHeroFacet()"
             @keydown.enter.prevent="ciclarHeroFacet()"
             @keydown.space.prevent="ciclarHeroFacet()">
          <div class="hero-meta">
            <p class="hero-label" id="hero-eyebrow">Patrimônio total</p>
            <!-- 7a.AE.3: este slot mostrava `atualizado_em` — o carimbo de
                 PUBLICAÇÃO. Numa noite ruim ele dizia "19 ago · 00:27" enquanto
                 a tela exibia o fechamento de 17/08. Não era ausência de
                 informação: era um sinal de frescor ERRADO ocupando o lugar.
                 O carimbo continua existindo (toast de `avaliarAtualizacao`),
                 mas deixou de ser o único sinal de frescor e deixou de ser
                 lido como se fosse a data do preço. -->
            <p class="hero-updated" x-text="frescorTexto()"></p>
          </div>
          <div class="hero-body" id="hero-body" aria-live="polite"></div>
          <div class="hero-facets" aria-label="Facetas do patrimônio">
            <template x-for="(label, i) in heroFacetLabels" :key="'fd-' + i">
              <button type="button"
                      class="fd"
                      :class="{ on: i === heroFacetAtivo }"
                      :aria-current="i === heroFacetAtivo"
                      :aria-label="'Faceta ' + (i + 1) + ' de 4: ' + label"
                      @click.stop="irParaFacetHero(i)"
                      @keydown.stop></button>
            </template>
          </div>
          <div class="hero-hint" :class="{ gone: heroFacetHintGone }" aria-hidden="true">
            <span>☞</span> toque no número
          </div>
        </div>
        <a href="#/raiox/chart" class="hero-chart-link" aria-label="Ver histórico completo do patrimônio">
          <span>Ver histórico</span>
          <span class="hero-chart-link__chevron" aria-hidden="true">›</span>
        </a>

        <!-- 7a.S.5 Task 2: quando o schema tem `ultimos_7d` mas ainda não há
             dado suficiente (DB recém-bootstrapped, sem snapshot ≥7d e sem
             movimentos na janela), uma frase curta substitui o silêncio
             total. Distinto do legado (schema < v2.13, sem `ultimos_7d`
             nenhum) — aí nem esta mensagem aparece. -->
        <p class="r7d-vazio"
           x-show="json.ultimos_7d && !ultimos7dVisivel()"
           x-cloak>
          Sem novidade por aqui nesta semana.
        </p>

        <section
          class="raiox-7d"
          aria-label="Últimos 7 dias"
          x-show="ultimos7dVisivel()"
          x-cloak>
          <header class="r7d-head">
            <span class="r7d-label">Últimos 7 dias</span>
            <span
              class="r7d-delta"
              :class="sinalClasse(json.ultimos_7d?.delta_patrim_brl)"
              x-text="formatDeltaR7d(json.ultimos_7d?.delta_patrim_brl, json.ultimos_7d?.delta_patrim_pct)"></span>
          </header>

          <div class="r7d-decomp">
            <div class="r7d-row">
              <span>Aportes líq.</span>
              <span
                :class="sinalClasse(json.ultimos_7d?.decomposicao?.aportes_liq_brl)"
                x-text="formatDecompR7d(json.ultimos_7d?.decomposicao?.aportes_liq_brl)"></span>
            </div>
            <div class="r7d-row">
              <span>Proventos</span>
              <span
                :class="sinalClasse(json.ultimos_7d?.decomposicao?.proventos_brl)"
                x-text="formatDecompR7d(json.ultimos_7d?.decomposicao?.proventos_brl)"></span>
            </div>
            <div class="r7d-row">
              <span>Mercado</span>
              <span
                :class="sinalClasse(json.ultimos_7d?.decomposicao?.mercado_brl)"
                x-text="formatDecompR7d(json.ultimos_7d?.decomposicao?.mercado_brl)"></span>
            </div>
          </div>

          <div
            class="r7d-movers"
            x-show="(json.ultimos_7d?.variacao_mercado || []).length > 0"
            x-cloak>
            <div class="r7d-movers-head">
              <span class="r7d-movers-title"><span class="r7d-movers-star" aria-hidden="true">★ </span>Variação no mercado</span>
              <span class="r7d-movers-cap">por impacto · R$</span>
            </div>
            <ul>
              <template x-for="(m, i) in (json.ultimos_7d?.variacao_mercado || [])"
                        :key="m.ticker + '-' + m.moeda + '-' + i">
                <li>
                  <span class="arr" :class="sinalClasse(m.impacto_brl)"
                        aria-hidden="true"
                        x-text="m.impacto_brl >= 0 ? '▲' : '▼'"></span>
                  <span class="tk" x-text="m.ticker"></span>
                  <span class="flag" aria-hidden="true" x-text="m.bandeira"></span>
                  <span class="rs" :class="sinalClasse(m.impacto_brl)"
                        x-text="formatBrlSigned(m.impacto_brl)"></span>
                  <span class="pc"
                        x-text="m.retorno_pct == null ? '' : formatPct(m.retorno_pct)"></span>
                </li>
              </template>
            </ul>
          </div>

          <!-- 7a.S.5 Task 2: semana ativa mas sem cotação-base pra rankear
               movers (ticker sem cotação ≤ base_data) — voz em vez de
               silêncio, sem confundir com "semana calma" (que não mostra
               nada aqui, de propósito, quando TUDO está vazio). -->
          <p class="r7d-movers-vazio"
             x-show="ultimos7dVisivel() && (json.ultimos_7d?.variacao_mercado || []).length === 0"
             x-cloak>
            Sem destaque de mercado nesta semana.
          </p>

          <div class="r7d-listas">
            <div class="r7d-lista" data-list="compras" x-show="(json.ultimos_7d?.compras || []).length > 0">
              <h3>Compras</h3>
              <ul>
                <template x-for="(item, idx) in (json.ultimos_7d?.compras || [])" :key="'c-' + item.ticker + '-' + item.moeda + '-' + idx">
                  <li>
                    <span class="ticker" x-text="item.ticker"></span>
                    <span class="qty" x-text="formatQtyR7d(item.quantidade)"></span>
                    <span class="valor" x-text="formatBrl(item.valor_brl)"></span>
                    <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                  </li>
                </template>
              </ul>
            </div>
            <div class="r7d-lista" data-list="vendas" x-show="(json.ultimos_7d?.vendas || []).length > 0">
              <h3>Vendas</h3>
              <ul>
                <template x-for="(item, idx) in (json.ultimos_7d?.vendas || [])" :key="'v-' + item.ticker + '-' + item.moeda + '-' + idx">
                  <li>
                    <span class="ticker" x-text="item.ticker"></span>
                    <span class="qty" x-text="formatQtyR7d(item.quantidade)"></span>
                    <span class="valor" x-text="formatBrl(item.valor_brl)"></span>
                    <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                  </li>
                </template>
              </ul>
            </div>
            <div class="r7d-lista" data-list="proventos" x-show="(json.ultimos_7d?.proventos || []).length > 0">
              <h3>Proventos</h3>
              <ul>
                <template x-for="(item, idx) in (json.ultimos_7d?.proventos || [])" :key="'p-' + item.ticker + '-' + item.tipo + '-' + idx">
                  <li>
                    <span class="ticker" x-text="item.ticker"></span>
                    <span class="qty" x-text="abreviarTipoR7d(item.tipo)"></span>
                    <span class="valor" x-text="formatBrl(item.valor_brl)"></span>
                    <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                  </li>
                </template>
              </ul>
            </div>
          </div>
        </section>

        <section class="aporte-bloco" aria-label="Último aporte">
          <p class="aporte-label">Último aporte</p>
          <template x-if="json.ultimo_aporte">
            <div>
              <div class="aporte-header">
                <div class="aporte-header-left">
                  <span class="aporte-data" x-text="formatDataCurta(json.ultimo_aporte.data)"></span>
                  <span class="aporte-ha"
                    x-text="json.ultimo_aporte.dias_atras === 0 ? 'hoje' : 'há ' + json.ultimo_aporte.dias_atras + ' dia' + (json.ultimo_aporte.dias_atras === 1 ? '' : 's')">
                  </span>
                </div>
                <span class="aporte-pill" x-text="formatBrl(json.ultimo_aporte.total_brl)"></span>
              </div>
              <template x-for="item in json.ultimo_aporte.itens" :key="item.ticker">
                <a class="aporte-item aporte-item-link" :href="'#ativo/' + item.ticker">
                  <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                  <div class="aporte-detalhes">
                    <span class="aporte-ticker" x-text="item.ticker"></span>
                    <span class="aporte-meta"
                      x-text="item.quantidade + ' cota' + (item.quantidade === 1 ? '' : 's') + ' · ' + formatBrl(item.preco_unitario) + ' por unidade'">
                    </span>
                  </div>
                  <span class="aporte-valor" x-text="formatBrl(item.valor_brl)"></span>
                </a>
              </template>
            </div>
          </template>
          <template x-if="!json.ultimo_aporte">
            <p class="aporte-vazio">Nenhum aporte por aqui ainda.</p>
          </template>
        </section>

        <!-- 7a.Q.3: card de entrada para o Relatório Mensal -->
        <a class="rel-card-home" x-show="relUltimoMes" href="#/raiox/relatorio"
           aria-label="Abrir relatório mensal do assessor" x-cloak>
          <div class="rel-card-home__meta">
            <span class="rel-card-home__label">
              Relatório do mês
              <!-- 7a.S.9 Task 2: evento mensal — ponto "não lido" (relRead). -->
              <span class="rel-dot" x-show="relUltimoMes && !mesLido(relUltimoMes.mes)"
                aria-hidden="true" x-cloak></span>
              <span class="sr-only" x-show="relUltimoMes && !mesLido(relUltimoMes.mes)"
                x-cloak>não lido</span>
            </span>
            <span class="rel-card-home__mes"
              x-text="relUltimoMes ? formatMesAno(relUltimoMes.mes) : ''"></span>
          </div>
          <span class="rel-card-home__chevron" aria-hidden="true">›</span>
        </a>

        <!-- 7a.AW.2: entrada da projeção, abaixo do Relatório, no mesmo idioma
             e empty-safe como ele (payload pré-v2.29 ou projecao null: some). -->
        <a class="proj-card-home" x-show="projResposta()" href="#/raiox/projecao"
           aria-label="Abrir projeção do patrimônio até os 65 anos" x-cloak>
          <div class="rel-card-home__meta">
            <span class="rel-card-home__label">Projeção até os 65</span>
            <span class="rel-card-home__mes" x-text="projCardTexto()"></span>
          </div>
          <span class="rel-card-home__chevron" aria-hidden="true">›</span>
        </a>

        <!-- 7a.BJ.2: renda da carteira, logo abaixo da projeção, no mesmo idioma
             e empty-safe (payload pré-v2.32 ou renda null: some). -->
        <a class="renda-card-home" x-show="renda" href="#/raiox/renda"
           aria-label="Abrir renda da carteira" x-cloak>
          <div class="rel-card-home__meta">
            <span class="rel-card-home__label">Renda da carteira</span>
            <span class="rel-card-home__mes" x-text="rendaCardTexto()"></span>
          </div>
          <span class="rel-card-home__chevron" aria-hidden="true">›</span>
        </a>

        <!-- 7a.BQ.2: Diagnóstico, logo abaixo da renda, no mesmo idioma e
             empty-safe (payload pré-v2.35, risco null ou parcial: some). Sem
             a janela Desde do Total, fica com o motivo no lugar do número. -->
        <a class="diag-card-home" x-show="risco" href="#/raiox/diagnostico"
           aria-label="Abrir diagnóstico da carteira" x-cloak>
          <div class="rel-card-home__meta">
            <span class="rel-card-home__label">Diagnóstico da carteira</span>
            <span class="diag-card-home__texto" x-text="diagCardTexto()"></span>
          </div>
          <span class="rel-card-home__chevron" aria-hidden="true">›</span>
        </a>

        <footer class="rodape">
          <p>Fonte: <code>investimentos.db</code> · doc-trail auditável</p>
          <button @click="bloquear" class="btn-bloquear" type="button">🔒 Bloquear sessão</button>
        </footer>
      </section>

      <section class="tela-detalhes tela-rentabilidade" x-show="rota === 'rentabilidade'" x-transition:enter.opacity.duration.220ms x-cloak>
        <header class="breadcrumb">
          <h1 class="eyebrow">Rentabilidade</h1>
        </header>

        <div class="escopo-toggle" role="tablist">
          <button
            data-escopo="Total" type="button"
            @click="selecionarEscopo('Total')"
            :class="{ active: escopoAtivo === 'Total' }">Total</button>
          <button
            data-escopo="Brasil" type="button"
            aria-label="Brasil"
            @click="selecionarEscopo('Brasil')"
            :class="{ active: escopoAtivo === 'Brasil' }"><span aria-hidden="true">🇧🇷</span> Brasil</button>
          <button
            data-escopo="EUA" type="button"
            aria-label="EUA"
            @click="selecionarEscopo('EUA')"
            :class="{ active: escopoAtivo === 'EUA' }"><span aria-hidden="true">🇺🇸</span> EUA</button>
        </div>

        <div class="moeda-toggle" role="tablist"
             x-show="moedaToggleVisivel()" x-cloak>
          <button
            data-moeda="BRL" type="button"
            @click="selecionarMoeda('BRL')"
            :class="{ active: moeda === 'BRL' }"
            aria-label="Mostrar carteira EUA em reais">BRL</button>
          <button
            data-moeda="USD" type="button"
            @click="selecionarMoeda('USD')"
            :class="{ active: moeda === 'USD' }"
            aria-label="Mostrar carteira EUA em dólares (paridade Avenue)">USD</button>
        </div>

        <!-- 7a.BD.2: payload sem o bloco ponte (schema < v2.30, ex. v2.29 em
             cache do SW). Substitui tudo abaixo; nunca desenha a tela antiga. -->
        <div class="rent2-indisponivel" data-testid="rent2-sem-bloco" x-show="rent2.semBloco" x-cloak>
          <template x-if="rent2.semBloco === 'nulo'">
            <p>A conta da rentabilidade não foi publicada nesta atualização.</p>
          </template>
          <template x-if="rent2.semBloco === 'versao' || rent2.semBloco === 'erro'">
            <div>
              <p x-text="rent2.semBloco === 'erro' ? 'Não foi possível montar a rentabilidade agora.' : 'Rentabilidade indisponível nesta versão dos dados'"></p>
              <button type="button" class="rent2-recarregar" @click="rent2Recarregar()">Recarregar</button>
            </div>
          </template>
        </div>

        <!-- 7a.BD.2: a ponte (spec §2): janela → gráfico → número → ponte →
             quem pesou → em reais → detalhes. Todo número sai de rent2.vista
             (rent2Vista sobre ponteJanela). -->
        <div class="rent2" x-show="!rent2.semBloco">
          <div class="rent2-janelas" role="group" aria-label="Janela">
            <template x-for="j in rent2.janelas" :key="j.chave">
              <button type="button" class="rent2-janela"
                      :data-testid="'rent2-janela-' + j.chave"
                      :aria-pressed="rent2.chave === j.chave ? 'true' : 'false'"
                      :aria-disabled="j.disponivel ? null : 'true'"
                      :aria-describedby="j.disponivel ? null : 'rent2-motivo'"
                      @click="rent2EscolherJanela(j.chave)"
                      x-text="j.rotulo"></button>
            </template>
          </div>
          <p class="rent2-motivo" id="rent2-motivo" data-testid="rent2-motivo" aria-live="polite"
             x-show="rent2.motivo" x-text="rent2.motivo" x-cloak></p>

          <figure class="rent2-grafico">
            <p class="chart-rent-subtitulo" data-testid="rent2-subtitulo" x-text="rent2.vista?.subtitulo || ''"></p>
            <div id="chart-rent2" class="chart-rent" data-testid="rent2-grafico" role="img"
                 :aria-label="rent2.vista?.ariaGrafico || 'Sua carteira e a mesma carteira só com índices'"></div>
            <figcaption class="rent2-legenda">
              <span class="rent2-legenda-item"><span class="rent2-traco rent2-traco--sua" aria-hidden="true"></span>Sua carteira</span>
              <span class="rent2-legenda-item"><span class="rent2-traco rent2-traco--ind" aria-hidden="true"></span>Mesma carteira, só com índices</span>
            </figcaption>
          </figure>

          <div class="rent2-janela-indisp" data-testid="rent2-janela-indisp"
               x-show="rent2.vista && rent2.vista.indisponivel" x-cloak>
            <p x-text="rent2.vista?.indisponivel || ''"></p>
          </div>

          <!-- Regiões aria-live só para leitor de tela, fora do x-if: existem
               sempre (não são recriadas) e também anunciam o motivo de uma
               janela indisponível. Texto escrito fora do arrasto e no settle
               (_rent2Anunciar); a parte visual troca direto a cada zoom. -->
          <p class="sr-only" aria-live="polite" data-testid="rent2-anuncio" x-text="rent2.anuncio"></p>
          <p class="sr-only" aria-live="polite" data-testid="rent2-anuncio-pesou" x-text="rent2.anuncioPesou"></p>

          <template x-if="rent2.vista && !rent2.vista.indisponivel">
            <div class="rent2-corpo">
              <div class="rent2-veredito">
                <p class="rent2-frase" data-testid="rent2-frase" x-text="rent2.vista.frase"></p>
                <p class="rent2-numero">
                  <span class="rent2-grande" :class="'is-' + rent2.vista.sinal" data-testid="rent2-numero" x-text="rent2.vista.numero"></span>
                  <span class="rent2-unidade" data-testid="rent2-unidade" x-text="rent2.vista.unidade"></span>
                </p>
                <dl class="rent2-pares">
                  <div class="rent2-par" data-testid="rent2-par-sua">
                    <dt>Sua carteira</dt>
                    <dd><span class="rent2-par-valor" x-text="rent2.vista.sua"></span> <span x-text="rent2.vista.sufixo"></span></dd>
                  </div>
                  <div class="rent2-par" data-testid="rent2-par-ind">
                    <dt>Mesma carteira, só com índices</dt>
                    <dd><span class="rent2-par-valor" x-text="rent2.vista.ind"></span> <span x-text="rent2.vista.sufixo"></span></dd>
                  </div>
                </dl>
              </div>

              <section class="ponte" data-testid="ponte" aria-labelledby="ponte-titulo">
                <h2 class="ponte-titulo" id="ponte-titulo">De onde vem a diferença</h2>
                <p class="ponte-unidade" x-text="rent2.vista.ponte.unidade"></p>
                <div class="ponte-degraus">
                  <div class="ponte-degrau ponte-degrau--total" data-testid="ponte-total-ind" :data-valor="rent2.vista.indValor" aria-hidden="true">
                    <span class="ponte-rotulo"><span class="ponte-nome">Só com índices</span><span class="ponte-sub">mesmos pesos, mês a mês</span></span>
                    <span class="ponte-trilho">
                      <span class="ponte-barra ponte-barra--ind" :style="rent2.vista.ponte.estiloInd"></span>
                    </span>
                    <span class="ponte-valor" x-text="rent2.vista.ind"></span>
                  </div>
                  <template x-for="l in rent2.vista.ponte.linhas" :key="l.id">
                    <button type="button" class="ponte-degrau" data-testid="ponte-linha"
                            :data-linha="l.id" :data-sinal="l.sinal" :data-valor="l.valor"
                            :aria-pressed="rent2.vista.linhaSel === l.id ? 'true' : 'false'"
                            :aria-label="l.ariaLabel"
                            @click="rent2EscolherLinha(l.id)">
                      <span class="ponte-rotulo">
                        <span class="ponte-nome"><span class="ponte-ponto" :style="l.estiloPonto" aria-hidden="true"></span><span x-text="l.rotulo"></span></span>
                        <span class="ponte-sub" x-text="l.sub"></span>
                      </span>
                      <span class="ponte-trilho" aria-hidden="true">
                        <span class="ponte-guia" :style="l.estiloGuia"></span>
                        <span class="ponte-barra" :class="'ponte-barra--' + l.sinal" :style="l.estiloBarra"></span>
                      </span>
                      <span class="ponte-valor" :class="'is-' + l.sinal" x-text="l.texto"></span>
                    </button>
                  </template>
                  <div class="ponte-degrau ponte-degrau--total" data-testid="ponte-total-sua" :data-valor="rent2.vista.suaValor" aria-hidden="true">
                    <span class="ponte-rotulo"><span class="ponte-nome">Sua carteira</span></span>
                    <span class="ponte-trilho">
                      <span class="ponte-barra ponte-barra--sua" :style="rent2.vista.ponte.estiloSua"></span>
                    </span>
                    <span class="ponte-valor" x-text="rent2.vista.sua"></span>
                  </div>
                </div>
                <!-- Tabela equivalente para leitor de tela. O .sr-only fica no
                     wrapper: tabela não encolhe a 1px (o layout de tabela cresce
                     até o conteúdo) e vazaria rolagem horizontal. -->
                <div class="sr-only">
                <table class="ponte-tabela" data-testid="ponte-tabela">
                  <caption x-text="rent2.vista.ponte.caption"></caption>
                  <thead><tr><th scope="col">Linha</th><th scope="col">Valor</th><th scope="col">Acumulado</th></tr></thead>
                  <tbody>
                    <tr><th scope="row">Só com índices</th><td x-text="rent2.vista.ind + ' ' + rent2.vista.sufixo"></td><td x-text="rent2.vista.ind"></td></tr>
                    <template x-for="l in rent2.vista.ponte.linhas" :key="'t' + l.id">
                      <tr><th scope="row" x-text="l.tabelaLinha"></th><td x-text="l.tabelaValor"></td><td x-text="l.tabelaAcum"></td></tr>
                    </template>
                    <tr><th scope="row">Sua carteira</th><td x-text="rent2.vista.sua + ' ' + rent2.vista.sufixo"></td><td x-text="rent2.vista.sua"></td></tr>
                  </tbody>
                </table>
                </div>
              </section>

              <section class="grifo ponte-pesou" data-testid="ponte-pesou" x-show="rent2.vista.pesou">
                <template x-if="rent2.vista.pesou">
                  <div>
                    <p class="ponte-pesou-frase">
                      <strong x-text="rent2.vista.pesou.linha"></strong>
                      <template x-if="!rent2.vista.pesou.neutra">
                        <span><span x-text="rent2.vista.pesou.verbo"></span> <strong x-text="rent2.vista.pesou.qtd"></strong></span>
                      </template>
                      <span x-text="rent2.vista.pesou.resto"></span>
                    </p>
                    <template x-for="g in rent2.vista.pesou.grupos" :key="g.id">
                      <div class="ponte-pesou-grupo" data-testid="pesou-grupo" :data-grupo="g.id">
                        <p class="ponte-pesou-cab" :id="'pesou-cab-' + g.id" data-testid="pesou-cab">
                          <span class="ponte-pesou-cab-rotulo"><span x-text="g.titulo"></span><span class="ponte-pesou-cab-conta" x-text="' · ' + g.contagem"></span></span>
                          <template x-if="g.sub">
                            <span class="ponte-pesou-valor" :class="'is-' + g.sub.sinal" data-testid="pesou-sub" :data-valor="g.sub.valor" x-text="g.sub.texto"></span>
                          </template>
                        </p>
                        <ul class="ponte-pesou-lista" :aria-labelledby="'pesou-cab-' + g.id">
                          <template x-for="a in g.itens" :key="g.id + a.t">
                            <li class="ponte-pesou-item" data-testid="pesou-ativo" :data-ticker="a.t" :data-valor="a.valor" :data-saiu="a.saiu ? 'true' : 'false'">
                              <span class="ponte-pesou-ticker"><span x-text="a.t"></span><template x-if="a.saiu"><span class="ponte-pesou-saiu">saiu da carteira</span></template></span>
                              <span class="ponte-pesou-valor" :class="'is-' + a.sinal" x-text="a.texto"></span>
                            </li>
                          </template>
                        </ul>
                      </div>
                    </template>
                  </div>
                </template>
              </section>

              <!-- 7a.BR.2: ponte para o capítulo 2 do Diagnóstico. Sem número. -->
              <a class="rent-grifo-sel" data-testid="rent-grifo-selecao" href="#/raiox/diagnostico/selecao">Isso é habilidade ou sorte? Ver no Diagnóstico ›</a>

              <section class="rent2-reais" aria-labelledby="rent2-reais-titulo">
                <h2 class="rent2-h2" id="rent2-reais-titulo" x-text="rent2.vista.reais.titulo"></h2>
                <dl class="rent2-reais-lista">
                  <div class="rent2-reais-linha">
                    <dt>Entrou na carteira</dt>
                    <dd data-testid="rent2-entrou" x-text="rent2.vista.reais.entrou"></dd>
                  </div>
                  <div class="rent2-reais-linha">
                    <dt>Ganho, com proventos</dt>
                    <dd data-testid="rent2-ganho" :class="'is-' + rent2.vista.reais.ganhoSinal" x-text="rent2.vista.reais.ganho"></dd>
                  </div>
                  <div class="rent2-reais-linha">
                    <dt x-text="rent2.vista.reais.rotuloFim"></dt>
                    <dd data-testid="rent2-valor-fim" x-text="rent2.vista.reais.valorFim"></dd>
                  </div>
                </dl>
              </section>

              <details class="rent2-detalhes" data-testid="rent2-detalhes">
                <summary>Detalhes</summary>
                <div class="rent2-detalhes-corpo">
                  <table class="proj-tabela rent2-tabela">
                    <thead><tr><th scope="col">Índices, um a um</th><th scope="col" x-text="rent2.vista.sufixo"></th></tr></thead>
                    <tbody>
                      <template x-for="ix in rent2.vista.detalhes.indices" :key="ix.id">
                        <tr data-testid="rent2-indice" :data-indice="ix.id">
                          <th scope="row" x-text="ix.nome"></th>
                          <td x-text="ix.texto"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <table class="proj-tabela rent2-tabela">
                    <thead><tr><th scope="col">Duas réguas da carteira</th><th scope="col" x-text="rent2.vista.sufixo"></th></tr></thead>
                    <tbody>
                      <tr data-testid="rent2-twr">
                        <th scope="row">A carteira (TWR)<span class="rent2-regua-sub">ignora o momento dos aportes; é a régua da ponte</span></th>
                        <td class="rent2-regua-valor" x-text="rent2.vista.sua"></td>
                      </tr>
                      <tr data-testid="rent2-xirr">
                        <th scope="row">Seu dinheiro (XIRR)<span class="rent2-regua-sub">considera quando e quanto entrou na carteira</span></th>
                        <td class="rent2-regua-valor" x-text="rent2.vista.detalhes.xirr"></td>
                      </tr>
                    </tbody>
                  </table>
                  <template x-if="rent2.vista.detalhes.aporFrase">
                    <p class="rent-aporte-frase" data-testid="rent-aporte-frase" x-text="rent2.vista.detalhes.aporFrase"></p>
                  </template>
                  <p class="rent2-aviso" data-testid="rent2-aviso">Rentabilidade passada não garante resultado futuro. Valores antes de impostos.</p>
                </div>
              </details>
            </div>
          </template>
        </div>
      </section>

      <section class="tela-detalhes tela-alocacao" x-show="rota === 'alocacao'" x-transition:enter.opacity.duration.220ms x-cloak>
        <header class="breadcrumb">
          <h1 class="eyebrow">Alocação</h1>
        </header>

        <p class="politica-intro" x-show="!json || !json.politica || !json.politica.categorias.length">
          Política não publicada ainda.
        </p>

        <!-- 7a.BK.1: frase-resumo por estado das categorias (spec 7a.BK §3.2).
             Texto comum, lido na ordem; "" (sem categoria classificável) some. -->
        <p class="aloca-frase" data-testid="aloca-frase" x-show="alocFrase" x-cloak
           x-text="alocFrase"></p>

        <!-- 7a.S.10 Task 4 / 7a.BK.1: grifo cross-screen — deep-link p/ #aportar
             com o preset do último aporte. Só aparece com categoria ABAIXO da
             faixa; o nome vem do payload e entra por x-text, nunca como HTML. -->
        <div class="grifo aloca-grifo" x-show="alocGrifoTexto" x-cloak
             role="button" tabindex="0"
             @click="irSimularAporteAlvo()"
             @keydown.enter.prevent="irSimularAporteAlvo()"
             @keydown.space.prevent="irSimularAporteAlvo()">
          <span class="aloca-grifo__texto" x-text="alocGrifoTexto"></span> <span class="aloca-grifo-cta">Simular aporte ›</span>
        </div>

        <div class="aloca-lista">
          <template x-for="cat in categoriasAlocacaoOrdenadas" :key="cat.nome">
            <article class="aloca-cat"
                      :id="'aloca-cat-' + cat.nome.replace(/\s+/g, '-')"
                      :style="catStyleVar(cat.nome)">
              <button type="button" class="aloca-cat__head"
                      :aria-expanded="!!catAberta[cat.nome]"
                      :aria-controls="'aloca-cat-body-' + cat.nome.replace(/\s+/g, '-')"
                      @click="toggleCategoria(cat.nome)">
                <span class="aloca-cat__dot" aria-hidden="true"></span>
                <span class="aloca-cat__nome" x-text="cat.nome"></span>
                <span class="aloca-cat__rs">
                  <span class="aloca-cat__rs-valor" x-text="formatBrl(valorBrlCategoria(cat))"></span>
                  <span class="aloca-cat__chevron" aria-hidden="true"
                        x-text="catAberta[cat.nome] ? '▾' : '▸'"></span>
                </span>
              </button>

              <!-- 7a.BK.1: trilho da faixa (spec 7a.BK §3.3). Três zonas por
                   style (abaixo | na faixa | acima) e a etiqueta com o atual.
                   Decorativo para leitor de tela: o estado e a faixa estão no
                   rodapé, em texto. Sem alvo ou sem dado: sem trilho. -->
              <div class="aloca-trilho" data-testid="aloca-trilho" aria-hidden="true"
                   x-show="catTrilho(cat)"
                   :style="catTrilho(cat) ? `--na-ini: ${catTrilho(cat).naIni}%; --na-fim: ${catTrilho(cat).naFim}%;` : ''">
                <span class="aloca-trilho__na"></span>
                <span class="aloca-trilho__etq"
                      :style="catTrilho(cat) ? `--etq-x: ${catTrilho(cat).etiqueta}%;` : ''"
                      x-text="formatPctSemSinal(cat.peso_atual, 1)"></span>
              </div>
              <div class="aloca-cat__foot">
                <span class="aloca-cat__estado" data-testid="aloca-cat-estado"
                      :class="'aloca-cat__estado--' + catFaixa(cat).estado"
                      x-text="rotuloEstado(catFaixa(cat).estado)"></span>
                <span class="aloca-cat__faixa" data-testid="aloca-cat-faixa"
                      x-show="catFaixaTexto(cat)"
                      x-text="catFaixaTexto(cat)"></span>
              </div>

              <div class="aloca-cat__body" x-show="catAberta[cat.nome]" x-cloak
                   :id="'aloca-cat-body-' + cat.nome.replace(/\s+/g, '-')" role="region">
                <!-- 7a.BK.1: ativos agrupados por estado (spec 7a.BK §3.4).
                     De cima para baixo: linha das cestas (só com 2+), pedindo
                     aporte, acima da faixa, na faixa (etiquetas sem número) e
                     sem alvo. Grupo vazio não aparece; todo ativo é link. -->
                <div class="aloca-grupos">
                  <template x-if="gruposCategoria(cat).cestas.length">
                    <p class="aloca-cestas"><template x-for="(c, i) in gruposCategoria(cat).cestas" :key="c.nome"><span class="aloca-cestas__item"><span class="aloca-cestas__sep" x-text="i > 0 ? ' · ' : ''"></span><span x-text="c.nome"></span> <span class="aloca-cestas__estado" :class="'aloca-cestas__estado--' + c.estado" x-text="rotuloEstadoCesta(c.estado)"></span> <span class="aloca-cestas__pct" x-text="cestaPctTexto(c)"></span></span></template></p>
                  </template>

                  <template x-for="grupo in ['pedindo', 'acima']" :key="grupo">
                    <template x-if="gruposCategoria(cat)[grupo].length">
                      <section class="aloca-grupo" :class="'aloca-grupo--' + grupo" :data-grupo="grupo">
                        <h2 class="aloca-grupo__head">
                          <span class="aloca-grupo__titulo" x-text="grupo === 'pedindo' ? 'Pedindo aporte' : 'Acima da faixa'"></span>
                          <span class="aloca-grupo__meta" x-text="grupo === 'pedindo' ? gruposCategoria(cat).pedindo.length : 'ficam sem aporte'"></span>
                        </h2>
                        <template x-for="linha in gruposCategoria(cat)[grupo]" :key="linha.ticker">
                          <a class="aloca-ativo" :href="'#ativo/' + linha.ticker">
                            <span class="aloca-ativo__ticker" x-text="linha.ticker"></span>
                            <template x-if="linha.cesta">
                              <span class="aloca-ativo__cesta" x-text="linha.cesta"></span>
                            </template>
                            <template x-if="linhaRsTexto(linha, grupo)">
                              <span class="aloca-ativo__rs" x-text="linhaRsTexto(linha, grupo)"></span>
                            </template>
                          </a>
                        </template>
                      </section>
                    </template>
                  </template>

                  <template x-if="gruposCategoria(cat).naFaixa.length">
                    <section class="aloca-grupo aloca-grupo--na_faixa" data-grupo="na_faixa">
                      <h2 class="aloca-grupo__head">
                        <span class="aloca-grupo__titulo">Na faixa</span>
                        <span class="aloca-grupo__meta" x-text="gruposCategoria(cat).naFaixa.length"></span>
                      </h2>
                      <div class="aloca-etqs">
                        <template x-for="tk in gruposCategoria(cat).naFaixa" :key="tk">
                          <a class="aloca-etq" :href="'#ativo/' + tk"><span class="aloca-etq__ticker" x-text="tk"></span></a>
                        </template>
                      </div>
                    </section>
                  </template>

                  <template x-if="gruposCategoria(cat).semAlvo.length">
                    <section class="aloca-grupo aloca-grupo--sem_alvo" data-grupo="sem_alvo">
                      <h2 class="aloca-grupo__head">
                        <span class="aloca-grupo__titulo">Sem alvo</span>
                        <span class="aloca-grupo__meta">não recebem aporte</span>
                      </h2>
                      <div class="aloca-etqs">
                        <template x-for="s in gruposCategoria(cat).semAlvo" :key="s.ticker">
                          <a class="aloca-etq aloca-etq--apagada" :href="'#ativo/' + s.ticker">
                            <span class="aloca-etq__ticker" x-text="s.ticker"></span>
                            <span class="aloca-etq__motivo" x-text="s.motivo"></span>
                          </a>
                        </template>
                      </div>
                    </section>
                  </template>
                </div>
              </div>
            </article>
          </template>
        </div>

        <!-- 7a.BG.1 / 7a.BK.1: rodapé de reconciliação, logo depois da lista.
             Os cartões somam 100% da carteira (sem a cripto); esta linha
             devolve a cripto à vista. Só com payload 2.31+ e cripto > 0
             (rodapeCriptoTexto), e só com política publicada: a mesma
             condição da lista (spec 7a.BK §4(f)). -->
        <template x-if="json?.politica?.categorias?.length > 0 && rodapeCriptoTexto()">
          <p class="aloca-cripto" data-testid="cripto-rodape" x-text="rodapeCriptoTexto()"></p>
        </template>
      </section>

      <section class="tela-detalhes tela-ativo" x-show="rota === 'ativo'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent" x-text="tickerAtual"></h1>
        </header>

        <template x-if="!posicaoAtual">
          <div class="erro-nao-encontrado">
            <p>Ativo <strong x-text="tickerAtual"></strong> não encontrado na carteira.</p>
            <a href="#alocacao">← Voltar para Alocação</a>
          </div>
        </template>

        <template x-if="posicaoAtual">
          <div class="ativo-corpo">
            <div class="ticker-hero">
              <h2>
                <span class="flag" aria-hidden="true" x-text="bandeiraDaPosicao(posicaoAtual)"></span>
                <span x-text="posicaoAtual.ticker"></span>
              </h2>
              <p class="ticker-classe" x-text="posicaoAtual.classe"></p>
              <p class="ticker-vm-grande" x-text="formatBrl(posicaoAtual.valor_mercado_brl)"></p>
            </div>

            <div class="kpi-grid">
              <div class="kpi">
                <span class="kpi-label">Quantidade</span>
                <span class="kpi-valor" x-text="formatQtyR7d(posicaoAtual.quantidade)"></span>
              </div>
              <div class="kpi">
                <span class="kpi-label">Custo médio</span>
                <span class="kpi-valor" x-text="formatBrl(posicaoAtual.custo_medio)"></span>
              </div>
              <div class="kpi">
                <span class="kpi-label">Último preço</span>
                <span class="kpi-valor" x-text="formatBrl(posicaoAtual.ultimo_preco)"></span>
              </div>
              <div class="kpi">
                <span class="kpi-label">Ganho / perda</span>
                <span
                  class="kpi-valor"
                  :class="(posicaoAtual.ganho_perda_brl ?? 0) < 0 && 'is-neg'"
                  x-text="formatBrl(posicaoAtual.ganho_perda_brl)"></span>
              </div>
              <div class="kpi">
                <span class="kpi-label">Ganho %</span>
                <span
                  class="kpi-valor"
                  :class="(posicaoAtual.ganho_perda_pct ?? 0) < 0 && 'is-neg'"
                  x-text="formatPct(posicaoAtual.ganho_perda_pct)"></span>
              </div>
              <div class="kpi">
                <span class="kpi-label">XIRR</span>
                <span class="kpi-valor" x-text="formatPct(posicaoAtual.xirr_aa)"></span>
              </div>
              <!-- 7a.E.33: DY trailing-12m como 7º card. Mesmo número que
                   o ranking #s-dy (dyAtivo → por_ativo == dy do item). Rótulo por-extenso
                   (a .kpi-grid já rotula por célula, sem ambiguidade com peso).
                   null → formatPctSemSinal devolve "—" + aria-label acessível
                   (Alpine remove o atributo quando o binding é null). -->
              <div class="kpi">
                <span class="kpi-label">Dividend Yield</span>
                <span class="kpi-valor"
                      x-text="formatPctSemSinal(dyAtivo(posicaoAtual.ticker), 1)"
                      :aria-label="dyAtivo(posicaoAtual.ticker) === null ? 'sem dividend yield' : null"></span>
                <!-- 7a.E.35: selo de posição recente (< 12m) → DY subestimado.
                     Texto real (a11y forma+texto), lido pelo leitor de tela.
                     `&lt;` literal: o parser HTML leria `< 12` como abertura de tag. -->
                <span class="kpi-nota-parcial"
                      x-show="dyParcial(posicaoAtual.ticker)"
                      x-cloak>posição &lt; 12 meses</span>
              </div>
            </div>

            <h3 class="ativo-section-h">Movimentos · últimos 12 meses</h3>
            <template x-if="(posicaoAtual.movimentos || []).length === 0">
              <p class="vazio">Nenhum movimento registrado.</p>
            </template>
            <template x-if="(posicaoAtual.movimentos || []).length > 0">
              <div class="tabela-wrap">
                <table class="tabela-movimentos">
                  <thead>
                    <tr><th scope="col">Data</th><th scope="col">Lado</th><th scope="col">Qty</th><th scope="col">Preço</th><th scope="col">Total</th></tr>
                  </thead>
                  <tbody>
                    <template
                      x-for="(m, idx) in posicaoAtual.movimentos"
                      :key="m.data + '-' + m.lado + '-' + idx">
                      <tr>
                        <td x-text="m.data"></td>
                        <td>
                          <span
                            class="lado-pill"
                            :class="formatarLado(m.lado).classe"
                            :title="m.lado"
                            x-text="formatarLado(m.lado).texto"></span>
                        </td>
                        <td class="num" x-text="formatQtyR7d(m.quantidade)"></td>
                        <td class="num" x-text="formatBrl(m.preco_unitario)"></td>
                        <td class="num" x-text="formatBrl(m.total_brl)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>

            <h3 class="ativo-section-h">Proventos · últimos 12 meses</h3>
            <template x-if="(posicaoAtual.proventos || []).length === 0">
              <p class="vazio">Nenhum provento registrado.</p>
            </template>
            <template x-if="(posicaoAtual.proventos || []).length > 0">
              <div class="tabela-wrap">
                <table class="tabela-proventos">
                  <thead>
                    <tr><th scope="col">Data</th><th scope="col">Valor</th><th scope="col">Tipo</th></tr>
                  </thead>
                  <tbody>
                    <template
                      x-for="(pr, idx) in posicaoAtual.proventos"
                      :key="pr.data_pagamento + '-' + idx">
                      <tr>
                        <td x-text="pr.data_pagamento"></td>
                        <td class="num" x-text="formatBrl(pr.valor_liquido_brl)"></td>
                        <td x-text="pr.tipo"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>

            <!-- 7a.R.3.b: entrada para a memória viva do ativo. `<a href>` real
                 (deep-linkável); o @click só grava a origem ANTES do hash mudar,
                 sem preventDefault. Sem selo de veredito aqui: o #ativo é a tela
                 dos números, e o veredito é leitura. -->
            <a class="dossie-entrada" x-show="temDossie(posicaoAtual.ticker)" x-cloak
              :href="'#/dossie/' + posicaoAtual.ticker"
              @click="registrarOrigemDossie()">
              <span class="dossie-entrada__rot">Dossiê</span>
              <span class="dossie-entrada__chevron" aria-hidden="true">›</span>
            </a>
          </div>
        </template>
      </section>

      <!-- ── Tela #proventos ──────────────────────────────────────────── -->
      <section class="tela-detalhes tela-proventos" x-show="rota === 'proventos'" x-transition:enter.opacity.duration.220ms x-cloak>
        <header class="breadcrumb">
          <h1 class="eyebrow">Proventos</h1>
        </header>

        <!-- 7a.S.7b Task 4: affordance de rolagem horizontal — o 3º KPI
             cortava a 320px (spec 7a.S §9, Fable). Substitui o wrap-to-1-col
             de 7a.G.2 finding #3: os 3 cards seguem lado a lado, alcançáveis
             por scroll, com edge-fade sinalizando que há mais conteúdo. -->
        <div class="kpi-scrollwrap">
          <div class="kpi-grid kpi-grid-3" tabindex="0" role="group" aria-label="Indicadores de proventos, role para o lado para ver todos">
            <div class="kpi">
              <span class="kpi-label">YTD <span x-text="anoCorrente"></span></span>
              <span class="kpi-valor" x-text="formatBrl(json?.proventos?.ytd_brl)"></span>
            </div>
            <div class="kpi">
              <span class="kpi-label"><span x-text="anoAnterior"></span></span>
              <span class="kpi-valor" x-text="formatBrl(json?.proventos?.ano_anterior_brl)"></span>
            </div>
            <div class="kpi">
              <span class="kpi-label">Total Origem</span>
              <span class="kpi-valor" x-text="formatBrl(totalProventosOrigem)"></span>
            </div>
          </div>
          <span class="kpi-scroll-fade" aria-hidden="true"></span>
        </div>

        <div class="escopo-toggle" role="tablist" aria-label="Período">
          <button
            type="button"
            role="tab"
            :aria-selected="proventosToggle === 'origem'"
            :class="{ active: proventosToggle === 'origem' }"
            @click="setProventosToggle('origem')">Origem</button>
          <button
            type="button"
            role="tab"
            :aria-selected="proventosToggle === 'mensal'"
            :class="{ active: proventosToggle === 'mensal' }"
            @click="setProventosToggle('mensal')">Mensal (12m)</button>
        </div>

        <!-- 7a.S.7b: card do chart ganha a linha-razão do total no topo —
             substitui o poster de total removido; = soma exata das barras
             exibidas, troca de rótulo/valor com o toggle Anual/Mensal
             (computado em renderProventosGrafico, nunca um agregado
             independente do gráfico). -->
        <div class="prov-chart-card">
          <div class="prov-total" id="prov-total" aria-live="polite">
            <span class="pt-lbl" x-text="proventosTotalLabel"></span>
            <span class="pt-val" x-text="formatBrl(proventosTotalValor)"></span>
          </div>
          <div id="proventos-grafico" class="chart-rent" aria-label="Evolução de proventos"></div>
        </div>

        <!-- 7a.S.3 Task 3: nota "em curso" — honestidade de dado da última barra
             (ano/mês corrente, ainda acumulando). Texto montado em JS por
             renderProventosGrafico (depende do ano/mês do último bucket). -->
        <p class="chart-partial-note" id="proventosNotaParcial" aria-live="polite"></p>

        <!-- 7a.E.18: hint quando há mês selecionado -->
        <div class="proventos-hint-limpar" id="proventosHintLimpar" hidden>
          Toque na mesma barra ou pressione Esc para limpar
        </div>

        <!-- 7a.E.18: lista a11y visualmente oculta com 12 botões focáveis -->
        <ul class="proventos-meses-a11y" id="proventosMesesA11y" role="list" aria-label="Meses dos últimos 12 meses"></ul>

        <!-- 7a.S.7b: DY virou chamada (idioma do .rel-card-home) → push #s-dy -->
        <a class="dy-chamada" data-testid="dy-chamada" href="#/proventos/dy"
           x-show="json?.dividend_yield"
           aria-label="Ver detalhe do Dividend Yield da carteira">
          <span class="dy-chamada__meta">
            <span class="dy-chamada__label">Dividend Yield</span>
            <span class="dy-chamada__valor" x-text="formatPctSemSinal(json?.dividend_yield?.total?.dy, 1)"></span>
            <span class="dy-chamada__desc">Carteira · 12 meses — ver detalhe</span>
          </span>
          <span class="dy-chamada__chevron" aria-hidden="true">›</span>
        </a>

        <h3 class="ativo-section-h" :class="{ filtrada: proventosToggle === 'mensal' && proventosMesSelecionado !== null }">
          <template x-if="proventosToggle === 'mensal' && proventosMesSelecionado !== null">
            <span>Por ativo · <strong x-text="proventosMesLabel()"></strong></span>
          </template>
          <template x-if="!(proventosToggle === 'mensal' && proventosMesSelecionado !== null)">
            <span>Por ativo · <span x-text="proventosToggle === 'mensal' ? 'últimos 12 meses' : 'desde a Origem'"></span></span>
          </template>
        </h3>
        <template x-if="tabelaProventosAtual().length === 0">
          <p class="vazio">Nenhum dado disponível.</p>
        </template>
        <template x-if="tabelaProventosAtual().length > 0">
          <div class="tabela-wrap">
            <table class="tabela-proventos" aria-label="Proventos por ativo">
              <thead>
                <tr>
                  <th scope="col">Ticker</th>
                  <th scope="col" class="num">Total</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="item in tabelaProventosAtual()" :key="item.ticker + '·' + (item.tipo || 'prov')">
                  <tr
                    class="row-link"
                    tabindex="0"
                    role="link"
                    :aria-label="'Ver ativo ' + item.ticker + (item.tipo === 'Aluguel' ? ' (aluguel)' : '')"
                    @click="location.hash = 'ativo/' + item.ticker"
                    @keydown.enter="location.hash = 'ativo/' + item.ticker"
                    @keydown.space.prevent="location.hash = 'ativo/' + item.ticker">
                    <td>
                      <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                      <span x-text="item.ticker"></span>
                      <template x-if="item.tipo === 'Aluguel'"><span class="provento-tipo-tag">Aluguel</span></template>
                    </td>
                    <td class="num" x-text="formatBrl(item.total)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </section>

      <!-- ── Tela #s-dy (Fase 7a.S.7b) — Dividend Yield dedicado ────────── -->
      <section class="tela-detalhes tela-dy" x-show="rota === 'dy'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent">Dividend Yield</h1>
        </header>

        <div class="poster-wrap">
          <p class="poster" x-text="formatPctSemSinal(json?.dividend_yield?.total?.dy, 1)"></p>
          <p class="poster-cap">dividend yield da carteira · trailing 12 meses<br>renda recebida ÷ valor de mercado</p>
        </div>

        <div class="dy-compare">
          <div class="dy-cap"><span>Por classe · quem rende mais</span><span>toque para o ranking</span></div>
          <div>
            <template x-for="c in dyClassesLista()" :key="c.key">
              <button type="button" class="dy-row" :class="{ on: dySelecionado === c.key }"
                @click="selecionarDY(c.key)"
                :aria-label="'Dividend yield ' + c.nm + ' ' + formatPctSemSinal(c.dy, 1) + ' — ver o ranking'">
                <span class="cls" x-text="c.nm"></span>
                <span class="barw"><i :style="{ width: c.barPct + '%' }"></i></span>
                <span class="yv" x-text="formatPctSemSinal(c.dy, 1)"></span>
                <span class="chv" aria-hidden="true">›</span>
              </button>
            </template>
          </div>
        </div>

        <!-- 7a.BO.2: ranking completo da classe tocada (lista inteira, por DY);
             os sem DY válido num subgrupo no fim. aria-live só no anúncio do
             cabeçalho — anunciar 15 linhas a cada toque seria ruído. -->
        <div class="dy-champs" data-testid="dy-champs" x-show="dySelecionado">
          <div class="dc-h">
            <span class="t">Ranking · <span x-text="dyRankingLabelAtual()"></span></span>
            <span class="c">maior yield · 12m</span>
          </div>
          <p class="sr-only" aria-live="polite" x-text="dyRankingAnuncio()"></p>
          <template x-if="dyRankingAtual().com.length === 0">
            <p class="dy-champs-vazio" x-text="dyRankingAtual().sem.length
              ? 'Nenhum ativo desta classe pagou provento nos últimos 12 meses.'
              : 'Nenhum ativo nesta classe.'"></p>
          </template>
          <template x-if="dyRankingAtual().com.length > 0">
            <ol class="dy-rank">
              <template x-for="(p, i) in dyRankingAtual().com" :key="p.ticker">
                <li class="champ" :class="{ top: i < 3 }">
                  <div class="champ-top">
                    <span class="rk" x-text="i + 1"></span>
                    <span class="flag" aria-hidden="true" x-text="p.bandeira"></span>
                    <span class="tkw">
                      <span class="tk" x-text="p.ticker"></span>
                      <template x-if="dyParcial(p.ticker)">
                        <span class="kpi-nota-parcial">posição &lt; 12 meses</span>
                      </template>
                    </span>
                    <span class="y" x-text="formatPctSemSinal(p.dy, 1)"></span>
                  </div>
                  <div class="champ-bar">
                    <span class="bw"><i :style="{ width: dyBarPctRanking(p) + '%' }"></i></span>
                    <span class="rs" x-text="formatMoedaCampeao(p.valor, p.moeda)"></span>
                  </div>
                </li>
              </template>
            </ol>
          </template>
          <template x-if="dyRankingAtual().sem.length > 0">
            <div class="dy-sem">
              <h3 id="dy-sem-h" class="dy-sem-h">Sem dividend yield em 12 meses</h3>
              <ul class="dy-rank dy-rank--sem" aria-labelledby="dy-sem-h">
                <template x-for="p in dyRankingAtual().sem" :key="p.ticker">
                  <li class="champ sem">
                    <div class="champ-top">
                      <span class="flag" aria-hidden="true" x-text="p.bandeira"></span>
                      <span class="tkw"><span class="tk" x-text="p.ticker"></span></span>
                      <span class="y">—</span>
                    </div>
                    <div class="champ-bar">
                      <span class="rs" x-text="formatMoedaCampeao(p.valor, p.moeda)"></span>
                    </div>
                  </li>
                </template>
              </ul>
            </div>
          </template>
        </div>

        <p class="footnote-dy">DY trailing 12m ÷ valor de mercado · <code>investimentos.db</code><br>— = sem provento no período ou sem número confiável</p>
      </section>

      <!-- ── Tela #patrimonio ─────────────────────────────────────────── -->
      <section class="tela-detalhes tela-patrimonio" x-show="rota === 'patrimonio'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent">Histórico patrimonial</h1>
        </header>

        <div class="kpi-grid kpi-stack">
          <div class="kpi">
            <span class="kpi-label">Patrimônio atual</span>
            <span class="kpi-valor" x-text="formatBrl(patrimonioAtual())"></span>
            <span class="kpi-descricao">Valor de mercado consolidado do patrimônio (Brasil + EUA, cripto incluída) na data mais recente.</span>
          </div>
          <div class="kpi">
            <span class="kpi-label">Aporte cumulativo</span>
            <span class="kpi-valor" x-text="formatBrl(aporteCumulativo())"></span>
            <span class="kpi-descricao">Soma de todos os aportes desde a Origem (compras de ativos em R$, FX-aplicado para EUA).</span>
          </div>
          <div class="kpi">
            <span class="kpi-label">Retorno acumulado</span>
            <span class="kpi-valor" x-text="formatBrl(retornoAcumuladoBrl())"></span>
            <span class="kpi-meta" x-text="retornoAcumuladoPctTexto()"></span>
            <span class="kpi-descricao">Diferença entre patrimônio atual e aporte cumulativo. Mede ganho ou perda total do patrimônio.</span>
          </div>
        </div>

        <div id="patrimonio-grafico" class="chart-rent" aria-label="Evolução de patrimônio e aportes"></div>
      </section>

      <!-- ── Tela #/raiox/projecao (7a.AW.2; forma refeita na 7a.AX; um cenário na 7a.AY) ── -->
      <!-- Push child da tab Raio-X. Ensaio em 6 capítulos, sem ECharts desde a 7a.AX; premissas prospectivas por classe desde a 7a.AY. -->
      <section class="tela-detalhes tela-projecao" x-show="rota === 'projecao'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        aria-labelledby="proj-titulo" x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent" id="proj-titulo">Projeção</h1>
        </header>

        <template x-if="!projecao">
          <p class="placeholder">Projeção indisponível hoje.</p>
        </template>

        <template x-if="projecao">
          <article class="proj-ensaio">
            <!-- 0. Abertura (7a.AY): a mediana é o sujeito, a faixa p10–p90 vem na
                 linha de baixo. Os três valores são os únicos mono da tela. Na
                 linha da faixa, A e o "e" formam um grupo sem quebra: a 320 px a
                 quebra cai DEPOIS do "e", nunca antes (regra da 7a.AX). -->
            <p class="proj-resposta">
              <span class="proj-resposta__linha">Aos <span x-text="projecao.idade_final"></span> você teria cerca de</span>
              <span class="proj-resposta__valores"><strong class="proj-faixa" x-text="formatBrlCompacto(projResposta().p50)"></strong><span class="proj-resposta__resto">, <span class="proj-resposta__inteiro">em reais de hoje.</span></span></span>
              <span class="proj-resposta__sub">Em 8 de cada 10 cenários, entre
                <span class="proj-resposta__intervalo"><span class="proj-resposta__grupo"><strong class="proj-faixa" x-text="formatBrlCompacto(projResposta().p10)"></strong> <span class="proj-conectivo">e</span></span> <strong class="proj-faixa" x-text="formatBrlCompacto(projResposta().p90)"></strong></span>.</span>
            </p>

            <!-- 1. De onde você parte -->
            <section class="proj-cap" data-cap="1" aria-labelledby="proj-cap-1">
              <p class="proj-cap__ordinal" aria-hidden="true">1</p>
              <h2 class="proj-cap__titulo" id="proj-cap-1">De onde você parte</h2>
              <p class="proj-cap__tema proj-num" x-text="formatBrlInteiro(projecao.partida.patrimonio)"></p>
              <p class="proj-cap__texto">É o valor de mercado de tudo o que você tem investido em
                <span x-text="projFmtData(projecao.partida.data)"></span>, cripto incluída. Daqui até os
                <span x-text="projecao.idade_final"></span> são <span x-text="projAnosTotal()"></span> anos de acumulação.</p>
              <details class="proj-conta"><summary>ver a conta</summary>
                <div class="proj-conta__corpo">
                  <p>Soma do valor de mercado de cada posição, ao preço do último fechamento publicado.</p>
                  <p>Idade hoje: <span class="proj-num" x-text="projecao.idade_atual"></span>. Horizonte: 31/12/<span x-text="projecao.ano_final"></span>, o ano em que você faz <span x-text="projecao.idade_final"></span>.</p>
                </div></details>
            </section>

            <!-- 2. Quanto você aporta -->
            <section class="proj-cap" data-cap="2" aria-labelledby="proj-cap-2">
              <p class="proj-cap__ordinal" aria-hidden="true">2</p>
              <h2 class="proj-cap__titulo" id="proj-cap-2">Quanto você aporta</h2>
              <p class="proj-cap__tema proj-num"><span x-text="formatBrlInteiro(projecao.aporte.mensal)"></span><span class="proj-cap__unidade"> por mês</span></p>
              <p class="proj-cap__texto">É a média do que veio do seu bolso nos últimos 12 meses: o que você remeteu para comprar, menos os proventos, que voltam pela reserva. Ela muda todo mês e não cresce com a sua renda, então por aqui a projeção é conservadora.</p>
              <p class="proj-nota proj-nota-piso" x-show="projecao.aporte.piso_zero_aplicado" x-cloak>Nos últimos 12 meses as vendas superaram os aportes, e a projeção usa zero.</p>
              <details class="proj-conta"><summary>ver a conta</summary>
                <div class="proj-conta__corpo">
                  <p>De <span x-text="projFmtData(projecao.aporte.janela.de)"></span> a <span x-text="projFmtData(projecao.aporte.janela.ate)"></span>:</p>
                  <table class="proj-tabela proj-tabela--conta">
                    <tbody>
                      <tr><th scope="row">Remessas (compras menos vendas)</th><td class="proj-num" x-text="formatBrlInteiro(projecao.aporte.compras_menos_vendas)"></td></tr>
                      <tr><th scope="row">Proventos</th><td class="proj-num" x-text="'−' + formatBrlInteiro(projecao.aporte.proventos)"></td></tr>
                      <tr><th scope="row">Aluguel de ações</th><td class="proj-num" x-text="'−' + formatBrlInteiro(projecao.aporte.aluguel)"></td></tr>
                      <tr class="proj-tabela__total"><th scope="row">÷ 12</th><td class="proj-num" x-text="formatBrlInteiro(projecao.aporte.mensal)"></td></tr>
                    </tbody>
                  </table>
                  <p>Os proventos passam pela reserva e voltam na remessa. As taxas de retorno já os contam, então somá-los de novo contaria o mesmo dinheiro duas vezes. Se eles deixassem de voltar, veja o cenário "Proventos fora da carteira".</p>
                </div></details>
            </section>

            <!-- 3. Quanto a carteira deve render (7a.AY: premissas prospectivas por classe) -->
            <section class="proj-cap" data-cap="3" aria-labelledby="proj-cap-3">
              <p class="proj-cap__ordinal" aria-hidden="true">3</p>
              <h2 class="proj-cap__titulo" id="proj-cap-3">Quanto a carteira deve render</h2>
              <p class="proj-cap__tema"><span class="proj-num" x-text="projFmtTaxa(projecao.taxa_central.taxa)"></span><span class="proj-cap__unidade"> ao ano, acima da inflação</span></p>
              <p class="proj-cap__texto">Esse rendimento já vem descontado de custos e impostos. É a combinação das premissas de cada classe, pesadas pela sua política de alocação.</p>
              <!-- Tabela por classe. O nome da classe ocupa a própria linha (um
                   tbody por classe) e os quatro números ficam embaixo: a 320 px
                   cinco colunas não cabem com folga entre os cabeçalhos. -->
              <table class="proj-tabela proj-tabela--classes">
                <caption class="sr-only">Premissa de cada classe, ao ano, acima da inflação</caption>
                <thead><tr><th scope="col">Peso</th><th scope="col">Retorno real</th><th scope="col">Desconto</th><th scope="col">Líquido</th></tr></thead>
                <template x-for="c in projTabelaClasses()" :key="c.classe">
                  <tbody class="proj-classe">
                    <tr class="proj-classe__nome"><th scope="rowgroup" colspan="4" x-text="c.rotulo"></th></tr>
                    <tr class="proj-classe__valores">
                      <td class="proj-num" x-text="projFmtTaxa(c.peso, 0)"></td>
                      <td class="proj-num" x-text="projFmtTaxa(c.real, 1)"></td>
                      <td class="proj-num" x-text="projFmtTaxa(c.desconto, 1)"></td>
                      <td class="proj-num" x-text="projFmtTaxa(c.liquido, 1)"></td>
                    </tr>
                  </tbody>
                </template>
              </table>
              <p class="proj-nota proj-fonte-linha" x-text="projFonteTexto()"></p>
              <p class="proj-nota proj-nota-vencida" x-show="projecao.premissas_vencidas" x-cloak>Estas premissas têm mais de um ano; a edição nova ainda não entrou.</p>
              <details class="proj-conta"><summary>ver a conta</summary>
                <div class="proj-conta__corpo">
                  <p>O desconto de cada classe soma a taxa de administração dos fundos e o imposto retido nos Estados Unidos sobre dividendos.
                    A retenção é de 30% do dividendo, medida pelo rendimento por cota dos últimos 12 meses.</p>
                  <table class="proj-tabela proj-tabela--desconto">
                    <caption class="sr-only">Composição do desconto de cada classe, ao ano</caption>
                    <thead><tr><th scope="col"><span class="sr-only">Classe</span></th><th scope="col">Taxa dos fundos</th><th scope="col">Retenção</th></tr></thead>
                    <tbody>
                      <template x-for="c in projTabelaClasses()" :key="c.classe">
                        <tr><th scope="row" x-text="c.rotulo"></th>
                          <td class="proj-num" x-text="projFmtTaxa(c.composicao.ter)"></td>
                          <td class="proj-num" x-text="projFmtTaxa(c.composicao.retencao_dividendos)"></td></tr>
                      </template>
                    </tbody>
                  </table>
                  <p>Esses dois componentes estão na escala do que se subtrai da média aritmética, e podem diferir do desconto da tabela em até cerca de 1 ponto-base.
                    Na tabela, o desconto é a diferença entre o retorno e o líquido já arredondados, para a conta fechar no que se lê.</p>
                  <p>Inflação usada pela fonte para levar as premissas a reais: <span class="proj-num" x-text="projFmtTaxa(projecao.premissas.inflacao)"></span> ao ano.</p>
                  <p>Média aritmética da carteira: <span class="proj-num" x-text="projFmtTaxa(projecao.taxa_central.media_aritmetica)"></span>.
                    Oscilação da carteira: <span class="proj-num" x-text="projFmtTaxa(projecao.taxa_central.vol_carteira, 1)"></span>.
                    O rendimento composto que resulta é a taxa deste capítulo, <span class="proj-num" x-text="projFmtTaxa(projecao.taxa_central.taxa)"></span>.</p>
                </div></details>

              <!-- O único grifo da tela (anti-pattern #14; colocação canônica desta
                   tela desde a 7a.AY). O 6,7% é número fixo de fonte (DMS
                   1900–2021); o da premissa vem do payload. -->
              <aside class="grifo proj-grifo">
                <h3 class="proj-grifo__titulo">Esta taxa olha para frente, não para trás</h3>
                <p>As premissas são projeções de mercado para os próximos 10 a 15 anos, feitas a partir dos preços de hoje. Não são o passado da sua carteira.</p>
                <template x-if="projEua()">
                  <p>A diferença que mais pesa é a das ações americanas. No histórico longo, de 1900 a 2021, elas renderam <span class="proj-num">6,7%</span> ao ano acima da inflação; a premissa de hoje é <span class="proj-num" x-text="projFmtTaxa(projEua().retorno_real, 1)"></span>.</p>
                </template>
              </aside>
            </section>

            <!-- 4. O que isso dá -->
            <section class="proj-cap" data-cap="4" aria-labelledby="proj-cap-4">
              <p class="proj-cap__ordinal" aria-hidden="true">4</p>
              <h2 class="proj-cap__titulo" id="proj-cap-4">O que isso dá</h2>
              <p class="proj-cap__texto">O patrimônio levado adiante em <span x-text="projecao.trajetorias.toLocaleString('pt-BR')"></span> cenários, com o mesmo aporte, em reais de hoje. Cada linha é uma idade, na mesma escala.</p>
              <!-- Gráfico de faixas (7a.AX), uma linha por marco de idade (7a.AY).
                   Desenho com role="img" e os cinco percentis no aria-label; os
                   valores escritos EMBAIXO, em linha própria e fora do role="img". -->
              <p class="proj-nota proj-faixas-vazio" x-show="!projMarcos().length" x-cloak>Não há idade futura para desenhar.</p>
              <div class="proj-faixas" x-show="projMarcos().length">
                <ol class="proj-faixas__lista">
                  <template x-for="l in projFaixas().linhas" :key="l.idade">
                    <li class="proj-faixas__linha" :data-idade="l.idade">
                      <p class="proj-faixas__nome" x-text="'Aos ' + l.idade"></p>
                      <div class="proj-faixas__trilho" role="img" :aria-label="projFaixaLabel(l.idade)">
                        <span class="proj-faixas__traco" :style="'left:' + l.p10 + '%;width:' + (l.p90 - l.p10) + '%'"></span>
                        <span class="proj-faixas__barra" :style="'left:' + l.p25 + '%;width:' + (l.p75 - l.p25) + '%'"></span>
                        <span class="proj-faixas__ponto" :style="'left:' + l.p50 + '%'"></span>
                      </div>
                      <p class="proj-faixas__valores">mediana <strong class="proj-num" x-text="formatBrlCompacto(l.valores.p50)"></strong>; 8 em 10 entre <span class="proj-num" x-text="formatBrlCompacto(l.valores.p10)"></span> e <span class="proj-num" x-text="formatBrlCompacto(l.valores.p90)"></span></p>
                    </li>
                  </template>
                </ol>
                <p class="proj-faixas__eixo" aria-hidden="true"><span>R$ 0</span><span x-text="formatBrlCompacto(projFaixas().max)"></span></p>
                <p class="proj-faixas__legenda">Traço fino: 8 em 10 cenários. Barra: metade deles. Ponto: a mediana.</p>
              </div>

              <h3 class="proj-cap__subtitulo">A largura das faixas</h3>
              <p class="proj-cap__texto">A largura vem da oscilação da carteira, <strong class="proj-num" x-text="projFmtTaxa(projecao.taxa_central.vol_carteira, 1)"></strong><span class="proj-cap__unidade"> ao ano</span>, calculada das premissas de cada classe e das correlações entre elas.
                Em <span x-text="projAnosTotal()"></span> anos a faixa é larga, e essa largura é a resposta honesta, não um defeito.</p>

              <h3 class="proj-cap__subtitulo">De onde vem o valor</h3>
              <p class="proj-decomp__titulo">Na taxa de <span class="proj-num" x-text="projFmtTaxa(projecao.taxa_central.taxa)"></span> constante, sem sorteio, o patrimônio chegaria a
                <span class="proj-num" x-text="formatBrlCompacto(projecao.decomposicao.final)"></span>. A mediana da simulação é
                <span x-text="projPraticamente()"></span>esse mesmo valor.</p>
              <div class="proj-decomp">
                <div class="proj-decomp__barra" aria-hidden="true">
                  <template x-for="p in projDecomposicao().filter(p => p.pct > 0)" :key="p.chave">
