            <span class="dy-chamada__valor" x-text="formatPctSemSinal(json?.dividend_yield?.total?.dy, 1)"></span>
            <span class="dy-chamada__desc">Carteira · 12 meses — ver detalhe</span>
          </span>
          <span class="dy-chamada__chevron" aria-hidden="true">›</span>
        </a>

        <h3 class="ativo-section-h" :class="{ filtrada: proventosToggle === 'mensal' && proventosMesSelecionado !== null }">
          <template x-if="proventosToggle === 'mensal' && proventosMesSelecionado !== null">
            <span>Por ativo · <strong x-text="proventosMesLabel()"></strong></span>
          </template>
          <template x-if="!(proventosToggle === 'mensal' && proventosMesSelecionado !== null)">
            <span>Por ativo · <span x-text="proventosToggle === 'mensal' ? 'últimos 12 meses' : 'desde a Origem'"></span></span>
          </template>
        </h3>
        <template x-if="tabelaProventosAtual().length === 0">
          <p class="vazio">Nenhum dado disponível.</p>
        </template>
        <template x-if="tabelaProventosAtual().length > 0">
          <div class="tabela-wrap">
            <table class="tabela-proventos" aria-label="Proventos por ativo">
              <thead>
                <tr>
                  <th scope="col">Ticker</th>
                  <th scope="col" class="num">Total</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="item in tabelaProventosAtual()" :key="item.ticker + '·' + (item.tipo || 'prov')">
                  <tr
                    class="row-link"
                    tabindex="0"
                    role="link"
                    :aria-label="'Ver ativo ' + item.ticker + (item.tipo === 'Aluguel' ? ' (aluguel)' : '')"
                    @click="location.hash = 'ativo/' + item.ticker"
                    @keydown.enter="location.hash = 'ativo/' + item.ticker"
                    @keydown.space.prevent="location.hash = 'ativo/' + item.ticker">
                    <td>
                      <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                      <span x-text="item.ticker"></span>
                      <template x-if="item.tipo === 'Aluguel'"><span class="provento-tipo-tag">Aluguel</span></template>
                    </td>
                    <td class="num" x-text="formatBrl(item.total)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </section>

      <!-- ── Tela #s-dy (Fase 7a.S.7b) — Dividend Yield dedicado ────────── -->
      <section class="tela-detalhes tela-dy" x-show="rota === 'dy'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent">Dividend Yield</h1>
        </header>

        <div class="poster-wrap">
          <p class="poster" x-text="formatPctSemSinal(json?.dividend_yield?.total?.dy, 1)"></p>
          <p class="poster-cap">dividend yield da carteira · trailing 12 meses<br>renda recebida ÷ valor de mercado</p>
        </div>

        <div class="dy-compare">
          <div class="dy-cap"><span>Por classe · quem rende mais</span><span>toque para os campeões</span></div>
          <div>
            <template x-for="c in dyClassesLista()" :key="c.key">
              <button type="button" class="dy-row" :class="{ on: dySelecionado === c.key }"
                @click="selecionarDY(c.key)"
                :aria-label="'Dividend yield ' + c.nm + ' ' + formatPctSemSinal(c.dy, 1) + ' — ver os campeões'">
                <span class="cls" x-text="c.nm"></span>
                <span class="barw"><i :style="{ width: c.barPct + '%' }"></i></span>
                <span class="yv" x-text="formatPctSemSinal(c.dy, 1)"></span>
                <span class="chv" aria-hidden="true">›</span>
              </button>
            </template>
          </div>
        </div>

        <div class="dy-champs" data-testid="dy-champs" aria-live="polite" x-show="dySelecionado">
          <div class="dc-h">
            <span class="t"><span class="st" aria-hidden="true">★</span> Campeões · <span x-text="dyCampeoesLabelAtual()"></span></span>
            <span class="c">maior yield · 12m</span>
          </div>
          <template x-if="dyCampeoesAtuais().length === 0">
            <p class="dy-champs-vazio">Ainda sem campeões suficientes nesta classe.</p>
          </template>
          <template x-for="(p, i) in dyCampeoesAtuais()" :key="p.ticker">
            <div class="champ">
              <div class="champ-top">
                <span class="rk" x-text="i + 1"></span>
                <span class="flag" aria-hidden="true" x-text="p.bandeira"></span>
                <span class="tk" x-text="p.ticker"></span>
                <span class="y" x-text="formatPctSemSinal(p.dy, 1)"></span>
              </div>
              <div class="champ-bar">
                <span class="bw"><i :style="{ width: dyBarPctCampeao(p) + '%' }"></i></span>
                <span class="rs" x-text="formatMoedaCampeao(p.valor, p.moeda)"></span>
              </div>
            </div>
          </template>
        </div>

        <p class="footnote-dy">DY trailing 12m ÷ valor de mercado · <code>investimentos.db</code></p>
      </section>

      <!-- ── Tela #patrimonio ─────────────────────────────────────────── -->
      <section class="tela-detalhes tela-patrimonio" x-show="rota === 'patrimonio'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent">Histórico patrimonial</h1>
        </header>

        <div class="kpi-grid kpi-stack">
          <div class="kpi">
            <span class="kpi-label">Patrimônio atual</span>
            <span class="kpi-valor" x-text="formatBrl(patrimonioAtual())"></span>
            <span class="kpi-descricao">Valor de mercado consolidado da carteira (Brasil + EUA) na data mais recente.</span>
          </div>
          <div class="kpi">
            <span class="kpi-label">Aporte cumulativo</span>
            <span class="kpi-valor" x-text="formatBrl(aporteCumulativo())"></span>
            <span class="kpi-descricao">Soma de todos os aportes desde a Origem (compras de ativos em R$, FX-aplicado para EUA).</span>
          </div>
          <div class="kpi">
            <span class="kpi-label">Retorno acumulado</span>
            <span class="kpi-valor" x-text="formatBrl(retornoAcumuladoBrl())"></span>
            <span class="kpi-meta" x-text="retornoAcumuladoPctTexto()"></span>
            <span class="kpi-descricao">Diferença entre patrimônio atual e aporte cumulativo. Mede ganho ou perda total da carteira.</span>
          </div>
        </div>

        <div id="patrimonio-grafico" class="chart-rent" aria-label="Evolução de patrimônio e aportes"></div>
      </section>

      <!-- ── Tela #/raiox/projecao (Fase 7a.AW.2) ─────────────────────── -->
      <!-- Push child da tab Raio-X, irmã de .tela-patrimonio. Task 8-9
           reescrevem o corpo (o ensaio em capítulos, spec §6); aqui só o
           estado indisponível — o placeholder-only guard que a Task 7 deixa
           pronto para não quebrar contra o schema v2.28 novo. -->
      <section class="tela-detalhes tela-projecao" x-show="rota === 'projecao'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        aria-labelledby="proj-titulo" x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent" id="proj-titulo">Projeção</h1>
        </header>

        <template x-if="!projecao">
          <p class="placeholder">Projeção indisponível hoje.</p>
        </template>

        <template x-if="projecao">
          <article class="proj-ensaio">
            <!-- 0. Abertura: a faixa é o sujeito (anti-pattern #8: sem pôster de número único). -->
            <p class="proj-resposta">
              <template x-if="!projResposta().unica">
                <span class="proj-resposta__linha">Pelo seu histórico, aos <span x-text="projecao.idade_final"></span> você teria entre
                  <strong class="proj-faixa" x-text="formatBrlCompacto(projResposta().min)"></strong> e
                  <strong class="proj-faixa" x-text="formatBrlCompacto(projResposta().max)"></strong></span>
              </template>
              <template x-if="projResposta().unica">
                <span class="proj-resposta__linha">Pelo <span x-text="projNome(projResposta().unica.id).toLowerCase()"></span>, aos <span x-text="projecao.idade_final"></span> você teria
                  <strong class="proj-faixa" x-text="formatBrlCompacto(projResposta().min)"></strong></span>
              </template>
              <span class="proj-resposta__sub">em reais de hoje, se nada mudar no seu ritmo de aporte</span>
            </p>

            <!-- 1. De onde você parte -->
            <section class="proj-cap" data-cap="1" aria-labelledby="proj-cap-1">
              <p class="proj-cap__ordinal" aria-hidden="true">1</p>
              <h2 class="proj-cap__titulo" id="proj-cap-1">De onde você parte</h2>
              <p class="proj-cap__tema proj-num" x-text="formatBrlInteiro(projecao.partida.patrimonio)"></p>
              <p class="proj-cap__texto">É o valor de mercado de tudo o que você tem investido em
                <span x-text="projFmtData(projecao.partida.data)"></span>, cripto incluído. Daqui até os
                <span x-text="projecao.idade_final"></span> são <span x-text="projAnosTotal()"></span> anos de acumulação.</p>
              <details class="proj-conta"><summary>ver a conta</summary>
                <div class="proj-conta__corpo">
                  <p>Soma do valor de mercado de cada posição, ao preço do último fechamento publicado.</p>
                  <p>Idade hoje: <span class="proj-num" x-text="projecao.idade_atual"></span>. Horizonte: 31/12/<span x-text="projecao.ano_final"></span>, o ano em que você faz <span x-text="projecao.idade_final"></span>.</p>
                </div></details>
            </section>

            <!-- 2. Quanto você aporta -->
            <section class="proj-cap" data-cap="2" aria-labelledby="proj-cap-2">
              <p class="proj-cap__ordinal" aria-hidden="true">2</p>
              <h2 class="proj-cap__titulo" id="proj-cap-2">Quanto você aporta</h2>
              <p class="proj-cap__tema proj-num"><span x-text="formatBrlInteiro(projecao.aporte.mensal)"></span><span class="proj-cap__unidade"> por mês</span></p>
              <p class="proj-cap__texto">É a média do que entrou na carteira nos últimos 12 meses. Ela muda todo mês e não cresce com a sua renda, então por aqui a projeção é conservadora.</p>
              <p class="proj-nota proj-nota-piso" x-show="projecao.aporte.piso_zero_aplicado" x-cloak>Nos últimos 12 meses as vendas superaram os aportes, e a projeção usa zero.</p>
              <details class="proj-conta"><summary>ver a conta</summary>
                <div class="proj-conta__corpo">
                  <p>De <span x-text="projFmtData(projecao.aporte.janela.de)"></span> a <span x-text="projFmtData(projecao.aporte.janela.ate)"></span>:</p>
                  <table class="proj-tabela proj-tabela--conta">
                    <tbody>
                      <tr><th scope="row">Compras menos vendas</th><td class="proj-num" x-text="formatBrlInteiro(projecao.aporte.compras_menos_vendas)"></td></tr>
                      <tr><th scope="row">Proventos</th><td class="proj-num" x-text="'−' + formatBrlInteiro(projecao.aporte.proventos)"></td></tr>
                      <tr><th scope="row">Aluguel de ações</th><td class="proj-num" x-text="'−' + formatBrlInteiro(projecao.aporte.aluguel)"></td></tr>
                      <tr class="proj-tabela__total"><th scope="row">÷ 12</th><td class="proj-num" x-text="formatBrlInteiro(projecao.aporte.mensal)"></td></tr>
                    </tbody>
                  </table>
                  <p>Proventos e aluguel saem da conta porque as taxas de retorno já os incluem. Somá-los de novo contaria o mesmo dinheiro duas vezes.</p>
                </div></details>
            </section>

            <!-- 3. Quanto a carteira rende: quatro leituras -->
            <section class="proj-cap" data-cap="3" aria-labelledby="proj-cap-3">
              <p class="proj-cap__ordinal" aria-hidden="true">3</p>
              <h2 class="proj-cap__titulo" id="proj-cap-3">Quanto a carteira rende: quatro leituras</h2>
              <p class="proj-cap__tema proj-num">
                <template x-if="projAncoras().length === 2"><span x-text="projFmtTaxa(Math.min(...projAncoras().map(c => c.taxa_real))) + ' a ' + projFmtTaxa(Math.max(...projAncoras().map(c => c.taxa_real)))"></span></template>
                <template x-if="projAncoras().length === 1"><span x-text="projFmtTaxa(projAncoras()[0].taxa_real)"></span></template>
                <span class="proj-cap__unidade"> ao ano, acima da inflação</span></p>
              <p class="proj-cap__texto">As duas leituras do seu histórico são as âncoras. As duas de mercado servem de comparação.</p>

              <div class="proj-regua" role="img" :aria-label="projReguaLabel()">
                <div class="proj-regua__eixo" aria-hidden="true">
                  <span class="proj-regua__zero" :style="'left:' + projRegua().zeroX + '%'"><span class="proj-regua__zero-rot">0%</span></span>
                  <template x-for="m in projRegua().marcas" :key="m.id">
                    <span class="proj-regua__marca" :class="'proj-regua__marca--' + m.papel" :style="'left:' + m.x + '%'"></span>
                  </template>
                </div>
                <ol class="proj-regua__rotulos" aria-hidden="true">
                  <template x-for="m in projRegua().marcas" :key="m.id">
                    <li class="proj-regua__rotulo" :class="['proj-regua__rotulo--' + m.papel, 'proj-regua__rotulo--' + m.lado]" :style="'--x:' + m.x + '%'">
                      <span x-text="projNome(m.id)"></span> <span class="proj-num" x-text="projFmtTaxa(m.taxa)"></span></li>
                  </template>
                </ol>
              </div>

              <template x-if="!projCenario('twr')"><p class="proj-indisponivel">Retorno da carteira indisponível hoje.</p></template>
              <template x-if="projCenario('twr')">
                <section class="proj-leitura" x-data="{ c: projCenario('twr') }">
                  <h3 class="proj-leitura__nome">Retorno da carteira</h3>
                  <p class="proj-leitura__taxa proj-num" x-text="projFmtTaxa(c.taxa_real) + ' ao ano, acima da inflação'"></p>
                  <p class="proj-cap__texto">Mede quanto os seus ativos renderam, ano a ano, sem importar quanto dinheiro havia em cada um.</p>
                  <details class="proj-conta"><summary>ver a conta</summary>
                    <div class="proj-conta__corpo">
                      <p>TWR desde <span x-text="projFmtMes(c.receita.janela.de)"></span>: <span class="proj-num" x-text="projFmtTaxa(c.receita.taxa_nominal)"></span> ao ano.
                        IPCA da mesma janela, até <span x-text="projFmtMes(c.receita.janela.ate)"></span>: <span class="proj-num" x-text="projFmtTaxa(c.receita.ipca_aa)"></span> ao ano.</p>
                      <p class="proj-formula">(1 + <span x-text="projFmtTaxa(c.receita.taxa_nominal)"></span>) ÷ (1 + <span x-text="projFmtTaxa(c.receita.ipca_aa)"></span>) − 1 = <span x-text="projFmtTaxa(c.taxa_real)"></span></p>
                      <p>O retorno da carteira tem um viés pequeno e conhecido: uma posição fica sem cotação num único fim de mês.</p>
                    </div></details>
                </section>
              </template>

              <template x-if="!projCenario('xirr')"><p class="proj-indisponivel">Retorno do seu dinheiro indisponível hoje.</p></template>
              <template x-if="projCenario('xirr')">
                <section class="proj-leitura" x-data="{ c: projCenario('xirr') }">
                  <h3 class="proj-leitura__nome">Retorno do seu dinheiro</h3>
                  <p class="proj-leitura__taxa proj-num" x-text="projFmtTaxa(c.taxa_real) + ' ao ano, acima da inflação'"></p>
                  <p class="proj-cap__texto">Mede quanto o seu dinheiro rendeu, considerando quando cada aporte entrou. Mistura o retorno dos ativos com o momento dos seus aportes.</p>
                  <details class="proj-conta"><summary>ver a conta</summary>
                    <div class="proj-conta__corpo">
                      <p>XIRR desde <span x-text="projFmtMes(c.receita.janela.de)"></span>: <span class="proj-num" x-text="projFmtTaxa(c.receita.taxa_nominal)"></span> ao ano.
                        IPCA da mesma janela, até <span x-text="projFmtMes(c.receita.janela.ate)"></span>: <span class="proj-num" x-text="projFmtTaxa(c.receita.ipca_aa)"></span> ao ano.</p>
                      <p class="proj-formula">(1 + <span x-text="projFmtTaxa(c.receita.taxa_nominal)"></span>) ÷ (1 + <span x-text="projFmtTaxa(c.receita.ipca_aa)"></span>) − 1 = <span x-text="projFmtTaxa(c.taxa_real)"></span></p>
                    </div></details>
                </section>
              </template>

              <!-- O único grifo da tela (anti-pattern #14, colocação canônica desta tela). -->
              <template x-if="projGrifoFrase()">
                <aside class="grifo proj-grifo">
                  <h3 class="proj-grifo__titulo">Por que as duas medidas do seu histórico discordam</h3>
                  <p>O retorno da carteira dá o mesmo peso a cada ano. O do seu dinheiro pesa cada ano pelo dinheiro que estava investido nele.</p>
                  <p class="proj-nota">Nesta tabela, dinheiro novo é compras menos vendas, com os proventos reinvestidos dentro das compras. Por isso ele não bate com o aporte do capítulo 2.</p>
                  <p x-text="projGrifoFrase()"></p>
                  <table class="proj-tabela proj-tabela--anos">
                    <caption class="sr-only">Dinheiro novo e retorno da carteira em cada ano</caption>
                    <thead><tr><th scope="col">Ano</th><th scope="col">Dinheiro novo</th><th scope="col">Retorno da carteira</th></tr></thead>
                    <tbody>
                      <template x-for="a in projCenario('twr').receita.anos" :key="a.ano">
                        <tr><th scope="row" x-text="a.ano + (a.meses > 0 && a.meses < 12 ? ' (' + a.meses + ' meses)' : '')"></th>
                          <td class="proj-num" x-text="formatBrlCompacto(a.dinheiro_novo)"></td>
                          <td class="proj-num" :class="a.retorno == null && 'proj-num--texto'" x-text="a.retorno == null ? 'antes da medição' : window.formatPct(a.retorno, 1)"></td></tr>
                      </template>
                    </tbody>
                  </table>
                </aside>
              </template>

              <template x-if="projCenario('mercado_simples')">
                <section class="proj-leitura" x-data="{ c: projCenario('mercado_simples') }">
                  <h3 class="proj-leitura__nome">Mercado, média das classes</h3>
                  <p class="proj-leitura__taxa proj-num" x-text="projFmtTaxa(c.taxa_real) + ' ao ano, acima da inflação'"></p>
                  <p class="proj-cap__texto">A média das premissas de mercado de cada classe, pesada pela sua política de alocação.</p>
                  <p class="proj-cap__texto" x-show="projRuidoMercado()">A diferença para o retorno do seu dinheiro é pequena, dentro do ruído da janela.</p>
                  <details class="proj-conta"><summary>ver a conta</summary>
                    <div class="proj-conta__corpo">
                      <table class="proj-tabela">
                        <thead><tr><th scope="col">Classe</th><th scope="col">Peso</th><th scope="col">Taxa</th><th scope="col">Parcela</th></tr></thead>
                        <tbody>
                          <template x-for="p in c.receita.parcelas" :key="p.categoria">
                            <tr><th scope="row" x-text="p.categoria"></th>
                              <td class="proj-num" x-text="projFmtTaxa(p.peso_alvo, 0)"></td>
                              <td class="proj-num" x-text="projFmtTaxa(p.retorno_real)"></td>
                              <td class="proj-num" x-text="projFmtTaxa(p.parcela)"></td></tr>
                          </template>
                          <tr class="proj-tabela__total"><th scope="row" colspan="3">Soma</th><td class="proj-num" x-text="projFmtTaxa(c.taxa_real)"></td></tr>
                        </tbody>
                      </table>
                      <details class="proj-fonte"><summary>fontes das premissas</summary>
                        <ul><template x-for="p in projecao.premissas" :key="p.categoria">
                          <li><strong x-text="p.categoria"></strong>: <span x-text="p.fonte + ' (' + p.periodo + ')'"></span></li>
                        </template></ul></details>
                    </div></details>
                </section>
              </template>

              <template x-if="projCenario('mercado_rebalanceado')">
                <section class="proj-leitura" x-data="{ c: projCenario('mercado_rebalanceado') }">
                  <h3 class="proj-leitura__nome">Mercado, com rebalanceamento</h3>
                  <p class="proj-leitura__taxa proj-num" x-text="projFmtTaxa(c.taxa_real) + ' ao ano, acima da inflação'"></p>
                  <p class="proj-cap__texto">A mesma carteira de mercado, rebalanceada todo ano. Rebalancear rende um pouco mais que a média das classes, porque vende o que subiu e compra o que caiu.</p>
                  <details class="proj-conta"><summary>ver a conta</summary>
                    <div class="proj-conta__corpo">
                      <p>Média aritmética das classes: <span class="proj-num" x-text="projFmtTaxa(c.receita.media_aritmetica)"></span>.
                        Oscilação da carteira: <span class="proj-num" x-text="projFmtTaxa(c.receita.vol_carteira, 1)"></span>.
                        Rendimento composto que resulta: <span class="proj-num" x-text="projFmtTaxa(c.taxa_real)"></span>.</p>
                      <p>Esse bônus depende de correlações medidas em 12 a 31 anos e de rebalancear sem custo.</p>
                    </div></details>
                </section>
              </template>

              <ul class="proj-limites">
                <li>O seu histórico cobre cerca de <span x-text="projAnosHistorico()"></span> anos para prever <span x-text="projAnosTotal()"></span>.</li>
                <li>O retorno do seu dinheiro mistura o que os ativos renderam com o momento em que o dinheiro entrou.</li>
                <li>O número anda: ele é recalculado toda noite, e o valor central se move com o seu histórico.</li>
              </ul>
            </section>

            <!-- 4. O que isso dá aos 65 -->
            <section class="proj-cap" data-cap="4" aria-labelledby="proj-cap-4">
              <p class="proj-cap__ordinal" aria-hidden="true">4</p>
              <h2 class="proj-cap__titulo" id="proj-cap-4" x-text="'O que isso dá aos ' + projecao.idade_final"></h2>
              <p class="proj-cap__tema proj-num">
                <template x-if="!projResposta().unica"><span x-text="formatBrlCompacto(projResposta().min) + ' a ' + formatBrlCompacto(projResposta().max)"></span></template>
                <template x-if="projResposta().unica"><span x-text="formatBrlCompacto(projResposta().min)"></span></template></p>
              <p class="proj-cap__texto">As quatro leituras levadas até os <span x-text="projecao.idade_final"></span>, com o mesmo aporte. As duas do seu histórico em linha cheia; as de mercado, tracejadas.</p>
              <div id="chart-projecao-mapa" class="proj-mapa" role="img" :aria-label="projMapaLabel()"></div>
              <table class="proj-tabela proj-tabela--final">
                <caption class="sr-only">Taxa e valor aos <span x-text="projecao.idade_final"></span> de cada leitura</caption>
                <thead><tr><th scope="col">Leitura</th><th scope="col">Taxa</th><th scope="col" x-text="'Aos ' + projecao.idade_final"></th></tr></thead>
                <tbody>
                  <template x-for="c in projCenarios()" :key="c.id">
                    <tr><th scope="row" x-text="projNome(c.id)"></th>
                      <td class="proj-num" x-text="projFmtTaxa(c.taxa_real)"></td>
                      <td class="proj-num" x-text="formatBrlCompacto(projValorFinal(c))"></td></tr>
                  </template>
                </tbody>
              </table>
              <template x-for="c in projAncoras()" :key="c.id">
                <div class="proj-decomp">
                  <p class="proj-decomp__titulo"><span x-text="projNome(c.id)"></span>: na taxa constante, sem sorteio,
                    <span class="proj-num" x-text="formatBrlCompacto(c.final.deterministico)"></span>. A mediana da simulação é
                    <span x-text="projPraticamente(c)"></span>esse mesmo histórico composto.</p>
                  <div class="proj-decomp__barra" aria-hidden="true">
                    <template x-for="p in projDecomposicao(c).filter(p => p.pct > 0)" :key="p.chave">
                      <span class="proj-decomp__seg" :class="'proj-decomp__seg--' + p.chave" :style="'width:' + p.pct + '%'"></span>
                    </template>
                  </div>
                  <ul class="proj-decomp__lista">
                    <template x-for="p in projDecomposicao(c)" :key="p.chave">
                      <li><span class="proj-decomp__marca" :class="'proj-decomp__seg--' + p.chave" aria-hidden="true"></span>
                        <span x-text="p.rotulo"></span> <span class="proj-num" x-text="formatBrlCompacto(p.valor)"></span></li>
                    </template>
                  </ul>
                  <details class="proj-conta"><summary>ver a conta</summary>
                    <div class="proj-conta__corpo">
                      <p>Patrimônio de hoje, <span x-text="formatBrlInteiro(projecao.partida.patrimonio)"></span>, crescido a <span x-text="projFmtTaxa(c.taxa_real)"></span> ao ano até <span x-text="projecao.ano_final"></span>.
                        Aportes: <span x-text="formatBrlInteiro(projecao.aporte.mensal)"></span> por mês, somados sem rendimento.
                        O rendimento dos aportes é o que falta para fechar o total.</p>
                    </div></details>
                </div>
              </template>
            </section>

            <!-- 5. A incerteza -->
            <section class="proj-cap" data-cap="5" aria-labelledby="proj-cap-5">
              <p class="proj-cap__ordinal" aria-hidden="true">5</p>
              <h2 class="proj-cap__titulo" id="proj-cap-5">A incerteza</h2>
              <p class="proj-cap__tema proj-num"><span x-text="projFmtTaxa(projecao.incerteza.vol, 1)"></span><span class="proj-cap__unidade"> de oscilação ao ano</span></p>
              <p class="proj-cap__texto">A largura das faixas vem da oscilação da própria carteira, medida em
                <span x-text="projecao.incerteza.meses"></span> meses. O modelo das classes daria
                <span class="proj-num" x-text="projFmtTaxa(projecao.incerteza.vol_modelo_classes, 1)"></span>.</p>
              <p class="proj-cap__texto">Só as duas leituras do seu histórico têm faixa. As de mercado servem para comparar taxas, e quatro faixas juntas não se leem.</p>
              <p class="proj-cap__texto">Em <span x-text="projAnosTotal()"></span> anos a faixa é larga, e essa largura é a resposta honesta, não um defeito.</p>
              <template x-for="c in projAncoras()" :key="c.id">
                <figure class="proj-leque">
                  <figcaption class="proj-leque__titulo"><span x-text="projNome(c.id)"></span>: em 8 de cada 10 trajetórias, entre
                    <span class="proj-num" x-text="formatBrlCompacto(c.final.p10)"></span> e <span class="proj-num" x-text="formatBrlCompacto(c.final.p90)"></span>.</figcaption>
                  <div :id="'chart-projecao-leque-' + c.id" class="proj-leque__grafico" role="img" :aria-label="projLequeLabel(c)"></div>
                </figure>
              </template>
            </section>

            <!-- 6. O que mexe o ponteiro -->
            <section class="proj-cap" data-cap="6" aria-labelledby="proj-cap-6">
              <p class="proj-cap__ordinal" aria-hidden="true">6</p>
              <h2 class="proj-cap__titulo" id="proj-cap-6">O que mexe o ponteiro</h2>
              <p class="proj-cap__texto">Quanto a mediana aos <span x-text="projecao.idade_final"></span> muda com cada alavanca. Os cenários com nome próprio são hipotéticos, não previsões.</p>
              <table class="proj-tabela proj-tabela--ponteiro">
                <caption class="sr-only">Efeito de cada alavanca sobre a mediana</caption>
                <thead><tr><th scope="col"><span class="sr-only">Alavanca</span></th>
                  <template x-for="c in projAncoras()" :key="c.id"><th scope="col" x-text="projNome(c.id)"></th></template></tr></thead>
                <tbody>
                  <template x-for="s in projecao.ponteiro.sensibilidade" :key="s.rotulo">
                    <tr><th scope="row" x-text="s.rotulo"></th>
                      <template x-for="c in projAncoras()" :key="c.id">
                        <td class="proj-num proj-delta" :class="s.por_ancora[c.id] < 0 ? 'proj-neg' : 'proj-pos'">
                          <span aria-hidden="true" x-text="s.por_ancora[c.id] < 0 ? '▼' : '▲'"></span>
                          <span x-text="formatDeltaCompacto(s.por_ancora[c.id])"></span></td>
                      </template></tr>
                  </template>
                  <template x-for="e in projecao.ponteiro.estresse" :key="e.nome">
                    <tr><th scope="row"><span class="proj-ponteiro__nome" x-text="e.nome"></span>
                        <span class="proj-ponteiro__desc" x-text="e.descricao"></span></th>
                      <template x-for="c in projAncoras()" :key="c.id">
                        <td class="proj-num proj-delta" :class="e.por_ancora[c.id].delta < 0 ? 'proj-neg' : 'proj-pos'">
                          <span aria-hidden="true" x-text="e.por_ancora[c.id].delta < 0 ? '▼' : '▲'"></span>
                          <span x-text="formatDeltaCompacto(e.por_ancora[c.id].delta)"></span></td>
                      </template></tr>
                  </template>
                </tbody>
              </table>
            </section>

            <!-- 7. O que esta conta não inclui -->
            <section class="proj-cap" data-cap="7" aria-labelledby="proj-cap-7">
              <p class="proj-cap__ordinal" aria-hidden="true">7</p>
              <h2 class="proj-cap__titulo" id="proj-cap-7">O que esta conta não inclui</h2>
              <ul class="proj-limites">
                <li><strong>Impostos e custos.</strong> As taxas de mercado são de índice, brutas, então o viés é para cima.</li>
                <li><strong>Índice e escolhas próprias.</strong> A carteira real mistura fundos de índice e ativos escolhidos um a um.</li>
                <li><strong>Aporte que cresce com a renda.</strong> A projeção supõe o aporte de hoje até o fim.</li>
              </ul>
            </section>

            <p class="proj-rodape" x-text="projecao.incerteza.trajetorias.toLocaleString('pt-BR') + ' trajetórias · recalculada toda noite · projeção, não promessa'"></p>
          </article>
        </template>
      </section>

      <!-- ── Tela #aportar (Fase 7a.H.1) ──────────────────────────────── -->
      <section class="tela-detalhes tela-aportar" x-show="rota === 'aportar'" x-transition:enter.opacity.duration.220ms x-cloak>
        <header class="breadcrumb">
          <h1 class="eyebrow">Próximo aporte</h1>
        </header>

        <!-- 7a.AU: onde está o dinheiro, antes de quanto. Reusa o
             .escopo-toggle (nenhum componente novo), com o padrão a11y de
             #proventos: role="tab" + aria-selected. -->
        <div class="escopo-toggle aporte-mercado-toggle" role="tablist" aria-label="Mercado do aporte">
          <button data-mercado="tudo" type="button"
            @click="selecionarAporteMercado('tudo')"
            role="tab" :aria-selected="aporteMercado === 'tudo'"
            :class="{ active: aporteMercado === 'tudo' }">Tudo</button>
          <button data-mercado="brasil" type="button" aria-label="Brasil"
            @click="selecionarAporteMercado('brasil')"
            role="tab" :aria-selected="aporteMercado === 'brasil'"
            :class="{ active: aporteMercado === 'brasil' }"><span aria-hidden="true">🇧🇷</span> Brasil</button>
          <button data-mercado="eua" type="button" aria-label="Estados Unidos"
            @click="selecionarAporteMercado('eua')"
            role="tab" :aria-selected="aporteMercado === 'eua'"
            :class="{ active: aporteMercado === 'eua' }"><span aria-hidden="true">🇺🇸</span> EUA</button>
        </div>

        <div class="aporte-input-block">
          <label for="aporte-valor" class="aporte-label">Valor disponível</label>
          <input
            id="aporte-valor"
            type="text"
            inputmode="decimal"
            class="aporte-input"
            placeholder="R$ 0,00"
            x-model="aporteValor"
            @input.debounce.150ms="recalcularAporte()"
            autocomplete="off">
          <p class="aporte-helper" x-text="aporteHelperText()"></p>
          <p class="aporte-cap" x-html="aporteApcapHtml()"></p>
        </div>

        <!-- 7a.S.10: chips rápidos (Repetir/último aporte + atalhos) ────── -->
        <div class="aporte-chips">
          <button type="button" class="aporte-chip aporte-chip--hero"
                  x-show="json && json.ultimo_aporte && json.ultimo_aporte.total_brl" x-cloak
                  @click="aporteSetValor(json.ultimo_aporte.total_brl, true)"
                  x-text="'Repetir · ' + aporteFmtBrl0(json && json.ultimo_aporte ? json.ultimo_aporte.total_brl : 0)"></button>
          <button type="button" class="aporte-chip aporte-chip--add5k" @click="aporteAdd(5000)">+ 5.000</button>
          <button type="button" class="aporte-chip aporte-chip--add10k" @click="aporteAdd(10000)">+ 10.000</button>
          <button type="button" class="aporte-chip aporte-chip--zero" @click="aporteSetValor(0, true)">zerar</button>
        </div>

        <!-- 7a.S.10: scrubber "e se fosse mais?" (0–20.000, passo 100) ──── -->
        <div class="aporte-scrub-wrap">
          <div class="aporte-scrub-lbl">
            <span>E se fosse mais?</span>
            <span x-text="'R$ 0 — ' + aporteFmtBrl0(aporteScrubMax)"></span>
          </div>
          <div class="aporte-scrub">
            <div class="aporte-scrub-fill" :style="`width: ${aporteScrubPct()}%`"></div>
            <div class="aporte-scrub-knob" :style="`left: ${aporteScrubPct()}%`"></div>
            <input type="range" class="aporte-scrub-input"
                   min="0" :max="aporteScrubMax" step="100"
                   :value="Math.min(_parseAporteValor(aporteValor), aporteScrubMax)"
                   @input="aporteSetValor($event.target.valueAsNumber, false)"
                   aria-label="Arrastar para escolher o valor do aporte"
                   aria-valuemin="0" :aria-valuemax="aporteScrubMax"
                   :aria-valuenow="Math.min(_parseAporteValor(aporteValor), aporteScrubMax)">
          </div>
        </div>

        <p class="aporte-nota">
          <span x-text="aporteNotaTexto()">O plano prioriza as categorias abaixo do alvo, equal-weight nos picks — zero sobra.</span>
          <!-- 7a.AU: x-if, não x-show — no modo Tudo a linha não existe no DOM. -->
          <template x-if="aporteMercado !== 'tudo'">
            <span class="aporte-nota-mercado" x-text="aporteNotaMercado()"></span>
          </template>
          <span class="writes">Simulação pura: nada é enviado, nada é gravado.</span>
        </p>

        <div class="aporte-banner" x-show="aporteBanner" x-cloak>
          <p x-text="aporteBanner"></p>
        </div>

        <template x-for="cat in aporteCategoriasRecebedoras" :key="cat.nome">
          <article class="card aporte-card" :data-cat-nome="cat.nome">
            <header class="aporte-cat-head">
              <span class="aporte-cat-name" x-text="cat.nome"></span>
              <span class="aporte-cat-tag" x-text="aporteCatTagTexto(cat)"></span>
            </header>
            <div class="aloc-trilha aporte-trilha">
              <div class="aloc-preenchimento"
                   :style="`width: ${Math.min(Math.max(cat.atualPct, 0), 100)}%; background: var(--g-700)`"></div>
              <div class="aporte-trilha-delta"
                   :style="`left: ${Math.min(Math.max(cat.atualPct, 0), 100)}%; width: ${Math.min(cat.deltaPct, 100 - cat.atualPct)}%`"></div>
              <div class="aloc-alvo"
                   x-show="cat.alvoPct > 0"
                   :style="`left: ${Math.min(Math.max(cat.alvoPct, 0), 100)}%`"></div>
            </div>
            <p class="aporte-trilha-line">
              <span x-text="`${cat.atualPct.toFixed(1).replace('.', ',')}% → ${cat.posPct.toFixed(1).replace('.', ',')}%`"></span>
              <span x-text="`alvo ${cat.alvoPct}% · fecha ${cat.deltaPct.toFixed(1).replace('.', ',')}pp`"></span>
            </p>
            <ul class="aporte-compras">
              <template x-for="row in cat.compras" :key="row.ticker">
                <li class="aporte-compra-row">
                  <span class="flag" :aria-label="row.bandeiraLabel" x-text="row.bandeira"></span>
                  <span class="aporte-compra-main">
                    <span class="aporte-compra-tk" x-text="row.ticker"></span>
                    <span class="aporte-compra-sub" x-text="`${row.tipoLabel} · ${row.pesoIntraPct}% do bucket`"></span>
                  </span>
                  <span class="aporte-compra-qty-block">
                    <!-- 7a.S.10: sem x-text — dono exclusivo do textContent é
                         _aporteAnimarPlano (count-up via applyCountUp). Um
                         x-text reativo aqui disputaria com o RAF (mesmo
                         racional do #hero-patrimonio, ver ativarCountUpHero).
                         data-cotas/-frac carregam o valor final pro JS ler. -->
                    <span class="aporte-compra-qty"
                          :data-cotas="row.cotas"
                          :data-cotas-frac="row.cotasFormatadas.includes(',') ? 1 : 0"></span>
                    <span class="aporte-compra-qty-sub" x-text="row.valorFormatado"></span>
                  </span>
                </li>
              </template>
            </ul>
          </article>
        </template>

        <div class="grifo aporte-grifo" x-show="aporteGrifoHtml()" x-cloak x-html="aporteGrifoHtml()"></div>

        <section class="aporte-outras" x-show="aporteCategoriasNaoRecebedoras.length > 0" x-cloak>
          <h2 class="aporte-section-label">Outras categorias (sem aporte)</h2>
          <template x-for="cat in aporteCategoriasNaoRecebedoras" :key="cat.nome">
            <p class="aporte-outras-row">
              <span x-text="`▸ ${cat.nome}`"></span>
              <span x-text="`${cat.atualPct.toFixed(1).replace('.', ',')}% · alvo ${cat.alvoPct}% (${cat.label})`"></span>
            </p>
          </template>
        </section>

        <section class="aporte-pausados" x-show="aportePausados.length > 0" x-cloak>
          <p>
            <strong>Acima do alvo (não aporta)</strong><br>
            <template x-for="(ticker, i) in aportePausados" :key="ticker">
              <span>
                <span class="aporte-pausados-tk" x-text="ticker"></span>
                <span x-show="i < aportePausados.length - 1"> · </span>
              </span>
            </template>
          </p>
        </section>

        <p class="aporte-sem-posicao" x-show="aporteTickersSemPosicao.length > 0" x-cloak>
          <span>Tickers da política sem posição vigente (sem cotação para incluir no cálculo): </span>
          <span x-text="aporteTickersSemPosicao.join(', ')"></span>
        </p>
      </section>

      <!-- ── Tela #relatorio (Fase 7a.Q.3) ──────────────────────────────── -->
      <section class="tela-detalhes tela-relatorio" x-show="rota === 'relatorio'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        x-cloak>
        <header class="breadcrumb rel-breadcrumb">
          <button @click="voltarDoRelatorio()" aria-label="Voltar ao Raio-X" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent">Relatório</h1>
          <div class="rel-seletor" @keydown.escape="relSeletorAberto = false">
            <button class="rel-seletor__btn" type="button"
              :aria-expanded="relSeletorAberto"
              @click="relSeletorAberto = !relSeletorAberto">
              <span x-text="relMes ? formatMesAno(relMes.mes) : 'Meses'"></span>
              <span aria-hidden="true">▾</span>
            </button>
            <ul class="rel-seletor__lista" x-show="relSeletorAberto" x-cloak
              @click.outside="relSeletorAberto = false">
              <template x-for="m in (relIndice?.meses || [])" :key="m.mes">
                <li>
                  <button class="rel-seletor__item" type="button"
                    :class="m.mes === relMesAtual ? 'is-atual' : ''"
                    @click="selecionarMesRelatorio(m.mes)">
                    <span x-text="formatMesAno(m.mes)"></span>
                    <!-- 7a.S.9 Task 2: evento mensal — ponto "não lido" por mês. -->
                    <span class="rel-dot" x-show="!mesLido(m.mes)" aria-hidden="true" x-cloak></span>
                    <span class="sr-only" x-show="!mesLido(m.mes)" x-cloak>não lido</span>
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </header>

        <!-- 7a.S.9 Task 1: capa editorial — mês em poster + veredito derivado
             do artefato (NUNCA fabricado: 1ª frase da seção "leitura_mes"). -->
        <div class="rel-capa" x-show="relMes && !relCarregando && !relErro" x-cloak>
          <div class="rel-poster">
            <span x-text="relPosterMes"></span><br>
            <span x-text="relPosterAno"></span>
          </div>
          <p class="rel-veredito-linha" x-show="relVeredito" x-cloak>
            <b>Veredito do mês:</b> <span x-text="relVeredito"></span>
          </p>
        </div>

        <div class="rel-loading" x-show="relCarregando" x-cloak aria-live="polite">
          <div class="rel-skeleton"></div>
          <div class="rel-skeleton"></div>
          <div class="rel-skeleton rel-skeleton--short"></div>
        </div>

        <div class="rel-erro" x-show="!relCarregando && relErro" x-cloak>
          <p x-text="relErro"></p>
          <button class="rel-erro__voltar" type="button" x-show="relUltimoMes"
            @click="selecionarMesRelatorio(relUltimoMes.mes)">Voltar ao último mês</button>
        </div>

        <div class="rel-vazio" x-show="!relCarregando && !relErro && !relMes" x-cloak>
          <p>Ainda não há relatórios publicados.</p>
        </div>

        <template x-if="relMes && !relCarregando && !relErro">
          <div class="rel-corpo">
            <template x-for="sec in (relMes.secoes || [])" :key="sec.id">
              <section class="rel-secao" :class="classeSecao(sec.id)" :data-secao="sec.id">
                <h2 class="rel-secao__titulo" x-text="sec.titulo"></h2>
                <div class="rel-prosa" x-html="prosaParaHtml(sec.corpo, relMes.citacoes)"></div>
                <!-- enriquecimentos por id -->
                <template x-if="sec.id === 'radar'">
                  <ul class="rel-radar">
                    <template x-for="r in radarFiltrado(false)" :key="r.ticker">
                      <li class="rel-radar-card">
                        <div class="rel-radar-card__head">
                          <!-- 7a.R.3.b: ticker com dossiê vira link; sem dossiê
                               fica texto. Dois x-if mutuamente exclusivos (não
                               x-show: este deixaria os DOIS nós no DOM). O
                               .rel-selo ao lado não muda. -->
                          <template x-if="temDossie(r.ticker)">
                            <a class="rel-radar-card__ticker rel-radar-card__ticker--link"
                              :href="'#/dossie/' + r.ticker"
                              @click="registrarOrigemDossie()"
                              x-text="r.ticker"></a>
                          </template>
                          <template x-if="!temDossie(r.ticker)">
                            <span class="rel-radar-card__ticker" x-text="r.ticker"></span>
                          </template>
                          <span class="rel-selo" :class="vereditoSelo(r.veredito).classe">
                            <span class="rel-selo__marca" aria-hidden="true"
                              x-text="vereditoSelo(r.veredito).marca"></span>
                            <span x-text="vereditoSelo(r.veredito).label"></span>
                          </span>
                        </div>
                        <!-- 7a.AT.1: blocos rotulados. O conteudo passa pelo
                             renderizador de marcacao: o `gatilho` agora carrega
                             o evento numa linha e as duas condicoes em lista. -->
                        <div class="rel-bloco">
                          <span class="rel-bloco__rotulo">Observar</span>
                          <div class="rel-bloco__corpo"
                            x-html="prosaParaHtml(r.observar, relMes.citacoes)"></div>
                        </div>
                        <div class="rel-bloco">
                          <span class="rel-bloco__rotulo">Gatilho</span>
                          <div class="rel-bloco__corpo"
                            x-html="prosaParaHtml(r.gatilho, relMes.citacoes)"></div>
                        </div>
                      </li>
                    </template>
                  </ul>
                </template>
                <template x-if="sec.id === 'nao_funcionando'">
                  <div class="rel-veredito" x-show="radarFiltrado(true).length > 0">
                    <template x-for="r in radarFiltrado(true)" :key="'sel-' + r.ticker">
                      <span class="rel-selo" :class="vereditoSelo(r.veredito).classe">
                        <span class="rel-selo__marca" aria-hidden="true"
                          x-text="vereditoSelo(r.veredito).marca"></span>
                        <span x-text="r.ticker + ' · ' + vereditoSelo(r.veredito).label"></span>
                      </span>
                    </template>
                  </div>
                </template>
                <template x-if="sec.id === 'como_voce_foi'">
                  <div class="rel-kpis">
                    <div class="kpi">
                      <span class="kpi-label">Retorno do mês</span>
                      <span class="kpi-valor" x-text="formatPct(relMes.dossie?.performance?.Total?.retorno_mes_pct)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">CDI</span>
                      <span class="kpi-valor" x-text="formatPct(relMes.dossie?.performance?.Total?.benchmarks?.CDI)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">IBOV</span>
                      <span class="kpi-valor" x-text="formatPct(relMes.dossie?.performance?.Total?.benchmarks?.IBOV)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">S&amp;P 500</span>
                      <span class="kpi-valor" x-text="formatPct(relMes.dossie?.performance?.Total?.benchmarks?.SP500)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">Aportes líq.</span>
                      <span class="kpi-valor" x-text="formatBrl(relMes.dossie?.decomposicao?.Total?.aportes_liq_brl)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">Proventos</span>
                      <span class="kpi-valor" x-text="formatBrl(relMes.dossie?.decomposicao?.Total?.proventos_brl)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">Mercado</span>
                      <span class="kpi-valor" :class="(relMes.dossie?.decomposicao?.Total?.mercado_brl ?? 0) < 0 ? 'is-neg' : ''"
                        x-text="formatBrl(relMes.dossie?.decomposicao?.Total?.mercado_brl)"></span>
                    </div>
                  </div>
                </template>
                <template x-if="sec.id === 'renda'">
                  <div class="rel-kpis">
                    <div class="kpi">
                      <span class="kpi-label">Proventos do mês</span>
                      <span class="kpi-valor" x-text="formatBrl(relMes.dossie?.renda?.proventos_mes_brl)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">Proventos 12m</span>
                      <span class="kpi-valor" x-text="formatBrl(relMes.dossie?.renda?.proventos_12m_brl)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">DY carteira</span>
                      <span class="kpi-valor" x-text="formatPct(relMes.dossie?.renda?.dy_trailing?.total?.dy)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">Run-rate anual</span>
                      <span class="kpi-valor" x-text="formatBrl(relMes.dossie?.renda?.run_rate_mes_anualizado_brl)"></span>
                    </div>
                  </div>
                </template>
                <template x-if="sec.id === 'alinhamento'">
                  <ul class="rel-concentracao">
                    <template x-for="c in (relMes.dossie?.alinhamento?.concentracao_top || [])" :key="c.ticker">
                      <li>
                        <span class="flag" aria-hidden="true" x-text="c.bandeira"></span>
                        <span class="rel-conc__ticker" x-text="c.ticker"></span>
                        <span class="rel-conc__peso" x-text="formatPct(c.peso)"></span>
                        <span class="rel-conc__valor" x-text="formatBrl(c.valor_brl)"></span>
                      </li>
                    </template>
                  </ul>
                </template>
                <template x-if="sec.id === 'prestacao_contas'">
                  <ul class="rel-prestacao" x-show="(relMes.prestacao_contas || []).length > 0">
                    <template x-for="p in (relMes.prestacao_contas || [])" :key="'pc-' + p.ticker">
                      <li>
                        <div class="rel-prestacao__head">
                          <template x-if="temDossie(p.ticker)">
                            <a class="rel-prestacao__ticker rel-prestacao__ticker--link"
                              :href="'#/dossie/' + p.ticker"
                              @click="registrarOrigemDossie()"
                              x-text="p.ticker"></a>
                          </template>
                          <template x-if="!temDossie(p.ticker)">
                            <span class="rel-prestacao__ticker" x-text="p.ticker"></span>
                          </template>
                          <!-- 7a.AT.1: pertencimento ANTES de vereditoSelo — aquela
                               funcao devolve "Tese intacta" p/ valor desconhecido,
                               entao um typo renderizaria o selo mais otimista.
                               Relatorio antigo nao tem `veredito`: fica sem selo. -->
                          <template x-if="temSeloVeredito(p.veredito)">
                            <span class="rel-selo" :class="vereditoSelo(p.veredito).classe">
                              <span class="rel-selo__marca" aria-hidden="true"
                                x-text="vereditoSelo(p.veredito).marca"></span>
                              <span x-text="vereditoSelo(p.veredito).label"></span>
                            </span>
                          </template>
                        </div>
                        <div class="rel-bloco">
                          <span class="rel-bloco__rotulo">O que eu disse</span>
                          <div class="rel-bloco__corpo rel-prestacao__sin"
                            x-html="prosaParaHtml(p.sinalizado, relMes.citacoes)"></div>
                        </div>
                        <div class="rel-bloco">
                          <span class="rel-bloco__rotulo">O que aconteceu</span>
                          <div class="rel-bloco__corpo rel-prestacao__res"
                            x-html="prosaParaHtml(p.resultado, relMes.citacoes)"></div>
                        </div>
                      </li>
                    </template>
                  </ul>
                </template>
                <template x-if="sec.id === 'evidencias'">
                  <ol class="rel-evidencias" id="rel-evidencias">
                    <template x-for="c in (relMes.citacoes || [])" :key="'cit-' + c.id">
                      <li :value="c.id">
                        <!-- 7a.AT.1: a lista de fontes injetava `c.url` CRU, sem
                             checar esquema — segundo vetor do mesmo furo que o
                             renderizador fechou, achado pelo teste da fase (o
                             varredor olha TODO `a.rel-cit` da pagina, nao so os
                             da prosa). Mesma allowlist, mesmo alvo condicional. -->
                        <a class="rel-cit" :href="_hrefCitacaoSegura(c.url)"
                          :target="_hrefCitacaoSegura(c.url) === '#rel-evidencias' ? null : '_blank'"
                          :rel="_hrefCitacaoSegura(c.url) === '#rel-evidencias' ? null : 'noopener'"
                          x-text="c.afirmacao"></a>
                        <span class="rel-evid__fonte" x-text="' — ' + c.fonte"></span>
                        <span class="rel-evid__incerto" x-show="c.confianca === 'baixa'"> · <em>sinal incerto</em></span>
                      </li>
                    </template>
                  </ol>
                </template>
              </section>
            </template>
          </div>
        </template>
      </section>

      <!-- ── Tela #/dossie/<TICKER> — dossiê de empresa (7a.R.3.b) ───────
           Memória viva: por que eu tenho isso, e contra qual tese. NÃO é um
           segundo #ativo (spec §6.1): zero preço, zero DY, zero KPI vivo. -->
      <section class="tela-detalhes tela-dossie" x-show="rota === 'dossie'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltarDoDossie()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent">Dossiê</h1>
        </header>

        <!-- Estados espelham os do Relatório por seletor agrupado no CSS, mas
             com classes PRÓPRIAS: um segundo `.rel-erro`/`.rel-vazio` no DOM
             faria os locators sem escopo de relatorio-mensal.spec.ts
             resolverem a 2 elementos (strict mode). -->
        <div class="dossie-loading" x-show="dossieCarregando" x-cloak aria-live="polite">
          <div class="dossie-skeleton"></div>
          <div class="dossie-skeleton"></div>
          <div class="dossie-skeleton dossie-skeleton--short"></div>
        </div>

        <div class="dossie-erro" x-show="!dossieCarregando && dossieErro" x-cloak>
          <p x-text="dossieErro"></p>
          <button class="dossie-erro__acao" type="button"
            @click="carregarDossie(dossieTicker)">Tentar de novo</button>
        </div>

        <div class="dossie-vazio" x-show="!dossieCarregando && !dossieErro && !dossieAtual" x-cloak>
          <p>Ainda não há dossiê para este ativo.</p>
        </div>

        <template x-if="dossieAtual && !dossieCarregando && !dossieErro">
          <div class="dossie-corpo">
            <!-- 1. Cabeçalho -->
            <div class="dossie-cabecalho">
              <div class="dossie-cabecalho__linha">
                <span class="dossie-dot" aria-hidden="true"
                  :style="dossieCatStyle(dossieAtual.categoria)"></span>
                <span class="flag" aria-hidden="true"
                  x-text="dossieBandeira(dossieAtual.escopo)"></span>
                <span class="dossie-ticker" x-text="dossieAtual.ticker"></span>
              </div>
              <p class="dossie-sub" x-text="dossieSubtitulo"></p>
            </div>

            <!-- 2. Mini-mapa do arco: glifos de veredito sob os anos. Forma +
                 texto (par .sr-only), nunca cor sozinha. -->
            <div class="dossie-arco" x-show="dossieArco.length" x-cloak>
              <ol class="dossie-arco__linha" aria-hidden="true">
                <template x-for="(p, i) in dossieArco" :key="i">
                  <li class="dossie-arco__ponto">
                    <span class="dossie-arco__ano" x-text="p.rotuloAno"></span>
                    <span class="dossie-arco__marca" x-text="p.marca"></span>
                  </li>
                </template>
              </ol>
              <span class="sr-only" x-text="'Arco da tese: ' + dossieArcoTexto"></span>
            </div>

            <!-- 3. Linha de frescor -->
            <p class="dossie-frescor" x-show="dossieFrescor" x-cloak
              x-text="dossieFrescor"></p>

            <!-- 4. TESE — lidera a tela: é a invariante compartilhada pelos
                 dois caminhos de chegada ("por que eu tenho isso?" e "sob
                 pressão contra o quê?"). O grifo accent no `quebra_se` é a
                 ÚNICA ocorrência da tela (anti-pattern #14). -->
            <section class="dossie-tese">
              <h2 class="dossie-h">Tese</h2>
              <div class="rel-prosa" x-text="dossieAtual.tese?.resumo"></div>
              <!-- x-if (não x-show): sem `quebra_se` o grifo não deve EXISTIR.
                   Com x-show o nó ficaria no DOM, tornando a invariante "uma
                   .grifo por tela" invisível ao teste e deixando um nó fantasma
                   para o leitor de tela. -->
              <template x-if="dossieAtual.tese?.quebra_se">
                <div class="grifo dossie-grifo">
                  <span class="dossie-grifo__rot">A tese quebra se</span>
                  <p x-text="dossieAtual.tese?.quebra_se"></p>
                </div>
              </template>
              <p class="dossie-revisada" x-show="dossieAtual.tese?.revisada_em" x-cloak
                x-text="'Tese revisada em ' + formatDataIso(dossieAtual.tese?.revisada_em)"></p>
              <!-- Selo DERIVADO (7a.AD.2): fora do `.grifo` de propósito — a
                   tela já gastou seu único grifo no `quebra_se` (anti-pattern
                   #14) e o selo não pode competir com ele. Fecha o bloco da
                   tese porque é a leitura FINAL dela: "esta aqui envelheceu".
                   A11y em forma + TEXTO: o glifo é decorativo, o texto é real
                   e é o que o leitor de tela lê — nunca cor sozinha. -->
              <p class="dossie-pede-revisao" x-show="dossiePedeRevisao" x-cloak>
                <span aria-hidden="true">⟳</span>
                <span>esta tese pede revisão</span>
              </p>
            </section>

            <!-- 5. LINHA DO TEMPO — ordem cronológica ASCENDENTE, todas as
                 entradas abertas. Documento contínuo separado por hairline;
                 sem card por entrada, sem espinha vertical, sem side-stripe
                 (#14 já gasto no grifo da tese). Nada é colapsável: com 3 a 5
                 entradas o scroll É a leitura, e o mini-mapa já orienta. -->
            <section class="dossie-tl">
              <h2 class="dossie-h">Linha do tempo</h2>
              <p class="dossie-tl-vazio" x-show="!(dossieAtual.timeline || []).length"
                x-cloak>sem entradas ainda</p>
              <template x-for="(e, i) in (dossieAtual.timeline || [])" :key="e.data + '-' + i">
                <article class="dossie-tl__item">
                  <div class="dossie-tl__marco">
                    <h3 class="dossie-tl__data" x-text="formatMarcoMes(e.data)"></h3>
                    <span class="rel-selo" :class="vereditoSelo(e.veredito).classe">
                      <span class="rel-selo__marca" aria-hidden="true"
                        x-text="vereditoSelo(e.veredito).marca"></span>
                      <span x-text="vereditoSelo(e.veredito).label"></span>
                    </span>
                  </div>
                  <p class="dossie-tl__gatilho" x-show="e.gatilho" x-cloak
                    x-text="e.gatilho"></p>
                  <div class="rel-prosa" x-html="leituraParaHtml(e.leitura)"></div>
                  <dl class="dossie-numeros"
                    x-show="paresNumeros(e.numeros_reportados).length" x-cloak>
                    <template x-for="(p, j) in paresNumeros(e.numeros_reportados)" :key="j">
                      <div class="dossie-numeros__par">
                        <dt x-show="p.rotulo" x-text="p.rotulo"></dt>
                        <dd x-text="p.valor"></dd>
                      </div>
                    </template>
                  </dl>
                  <ul class="dossie-fontes">
                    <template x-for="(f, k) in (e.fontes || [])" :key="k">
                      <li>
                        <!-- Dois x-if mutuamente exclusivos: x-show deixaria os
                             DOIS nós no DOM (nó fantasma + locator a 2). -->
                        <template x-if="urlFonteSegura(f.url)">
                          <a :href="urlFonteSegura(f.url)" target="_blank" rel="noopener"
                            x-text="f.titulo"></a>
                        </template>
                        <template x-if="!urlFonteSegura(f.url)">
                          <span x-text="f.titulo"></span>
                        </template>
                      </li>
                    </template>
                  </ul>
                </article>
              </template>
            </section>
          </div>
        </template>
      </section>

      </div>
    </template>

    <template x-if="fase === 'raiox'">
      <nav class="tab-bar" role="navigation" aria-label="Navegação principal">
        <span class="tab-bar-indicator" aria-hidden="true"></span>
        <a href="#" data-tab="raiox" :aria-current="tab === 'raiox' ? 'page' : null" @click.prevent="rota = ''; tab = 'raiox'; history.replaceState(null, '', location.pathname); $nextTick(() => iniciarAbertura())">Raio-X</a>
        <a href="#rentabilidade" data-tab="rentab" :aria-current="tab === 'rentab' ? 'page' : null">Rentabilidade</a>
        <a href="#alocacao" data-tab="aloca" :aria-current="tab === 'aloca' ? 'page' : null">Alocação</a>
        <a href="#proventos" data-tab="provent" :aria-current="tab === 'provent' ? 'page' : null">Proventos</a>
        <a href="#aportar" data-tab="aportar" :aria-current="tab === 'aportar' ? 'page' : null">Aportar</a>
      </nav>
    </template>
  </main>

  <!-- Aviso de nova versão do app (shell). Surge via evento window
       "sw:update-available" (js/sw-update.js) → estado atualizacaoDisponivel.
       Superfície teal sólida; sem border-left; copy sem travessão. -->
  <div class="update-snackbar" x-show="atualizacaoDisponivel"
       x-transition:enter="us-enter"
       x-transition:enter-start="us-enter-start"
       x-transition:enter-end="us-enter-end"
       role="status" aria-live="polite" x-cloak>
    <span class="update-snackbar__icone" aria-hidden="true">↻</span>
    <span class="update-snackbar__texto">Nova versão disponível</span>
    <button type="button" class="update-snackbar__acao" @click="recarregarVersao()">Recarregar</button>
    <button type="button" class="update-snackbar__fechar" @click="dispensarAtualizacao()"
            aria-label="Dispensar aviso">✕</button>
  </div>
</body>
</html>
