<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#064e3b">
  <title>Carteira Arthur</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="css/app.css?v=53">
  <script src="js/vendor/echarts.min.js?v=40"></script>
  <script src="js/echarts-theme.js?v=40"></script>
  <script src="js/crypto.js?v=40"></script>
  <script src="js/format.js?v=43"></script>
  <script src="js/transitions.js?v=41"></script>
  <script src="js/aportar.js?v=40"></script>
  <script src="js/app.js?v=53"></script>
  <script defer src="js/vendor/alpine.min.js?v=40"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch((err) => {
          console.warn("SW register falhou:", err);
        });
      });
    }
  </script>
</head>
<body x-data="app" x-cloak>
  <div
    class="toast"
    :class="toast.tom ? ('toast-' + toast.tom) : ''"
    x-show="toast.visible"
    x-transition.opacity
    role="status"
    aria-live="polite"
    x-text="toast.mensagem"></div>
  <main>
    <template x-if="fase === 'pin'">
      <section class="pin-screen" :class="{ 'is-shaking': shake, 'pin-dissolve': pinDissolvendo }">
        <h1>Carteira</h1>
        <label for="pin-input" class="subtitle" x-show="!estaBloqueado">Digite o PIN para visualizar</label>
        <p class="subtitle pin-block-msg" x-show="estaBloqueado"
           x-text="'Muitas tentativas. Aguarde ' + bloqueioRestanteMin + ' min'"></p>
        <form @submit.prevent="submitPin">
          <input
            id="pin-input"
            type="tel"
            inputmode="numeric"
            pattern="\d{6}"
            maxlength="6"
            autocomplete="off"
            x-model="pin"
            :disabled="carregando || estaBloqueado"
            placeholder="••••••"
            class="pin-input"
            autofocus>
          <button type="submit"
            :disabled="carregando || estaBloqueado || pin.length !== 6"
            class="pin-submit">
            <span x-show="!carregando && !estaBloqueado">Entrar</span>
            <span x-show="carregando">Decifrando…</span>
            <span x-show="!carregando && estaBloqueado"
              x-text="'Aguarde ' + bloqueioRestanteMin + ' min'"></span>
          </button>
          <p class="pin-error" x-show="pinError && !estaBloqueado" x-text="pinError"></p>
        </form>
      </section>
    </template>

    <template x-if="fase === 'raiox'">
      <div>
      <section class="raiox" x-show="rota === ''" x-transition:enter.opacity.duration.220ms x-cloak
               x-init="iniciarAbertura()">
        <h1 class="eyebrow">Raio X</h1>

        <!-- 7a.S.5: o hero virou um card de facetas — tap/Enter/Space/dots
             ciclam 4 fatos read-only (patrimônio · divisão BR/EUA · variação
             7d · desde a origem). O conteúdo de #hero-body é gerido de forma
             imperativa (montarHeroFacetas/_renderHeroFace), no mesmo espírito
             de ativarCountUpHero — evita a reatividade do Alpine disputar com
             a transição de duas camadas (.hero-face.out/.on). -->
        <div class="hero"
             id="hero"
             role="button"
             tabindex="0"
             aria-label="Patrimônio — toque para alternar a leitura"
             x-init="montarHeroFacetas()"
             @click="ciclarHeroFacet()"
             @keydown.enter.prevent="ciclarHeroFacet()"
             @keydown.space.prevent="ciclarHeroFacet()">
          <div class="hero-meta">
            <p class="hero-label" id="hero-eyebrow">Patrimônio total</p>
            <p class="hero-updated" x-text="formatDataHora(json.atualizado_em)"></p>
          </div>
          <div class="hero-body" id="hero-body" aria-live="polite"></div>
          <div class="hero-facets" aria-label="Facetas do patrimônio">
            <template x-for="(label, i) in heroFacetLabels" :key="'fd-' + i">
              <button type="button"
                      class="fd"
                      :class="{ on: i === heroFacetAtivo }"
                      :aria-current="i === heroFacetAtivo"
                      :aria-label="'Faceta ' + (i + 1) + ' de 4: ' + label"
                      @click.stop="irParaFacetHero(i)"
                      @keydown.stop></button>
            </template>
          </div>
          <div class="hero-hint" :class="{ gone: heroFacetHintGone }" aria-hidden="true">
            <span>☞</span> toque no número
          </div>
        </div>
        <a href="#/raiox/chart" class="hero-chart-link" aria-label="Ver histórico completo do patrimônio">
          <span>Ver histórico</span>
          <span class="hero-chart-link__chevron" aria-hidden="true">›</span>
        </a>

        <!-- 7a.S.5 Task 2: quando o schema tem `ultimos_7d` mas ainda não há
             dado suficiente (DB recém-bootstrapped, sem snapshot ≥7d e sem
             movimentos na janela), uma frase curta substitui o silêncio
             total. Distinto do legado (schema < v2.13, sem `ultimos_7d`
             nenhum) — aí nem esta mensagem aparece. -->
        <p class="r7d-vazio"
           x-show="json.ultimos_7d && !ultimos7dVisivel()"
           x-cloak>
          Sem novidade por aqui nesta semana.
        </p>

        <section
          class="raiox-7d"
          aria-label="Últimos 7 dias"
          x-show="ultimos7dVisivel()"
          x-cloak>
          <header class="r7d-head">
            <span class="r7d-label">Últimos 7 dias</span>
            <span
              class="r7d-delta"
              :class="sinalClasse(json.ultimos_7d?.delta_patrim_brl)"
              x-text="formatDeltaR7d(json.ultimos_7d?.delta_patrim_brl, json.ultimos_7d?.delta_patrim_pct)"></span>
          </header>

          <div class="r7d-decomp">
            <div class="r7d-row">
              <span>Aportes líq.</span>
              <span
                :class="sinalClasse(json.ultimos_7d?.decomposicao?.aportes_liq_brl)"
                x-text="formatDecompR7d(json.ultimos_7d?.decomposicao?.aportes_liq_brl)"></span>
            </div>
            <div class="r7d-row">
              <span>Proventos</span>
              <span
                :class="sinalClasse(json.ultimos_7d?.decomposicao?.proventos_brl)"
                x-text="formatDecompR7d(json.ultimos_7d?.decomposicao?.proventos_brl)"></span>
            </div>
            <div class="r7d-row">
              <span>Mercado</span>
              <span
                :class="sinalClasse(json.ultimos_7d?.decomposicao?.mercado_brl)"
                x-text="formatDecompR7d(json.ultimos_7d?.decomposicao?.mercado_brl)"></span>
            </div>
          </div>

          <div
            class="r7d-movers"
            x-show="(json.ultimos_7d?.variacao_mercado || []).length > 0"
            x-cloak>
            <div class="r7d-movers-head">
              <span class="r7d-movers-title"><span class="r7d-movers-star" aria-hidden="true">★ </span>Variação no mercado</span>
              <span class="r7d-movers-cap">por impacto · R$</span>
            </div>
            <ul>
              <template x-for="(m, i) in (json.ultimos_7d?.variacao_mercado || [])"
                        :key="m.ticker + '-' + m.moeda + '-' + i">
                <li>
                  <span class="arr" :class="sinalClasse(m.impacto_brl)"
                        aria-hidden="true"
                        x-text="m.impacto_brl >= 0 ? '▲' : '▼'"></span>
                  <span class="tk" x-text="m.ticker"></span>
                  <span class="flag" aria-hidden="true" x-text="m.bandeira"></span>
                  <span class="rs" :class="sinalClasse(m.impacto_brl)"
                        x-text="formatBrlSigned(m.impacto_brl)"></span>
                  <span class="pc"
                        x-text="m.retorno_pct == null ? '' : formatPct(m.retorno_pct)"></span>
                </li>
              </template>
            </ul>
          </div>

          <!-- 7a.S.5 Task 2: semana ativa mas sem cotação-base pra rankear
               movers (ticker sem cotação ≤ base_data) — voz em vez de
               silêncio, sem confundir com "semana calma" (que não mostra
               nada aqui, de propósito, quando TUDO está vazio). -->
          <p class="r7d-movers-vazio"
             x-show="ultimos7dVisivel() && (json.ultimos_7d?.variacao_mercado || []).length === 0"
             x-cloak>
            Sem destaque de mercado nesta semana.
          </p>

          <div class="r7d-listas">
            <div class="r7d-lista" data-list="compras" x-show="(json.ultimos_7d?.compras || []).length > 0">
              <h3>Compras</h3>
              <ul>
                <template x-for="(item, idx) in (json.ultimos_7d?.compras || [])" :key="'c-' + item.ticker + '-' + item.moeda + '-' + idx">
                  <li>
                    <span class="ticker" x-text="item.ticker"></span>
                    <span class="qty" x-text="formatQtyR7d(item.quantidade)"></span>
                    <span class="valor" x-text="formatBrl(item.valor_brl)"></span>
                    <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                  </li>
                </template>
              </ul>
            </div>
            <div class="r7d-lista" data-list="vendas" x-show="(json.ultimos_7d?.vendas || []).length > 0">
              <h3>Vendas</h3>
              <ul>
                <template x-for="(item, idx) in (json.ultimos_7d?.vendas || [])" :key="'v-' + item.ticker + '-' + item.moeda + '-' + idx">
                  <li>
                    <span class="ticker" x-text="item.ticker"></span>
                    <span class="qty" x-text="formatQtyR7d(item.quantidade)"></span>
                    <span class="valor" x-text="formatBrl(item.valor_brl)"></span>
                    <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                  </li>
                </template>
              </ul>
            </div>
            <div class="r7d-lista" data-list="proventos" x-show="(json.ultimos_7d?.proventos || []).length > 0">
              <h3>Proventos</h3>
              <ul>
                <template x-for="(item, idx) in (json.ultimos_7d?.proventos || [])" :key="'p-' + item.ticker + '-' + item.tipo + '-' + idx">
                  <li>
                    <span class="ticker" x-text="item.ticker"></span>
                    <span class="qty" x-text="abreviarTipoR7d(item.tipo)"></span>
                    <span class="valor" x-text="formatBrl(item.valor_brl)"></span>
                    <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                  </li>
                </template>
              </ul>
            </div>
          </div>
        </section>

        <section class="aporte-bloco" aria-label="Último aporte">
          <p class="aporte-label">Último aporte</p>
          <template x-if="json.ultimo_aporte">
            <div>
              <div class="aporte-header">
                <div class="aporte-header-left">
                  <span class="aporte-data" x-text="formatDataCurta(json.ultimo_aporte.data)"></span>
                  <span class="aporte-ha"
                    x-text="json.ultimo_aporte.dias_atras === 0 ? 'hoje' : 'há ' + json.ultimo_aporte.dias_atras + ' dia' + (json.ultimo_aporte.dias_atras === 1 ? '' : 's')">
                  </span>
                </div>
                <span class="aporte-pill" x-text="formatBrl(json.ultimo_aporte.total_brl)"></span>
              </div>
              <template x-for="item in json.ultimo_aporte.itens" :key="item.ticker">
                <a class="aporte-item aporte-item-link" :href="'#ativo/' + item.ticker">
                  <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                  <div class="aporte-detalhes">
                    <span class="aporte-ticker" x-text="item.ticker"></span>
                    <span class="aporte-meta"
                      x-text="item.quantidade + ' cota' + (item.quantidade === 1 ? '' : 's') + ' · ' + formatBrl(item.preco_unitario) + ' por unidade'">
                    </span>
                  </div>
                  <span class="aporte-valor" x-text="formatBrl(item.valor_brl)"></span>
                </a>
              </template>
            </div>
          </template>
          <template x-if="!json.ultimo_aporte">
            <p class="aporte-vazio">Nenhum aporte por aqui ainda.</p>
          </template>
        </section>

        <!-- 7a.Q.3: card de entrada para o Relatório Mensal -->
        <a class="rel-card-home" x-show="relUltimoMes" href="#/raiox/relatorio"
           aria-label="Abrir relatório mensal do assessor" x-cloak>
          <div class="rel-card-home__meta">
            <span class="rel-card-home__label">
              Relatório do mês
              <!-- 7a.S.9 Task 2: evento mensal — ponto "não lido" (relRead). -->
              <span class="rel-dot" x-show="relUltimoMes && !mesLido(relUltimoMes.mes)"
                aria-hidden="true" x-cloak></span>
              <span class="sr-only" x-show="relUltimoMes && !mesLido(relUltimoMes.mes)"
                x-cloak>não lido</span>
            </span>
            <span class="rel-card-home__mes"
              x-text="relUltimoMes ? formatMesAno(relUltimoMes.mes) : ''"></span>
          </div>
          <span class="rel-card-home__chevron" aria-hidden="true">›</span>
        </a>

        <footer class="rodape">
          <p>Fonte: <code>investimentos.db</code> · doc-trail auditável</p>
          <button @click="bloquear" class="btn-bloquear" type="button">🔒 Bloquear sessão</button>
        </footer>
      </section>

      <section class="tela-detalhes tela-rentabilidade" x-show="rota === 'rentabilidade'" x-transition:enter.opacity.duration.220ms x-cloak>
        <header class="breadcrumb">
          <h1 class="eyebrow">Rentabilidade</h1>
        </header>

        <div class="escopo-toggle" role="tablist">
          <button
            data-escopo="Total" type="button"
            @click="selecionarEscopo('Total')"
            :class="{ active: escopoAtivo === 'Total' }">Total</button>
          <button
            data-escopo="Brasil" type="button"
            aria-label="Brasil"
            @click="selecionarEscopo('Brasil')"
            :class="{ active: escopoAtivo === 'Brasil' }"><span aria-hidden="true">🇧🇷</span> Brasil</button>
          <button
            data-escopo="EUA" type="button"
            aria-label="EUA"
            @click="selecionarEscopo('EUA')"
            :class="{ active: escopoAtivo === 'EUA' }"><span aria-hidden="true">🇺🇸</span> EUA</button>
        </div>

        <div class="moeda-toggle" role="tablist"
             x-show="moedaToggleVisivel()" x-cloak>
          <button
            data-moeda="BRL" type="button"
            @click="selecionarMoeda('BRL')"
            :class="{ active: moeda === 'BRL' }"
            aria-label="Mostrar carteira EUA em reais">BRL</button>
          <button
            data-moeda="USD" type="button"
            @click="selecionarMoeda('USD')"
            :class="{ active: moeda === 'USD' }"
            aria-label="Mostrar carteira EUA em dólares (paridade Avenue)">USD</button>
        </div>

        <p class="chart-rent-subtitulo" x-text="rentabilidadeSubtitulo" x-show="rentabilidadeSubtitulo"></p>
        <div id="chart-rent" class="chart-rent" aria-label="Histórico TWR"></div>

        <!-- 7a.L.2.b: 4º card "Período" — TWR/XIRR a.a. + vs benchmark calculados
             para a janela atual do dataZoom. fimIdx=null = chart ainda não
             hidratou → oculto. Título dinâmico: "Origem" (full range) ou
             "Período · mai/25 → mai/26". Usa classe própria .rent-periodo
             (não .rent-grupo) para preservar invariantes "3 grupos fixos"
             dos specs existentes — CSS espelha .rent-grupo intencionalmente. -->
        <section class="rent-periodo" x-show="periodoCustom.fimIdx !== null">
          <h3 class="rent-periodo-titulo" x-text="periodoCustom.titulo">Período</h3>
          <div class="rent-periodo-metrica">
            <span class="rent-periodo-label">XIRR a.a.</span>
            <span class="rent-periodo-valor"
                  x-text="periodoCustom.xirr === null ? '—' : formatPct(periodoCustom.xirr)"></span>
          </div>
          <div class="rent-periodo-metrica">
            <span class="rent-periodo-label">TWR a.a.</span>
            <span class="rent-periodo-valor"
                  x-text="periodoCustom.twr === null ? '—' : formatPct(periodoCustom.twr)"></span>
          </div>
          <!-- 7a.E.26: card multi-benchmark. benchExtras: [{nome, deltaXirr,
               deltaTwr}] (deltas = portfólio − benchmark, já computados em JS).
               Total = 3 linhas (CDI/IBOV/S&P 500), Brasil = 2 (CDI/IBOV),
               EUA = 1 (S&P 500). .rent-periodo-bench repetido produz o formato
               3-linhas com border-top entre elas (sem CSS novo). -->
          <template x-for="(b, i) in periodoCustom.benchExtras" :key="i">
            <div class="rent-periodo-bench">
              <span class="bench-label" x-text="'vs ' + b.nome"></span>
              <span class="bench-valor">
                <template x-if="b.deltaXirr !== null">
                  <span x-text="formatPct(b.deltaXirr)"></span>
                </template>
                <template x-if="b.deltaXirr === null">
                  <span>—</span>
                </template>
                <template x-if="b.deltaTwr !== null">
                  <span class="bench-twr"
                        x-text="' · TWR ' + formatPct(b.deltaTwr)"></span>
                </template>
              </span>
            </div>
          </template>
        </section>

        <div class="rent-grupos">
          <!-- 7a.S.6: ordem Ano → 12 meses → Origem (Origem movida para o fim;
               Período, fora deste bloco, continua o 1º card visual). -->
          <section class="rent-grupo">
            <h3 class="rent-grupo-titulo">Ano (YTD)</h3>
            <div class="rent-metrica">
              <span class="rent-metrica-label">XIRR</span>
              <span class="rent-metrica-valor"
                    x-text="formatPct(rentabilidadeAtiva()?.xirr_ytd)"></span>
            </div>
            <div class="rent-metrica">
              <span class="rent-metrica-label">TWR</span>
              <span class="rent-metrica-valor"
                    x-text="formatPct(rentabilidadeAtiva()?.twr_ytd)"></span>
            </div>
            <template x-for="[bkey, bench] in Object.entries(rentabilidadeAtiva()?.benchmarks || {})" :key="bkey">
              <div class="rent-benchmark">
                <span class="bench-label" x-text="'vs ' + (bkey === 'SP500' ? 'S&P 500' : bkey)"></span>
                <span class="bench-valor">
                  <span x-text="formatPct(bench.xirr_espelhado?.ytd)"></span>
                  <span class="bench-twr" x-text="' · TWR ' + formatPct(bench.twr_espelhado?.ytd)"></span>
                </span>
              </div>
            </template>
          </section>
          <section class="rent-grupo">
            <h3 class="rent-grupo-titulo">12 meses</h3>
            <div class="rent-metrica">
              <span class="rent-metrica-label">XIRR a.a.</span>
              <span class="rent-metrica-valor"
                    x-text="formatPct(rentabilidadeAtiva()?.xirr_12m)"></span>
            </div>
            <div class="rent-metrica">
              <span class="rent-metrica-label">TWR a.a.</span>
              <span class="rent-metrica-valor"
                    x-text="formatPct(rentabilidadeAtiva()?.twr_12m)"></span>
            </div>
            <template x-for="[bkey, bench] in Object.entries(rentabilidadeAtiva()?.benchmarks || {})" :key="bkey">
              <div class="rent-benchmark">
                <span class="bench-label" x-text="'vs ' + (bkey === 'SP500' ? 'S&P 500' : bkey)"></span>
                <span class="bench-valor">
                  <span x-text="formatPct(bench.xirr_espelhado?.['12m'])"></span>
                  <span class="bench-twr" x-text="' · TWR ' + formatPct(bench.twr_espelhado?.['12m'])"></span>
                </span>
              </div>
            </template>
          </section>
          <section class="rent-grupo">
            <h3 class="rent-grupo-titulo">Origem</h3>
            <div class="rent-metrica">
              <span class="rent-metrica-label">XIRR a.a.</span>
              <span class="rent-metrica-valor"
                    x-text="formatPct(rentabilidadeAtiva()?.xirr_origem)"></span>
            </div>
            <div class="rent-metrica">
              <span class="rent-metrica-label">TWR a.a.</span>
              <span class="rent-metrica-valor"
                    x-text="formatPct(rentabilidadeAtiva()?.twr_origem)"></span>
            </div>
            <template x-for="[bkey, bench] in Object.entries(rentabilidadeAtiva()?.benchmarks || {})" :key="bkey">
              <div class="rent-benchmark">
                <span class="bench-label" x-text="'vs ' + (bkey === 'SP500' ? 'S&P 500' : bkey)"></span>
                <span class="bench-valor">
                  <span x-text="formatPct(bench.xirr_espelhado?.origem)"></span>
                  <span class="bench-twr" x-text="' · TWR ' + formatPct(bench.twr_espelhado?.origem)"></span>
                </span>
              </div>
            </template>
          </section>
        </div>

        <details class="rent-legenda">
          <summary>Como ler</summary>
          <p><strong>XIRR:</strong> retorno anualizado considerando quando você aportou. Capta o efeito do timing dos aportes.</p>
          <p><strong>TWR:</strong> retorno anualizado ignorando seus aportes. Mede só a qualidade da seleção e gestão.</p>
        </details>
      </section>

      <section class="tela-detalhes tela-alocacao" x-show="rota === 'alocacao'" x-transition:enter.opacity.duration.220ms x-cloak>
        <header class="breadcrumb">
          <h1 class="eyebrow">Alocação</h1>
        </header>

        <p class="politica-intro" x-show="!json || !json.politica || !json.politica.categorias.length">
          Política não publicada ainda.
        </p>

        <div class="compo" x-show="composicaoSegmentos.length" x-cloak>
          <div class="compo-cap">
            <span>Atual</span>
            <span>Alvo</span>
          </div>
          <div class="compo-band" role="group" aria-label="Composição atual da carteira por categoria">
            <template x-for="seg in composicaoSegmentos" :key="seg.nome">
              <button type="button" class="compo-seg"
                      :class="{ dim: compoSegmentoAtivo && compoSegmentoAtivo !== seg.nome }"
                      :style="`${catStyleVar(seg.nome)} width: ${seg.larguraPct}%;`"
                      :aria-label="seg.ariaLabel"
                      @click="tocarSegmentoComposicao(seg.nome)">
                <span class="sl" x-show="seg.labelVisivel" x-text="seg.label"></span>
              </button>
            </template>
          </div>
          <div class="compo-ticks">
            <template x-for="tick in composicaoTicks" :key="tick.nome">
              <div class="compo-tick" :style="`left: ${tick.leftPct}%;`">
                <span class="mk" aria-hidden="true"></span>
                <span class="tv" x-text="tick.label"></span>
              </div>
            </template>
          </div>
          <!-- 7a.S.8 CRB: confirmação não-visual do tap p/ leitor de tela.
               O dim/flash/scroll é puramente visual; esta região aria-live
               narra "{categoria} em destaque" quando um segmento é tocado
               (dispara também sob reduced-motion — é a11y, não motion). -->
          <div class="sr-only" aria-live="polite" x-text="compoAnuncio"></div>
        </div>

        <!-- 7a.S.10 Task 4: grifo cross-screen — deep-link p/ #aportar com o
             preset do último aporte (Apêndice B "Alocação = callout 'abaixo
             do alvo'"). -->
        <div class="grifo aloca-grifo" x-show="alocGrifoHtml" x-cloak
             role="button" tabindex="0"
             @click="irSimularAporteAlvo()"
             @keydown.enter.prevent="irSimularAporteAlvo()"
             @keydown.space.prevent="irSimularAporteAlvo()">
          <div x-html="alocGrifoHtml"></div>
        </div>

        <div class="aloca-lista">
          <template x-for="cat in categoriasAlocacaoOrdenadas" :key="cat.nome">
            <article class="aloca-cat"
                      :id="'aloca-cat-' + cat.nome.replace(/\s+/g, '-')"
                      :class="{ flash: compoCardFlash === cat.nome }"
                      :style="catStyleVar(cat.nome)">
              <button type="button" class="aloca-cat__head"
                      :aria-expanded="!!catAberta[cat.nome]"
                      :aria-controls="'aloca-cat-body-' + cat.nome.replace(/\s+/g, '-')"
                      @click="toggleCategoria(cat.nome)">
                <span class="aloca-cat__dot" aria-hidden="true"></span>
                <span class="aloca-cat__nome" x-text="cat.nome"></span>
                <span class="aloca-cat__rs">
                  <span class="aloca-cat__rs-valor" x-text="formatBrl(valorBrlCategoria(cat))"></span>
                  <span class="aloca-cat__chevron" aria-hidden="true"
                        x-text="catAberta[cat.nome] ? '▾' : '▸'"></span>
                </span>
              </button>

              <div class="aloca-alvo__trilha-cat aloca-cat__trilha">
                <div class="fill"
                     :class="catIsOver(cat) && 'fill--over'"
                     :style="`--fill-pct: ${catFillPct(cat)};`"></div>
                <div class="marker"
                     :style="catIsOver(cat) ? `left: ${markerLeftOver(cat.peso_alvo, cat.peso_atual)};` : 'left: 100%;'"></div>
              </div>
              <div class="aloca-cat__foot">
                <span class="aloca-cat__foot-atual">atual&nbsp;<b x-text="formatPctSemSinal(cat.peso_atual)"></b></span>
                <span class="aloca-cat__foot-alvo">
                  alvo&nbsp;<b x-text="formatPctSemSinal(cat.peso_alvo)"></b> ·
                  <span class="aloca-cat__drift"
                        :class="{
                          'aloca-cat__drift--under': formatDelta(cat.drift).classe === 'under',
                          'aloca-cat__drift--over':  formatDelta(cat.drift).classe === 'over',
                          'aloca-cat__drift--hold':  formatDelta(cat.drift).classe === 'hold'
                        }">
                    <span x-text="formatDelta(cat.drift).arrow"></span>&nbsp;<span x-text="formatDelta(cat.drift).texto"></span>
                  </span>
                </span>
              </div>

              <div class="aloca-cat__body" x-show="catAberta[cat.nome]" x-cloak
                   :id="'aloca-cat-body-' + cat.nome.replace(/\s+/g, '-')" role="region">
                <template x-for="bucket in (cat.buckets || [])" :key="bucket.tipo">
                  <section class="aloca-alvo__cesta">
                    <div class="aloca-alvo__cesta-head">
                      <div>
                        <div class="aloca-alvo__clabel" x-text="labelCestaTipo(bucket.tipo)"></div>
                        <div class="aloca-alvo__cmeta"
                             x-text="bucket.tipo === 'passive'
                                     ? 'peso fixo intra-categoria'
                                     : (bucket.ativos.length + ' ativos · equal-weight')"></div>
                      </div>
                      <div class="aloca-alvo__cnum">
                        <span x-text="formatPctSemSinal(bucket.peso_atual_bucket).replace(/\s*%$/, '')"></span>
                        <span class="of">&nbsp;de&nbsp;</span>
                        <span x-text="formatPctSemSinal(bucket.peso_bucket)"></span>
                      </div>
                    </div>

                    <div class="aloca-alvo__cesta-trilha">
                      <div class="fill"
                           :class="cestaIsOver(bucket) && 'fill--over'"
                           :style="`--fill-pct: ${cestaFillPct(bucket)};`"></div>
                      <div class="marker"
                           :style="cestaIsOver(bucket) ? `left: ${markerLeftOver(bucket.peso_bucket, bucket.peso_atual_bucket)};` : 'left: 100%;'"></div>
                    </div>

                    <div class="aloca-alvo__ativos">
                      <template x-for="ativo in bucket.ativos" :key="ativo.ticker">
                        <a :href="'#ativo/' + ativo.ticker" class="aloca-alvo__ativo"
                           :class="{
                             'aloca-alvo__ativo--quarentena': ativo.quarentena,
                             'aloca-alvo__ativo--fora': ativo.fora_do_alvo
                           }">
                          <span class="flag" aria-hidden="true" x-text="ativo.bandeira"></span>
                          <div class="aloca-alvo__ativo-body">
                            <div class="aloca-alvo__ativo-row1">
                              <span class="aloca-alvo__ticker" x-text="ativo.ticker"></span>
                              <span class="aloca-alvo__ativo-sub" x-show="!ativo.quarentena && !ativo.fora_do_alvo">
                                <span x-text="formatPctSemSinal(ativo.peso_intra_atual)"></span>
                                <span>&nbsp;de&nbsp;</span>
                                <span x-text="formatPctSemSinal(ativo.peso_intra)"></span>
                                <span>&nbsp;na cesta</span>
                              </span>
                              <span class="aloca-alvo__ativo-sub" x-show="ativo.quarentena" x-cloak>
                                <span x-text="formatPctSemSinal(ativo.peso_intra_atual)"></span>
                                <span>&nbsp;na cesta · alvo 0%</span>
                              </span>
                              <span class="aloca-alvo__ativo-sub aloca-alvo__ativo-sub--fora" x-show="ativo.fora_do_alvo && !ativo.quarentena" x-cloak>
                                a zerar · sem alvo
                              </span>
                            </div>
                            <div class="aloca-alvo__minibar" x-show="!ativo.quarentena && !ativo.fora_do_alvo">
                              <div class="fill"
                                   :class="ativoIsOver(ativo) && 'fill--over'"
                                   :style="`--fill-pct: ${ativoFillPct(ativo)};`"></div>
                              <div class="marker"
                                   :style="ativoIsOver(ativo) ? `left: ${markerLeftOver(ativo.peso_intra, ativo.peso_intra_atual)};` : 'left: 100%;'"></div>
                            </div>
                          </div>
                          <div class="aloca-alvo__ativo-right">
                            <span class="aloca-alvo__valor-ativo" x-text="formatBrl(valorBrlAtivo(ativo))"></span>
                            <span class="aloca-alvo__delta" x-show="!ativo.quarentena && !ativo.fora_do_alvo"
                                  :class="{
                                    'aloca-alvo__delta--under': formatDelta(ativo.drift_intra).classe === 'under',
                                    'aloca-alvo__delta--over':  formatDelta(ativo.drift_intra).classe === 'over',
                                    'aloca-alvo__delta--hold':  formatDelta(ativo.drift_intra).classe === 'hold'
                                  }">
                              <span class="arrow" x-text="formatDelta(ativo.drift_intra).arrow"></span>
                              <span x-text="formatDelta(ativo.drift_intra).texto"></span>
                            </span>
                            <span class="aloca-alvo__selo-quar" x-show="ativo.quarentena" x-cloak
                                  aria-label="Em quarentena: restrito a investidor qualificado, fora do aporte">
                              <span class="aloca-alvo__selo-quar-tag">Quarentena</span>
                              <span class="aloca-alvo__selo-quar-sub">investidor qualificado</span>
                            </span>
                            <span class="aloca-alvo__selo-fora" x-show="ativo.fora_do_alvo && !ativo.quarentena" x-cloak
                                  aria-label="Fora do alvo: posição a zerar, sem alvo na política">
                              <span class="aloca-alvo__selo-fora-tag">fora do alvo</span>
                            </span>
                          </div>
                        </a>
                      </template>
                    </div>
                  </section>
                </template>
              </div>
            </article>
          </template>
        </div>
      </section>

      <section class="tela-detalhes tela-ativo" x-show="rota === 'ativo'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent" x-text="tickerAtual"></h1>
        </header>

        <template x-if="!posicaoAtual">
          <div class="erro-nao-encontrado">
            <p>Ativo <strong x-text="tickerAtual"></strong> não encontrado na carteira.</p>
            <a href="#alocacao">← Voltar para Alocação</a>
          </div>
        </template>

        <template x-if="posicaoAtual">
          <div class="ativo-corpo">
            <div class="ticker-hero">
              <h2>
                <span class="flag" aria-hidden="true" x-text="bandeiraDaPosicao(posicaoAtual)"></span>
                <span x-text="posicaoAtual.ticker"></span>
              </h2>
              <p class="ticker-classe" x-text="posicaoAtual.classe"></p>
              <p class="ticker-vm-grande" x-text="formatBrl(posicaoAtual.valor_mercado_brl)"></p>
            </div>

            <div class="kpi-grid">
              <div class="kpi">
                <span class="kpi-label">Quantidade</span>
                <span class="kpi-valor" x-text="formatQtyR7d(posicaoAtual.quantidade)"></span>
              </div>
              <div class="kpi">
                <span class="kpi-label">Custo médio</span>
                <span class="kpi-valor" x-text="formatBrl(posicaoAtual.custo_medio)"></span>
              </div>
              <div class="kpi">
                <span class="kpi-label">Último preço</span>
                <span class="kpi-valor" x-text="formatBrl(posicaoAtual.ultimo_preco)"></span>
              </div>
              <div class="kpi">
                <span class="kpi-label">Ganho / perda</span>
                <span
                  class="kpi-valor"
                  :class="(posicaoAtual.ganho_perda_brl ?? 0) < 0 && 'is-neg'"
                  x-text="formatBrl(posicaoAtual.ganho_perda_brl)"></span>
              </div>
              <div class="kpi">
                <span class="kpi-label">Ganho %</span>
                <span
                  class="kpi-valor"
                  :class="(posicaoAtual.ganho_perda_pct ?? 0) < 0 && 'is-neg'"
                  x-text="formatPct(posicaoAtual.ganho_perda_pct)"></span>
              </div>
              <div class="kpi">
                <span class="kpi-label">XIRR</span>
                <span class="kpi-valor" x-text="formatPct(posicaoAtual.xirr_aa)"></span>
              </div>
            </div>

            <h3 class="ativo-section-h">Movimentos · últimos 12 meses</h3>
            <template x-if="(posicaoAtual.movimentos || []).length === 0">
              <p class="vazio">Nenhum movimento registrado.</p>
            </template>
            <template x-if="(posicaoAtual.movimentos || []).length > 0">
              <div class="tabela-wrap">
                <table class="tabela-movimentos">
                  <thead>
                    <tr><th scope="col">Data</th><th scope="col">Lado</th><th scope="col">Qty</th><th scope="col">Preço</th><th scope="col">Total</th></tr>
                  </thead>
                  <tbody>
                    <template
                      x-for="(m, idx) in posicaoAtual.movimentos"
                      :key="m.data + '-' + m.lado + '-' + idx">
                      <tr>
                        <td x-text="m.data"></td>
                        <td>
                          <span
                            class="lado-pill"
                            :class="formatarLado(m.lado).classe"
                            :title="m.lado"
                            x-text="formatarLado(m.lado).texto"></span>
                        </td>
                        <td class="num" x-text="formatQtyR7d(m.quantidade)"></td>
                        <td class="num" x-text="formatBrl(m.preco_unitario)"></td>
                        <td class="num" x-text="formatBrl(m.total_brl)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>

            <h3 class="ativo-section-h">Proventos · últimos 12 meses</h3>
            <template x-if="(posicaoAtual.proventos || []).length === 0">
              <p class="vazio">Nenhum provento registrado.</p>
            </template>
            <template x-if="(posicaoAtual.proventos || []).length > 0">
              <div class="tabela-wrap">
                <table class="tabela-proventos">
                  <thead>
                    <tr><th scope="col">Data</th><th scope="col">Valor</th><th scope="col">Tipo</th></tr>
                  </thead>
                  <tbody>
                    <template
                      x-for="(pr, idx) in posicaoAtual.proventos"
                      :key="pr.data_pagamento + '-' + idx">
                      <tr>
                        <td x-text="pr.data_pagamento"></td>
                        <td class="num" x-text="formatBrl(pr.valor_liquido_brl)"></td>
                        <td x-text="pr.tipo"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
          </div>
        </template>
      </section>

      <!-- ── Tela #proventos ──────────────────────────────────────────── -->
      <section class="tela-detalhes tela-proventos" x-show="rota === 'proventos'" x-transition:enter.opacity.duration.220ms x-cloak>
        <header class="breadcrumb">
          <h1 class="eyebrow">Proventos</h1>
        </header>

        <!-- 7a.S.7b Task 4: affordance de rolagem horizontal — o 3º KPI
             cortava a 320px (spec 7a.S §9, Fable). Substitui o wrap-to-1-col
             de 7a.G.2 finding #3: os 3 cards seguem lado a lado, alcançáveis
             por scroll, com edge-fade sinalizando que há mais conteúdo. -->
        <div class="kpi-scrollwrap">
          <div class="kpi-grid kpi-grid-3" tabindex="0" role="group" aria-label="Indicadores de proventos, role para o lado para ver todos">
            <div class="kpi">
              <span class="kpi-label">YTD <span x-text="anoCorrente"></span></span>
              <span class="kpi-valor" x-text="formatBrl(json?.proventos?.ytd_brl)"></span>
            </div>
            <div class="kpi">
              <span class="kpi-label"><span x-text="anoAnterior"></span></span>
              <span class="kpi-valor" x-text="formatBrl(json?.proventos?.ano_anterior_brl)"></span>
            </div>
            <div class="kpi">
              <span class="kpi-label">Total Origem</span>
              <span class="kpi-valor" x-text="formatBrl(totalProventosOrigem)"></span>
            </div>
          </div>
          <span class="kpi-scroll-fade" aria-hidden="true"></span>
        </div>

        <div class="escopo-toggle" role="tablist" aria-label="Período">
          <button
            type="button"
            role="tab"
            :aria-selected="proventosToggle === 'origem'"
            :class="{ active: proventosToggle === 'origem' }"
            @click="setProventosToggle('origem')">Origem</button>
          <button
            type="button"
            role="tab"
            :aria-selected="proventosToggle === 'mensal'"
            :class="{ active: proventosToggle === 'mensal' }"
            @click="setProventosToggle('mensal')">Mensal (12m)</button>
        </div>

        <!-- 7a.S.7b: card do chart ganha a linha-razão do total no topo —
             substitui o poster de total removido; = soma exata das barras
             exibidas, troca de rótulo/valor com o toggle Anual/Mensal
             (computado em renderProventosGrafico, nunca um agregado
             independente do gráfico). -->
        <div class="prov-chart-card">
          <div class="prov-total" id="prov-total" aria-live="polite">
            <span class="pt-lbl" x-text="proventosTotalLabel"></span>
            <span class="pt-val" x-text="formatBrl(proventosTotalValor)"></span>
          </div>
          <div id="proventos-grafico" class="chart-rent" aria-label="Evolução de proventos"></div>
        </div>

        <!-- 7a.S.3 Task 3: nota "em curso" — honestidade de dado da última barra
             (ano/mês corrente, ainda acumulando). Texto montado em JS por
             renderProventosGrafico (depende do ano/mês do último bucket). -->
        <p class="chart-partial-note" id="proventosNotaParcial" aria-live="polite"></p>

        <!-- 7a.E.18: hint quando há mês selecionado -->
        <div class="proventos-hint-limpar" id="proventosHintLimpar" hidden>
          Toque na mesma barra ou pressione Esc para limpar
        </div>

        <!-- 7a.E.18: lista a11y visualmente oculta com 12 botões focáveis -->
        <ul class="proventos-meses-a11y" id="proventosMesesA11y" role="list" aria-label="Meses dos últimos 12 meses"></ul>

        <!-- 7a.S.7b: DY virou chamada (idioma do .rel-card-home) → push #s-dy -->
        <a class="dy-chamada" data-testid="dy-chamada" href="#/proventos/dy"
           x-show="json?.dividend_yield"
           aria-label="Ver detalhe do Dividend Yield da carteira">
          <span class="dy-chamada__meta">

            <span class="dy-chamada__valor" x-text="formatPctSemSinal(json?.dividend_yield?.total?.dy, 1)"></span>
            <span class="dy-chamada__desc">Carteira · 12 meses — ver detalhe</span>
          </span>
          <span class="dy-chamada__chevron" aria-hidden="true">›</span>
        </a>

        <h3 class="ativo-section-h" :class="{ filtrada: proventosToggle === 'mensal' && proventosMesSelecionado !== null }">
          <template x-if="proventosToggle === 'mensal' && proventosMesSelecionado !== null">
            <span>Por ativo · <strong x-text="proventosMesLabel()"></strong></span>
          </template>
          <template x-if="!(proventosToggle === 'mensal' && proventosMesSelecionado !== null)">
            <span>Por ativo · <span x-text="proventosToggle === 'mensal' ? 'últimos 12 meses' : 'desde a Origem'"></span></span>
          </template>
        </h3>
        <template x-if="tabelaProventosAtual().length === 0">
          <p class="vazio">Nenhum dado disponível.</p>
        </template>
        <template x-if="tabelaProventosAtual().length > 0">

                  <th scope="col" class="num">Total</th>
                </tr>
              </thead>

                  <tr
                    class="row-link"
                    tabindex="0"
                    role="link"
                    :aria-label="'Ver ativo ' + item.ticker + (item.tipo === 'Aluguel' ? ' (aluguel)' : '')"
                    @click="location.hash = 'ativo/' + item.ticker"
                    @keydown.enter="location.hash = 'ativo/' + item.ticker"
                    @keydown.space.prevent="location.hash = 'ativo/' + item.ticker">
                    <td>
                      <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                      <span x-text="item.ticker"></span>

                    <td class="num" x-text="formatBrl(item.total)"></td>

                </template>
              </tbody>
            </table>
          </div>
        </template>
      </section>

                <span class="y" x-text="formatPctSemSinal(p.dy, 1)"></span>

              </div>

        </div>

        <p class="footnote-dy">DY trailing 12m ÷ valor de mercado · <code>investimentos.db</code></p>
      </section>

      <!-- ── Tela #patrimonio ─────────────────────────────────────────── -->
      <section class="tela-detalhes tela-patrimonio" x-show="rota === 'patrimonio'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent">Histórico patrimonial</h1>
        </header>

        <div class="kpi-grid kpi-stack">
          <div class="kpi">
            <span class="kpi-label">Patrimônio atual</span>
            <span class="kpi-valor" x-text="formatBrl(patrimonioAtual())"></span>
            <span class="kpi-descricao">Valor de mercado consolidado da carteira (Brasil + EUA) na data mais recente.</span>
          </div>
          <div class="kpi">
            <span class="kpi-label">Aporte cumulativo</span>
            <span class="kpi-valor" x-text="formatBrl(aporteCumulativo())"></span>
            <span class="kpi-descricao">Soma de todos os aportes desde a Origem (compras de ativos em R$, FX-aplicado para EUA).</span>
          </div>
          <div class="kpi">
            <span class="kpi-label">Retorno acumulado</span>
            <span class="kpi-valor" x-text="formatBrl(retornoAcumuladoBrl())"></span>
            <span class="kpi-meta" x-text="retornoAcumuladoPctTexto()"></span>
            <span class="kpi-descricao">Diferença entre patrimônio atual e aporte cumulativo. Mede ganho ou perda total da carteira.</span>
          </div>
        </div>

        <div id="patrimonio-grafico" class="chart-rent" aria-label="Evolução de patrimônio e aportes"></div>
      </section>

      <!-- ── Tela #aportar (Fase 7a.H.1) ──────────────────────────────── -->
      <section class="tela-detalhes tela-aportar" x-show="rota === 'aportar'" x-transition:enter.opacity.duration.220ms x-cloak>
        <header class="breadcrumb">
          <h1 class="eyebrow">Próximo aporte</h1>
        </header>

        <div class="aporte-input-block">
          <label for="aporte-valor" class="aporte-label">Valor disponível</label>
          <input
            id="aporte-valor"
            type="text"
            inputmode="decimal"
            class="aporte-input"
            placeholder="R$ 0,00"
            x-model="aporteValor"
            @input.debounce.150ms="recalcularAporte()"
            autocomplete="off">
          <p class="aporte-helper" x-text="aporteHelperText()"></p>
          <p class="aporte-cap" x-html="aporteApcapHtml()"></p>
        </div>

        <!-- 7a.S.10: chips rápidos (Repetir/último aporte + atalhos) ────── -->
        <div class="aporte-chips">
          <button type="button" class="aporte-chip aporte-chip--hero"
                  x-show="json && json.ultimo_aporte && json.ultimo_aporte.total_brl" x-cloak
                  @click="aporteSetValor(json.ultimo_aporte.total_brl, true)"
                  x-text="'Repetir · ' + aporteFmtBrl0(json && json.ultimo_aporte ? json.ultimo_aporte.total_brl : 0)"></button>
          <button type="button" class="aporte-chip aporte-chip--add5k" @click="aporteAdd(5000)">+ 5.000</button>
          <button type="button" class="aporte-chip aporte-chip--add10k" @click="aporteAdd(10000)">+ 10.000</button>
          <button type="button" class="aporte-chip aporte-chip--zero" @click="aporteSetValor(0, true)">zerar</button>
        </div>

        <!-- 7a.S.10: scrubber "e se fosse mais?" (0–20.000, passo 100) ──── -->
        <div class="aporte-scrub-wrap">
          <div class="aporte-scrub-lbl">
            <span>E se fosse mais?</span>
            <span x-text="'R$ 0 — ' + aporteFmtBrl0(aporteScrubMax)"></span>
          </div>
          <div class="aporte-scrub">
            <div class="aporte-scrub-fill" :style="`width: ${aporteScrubPct()}%`"></div>
            <div class="aporte-scrub-knob" :style="`left: ${aporteScrubPct()}%`"></div>
            <input type="range" class="aporte-scrub-input"
                   min="0" :max="aporteScrubMax" step="100"
                   :value="Math.min(_parseAporteValor(aporteValor), aporteScrubMax)"
                   @input="aporteSetValor($event.target.valueAsNumber, false)"
                   aria-label="Arrastar para escolher o valor do aporte"
                   aria-valuemin="0" :aria-valuemax="aporteScrubMax"
                   :aria-valuenow="Math.min(_parseAporteValor(aporteValor), aporteScrubMax)">
          </div>
        </div>

        <p class="aporte-nota">
          O plano prioriza as categorias abaixo do alvo, equal-weight nos picks — zero sobra.
          <span class="writes">Simulação pura: nada é enviado, nada é gravado.</span>
        </p>

        <div class="aporte-banner" x-show="aporteBanner" x-cloak>
          <p x-text="aporteBanner"></p>
        </div>

        <template x-for="cat in aporteCategoriasRecebedoras" :key="cat.nome">
          <article class="card aporte-card" :data-cat-nome="cat.nome">
            <header class="aporte-cat-head">
              <span class="aporte-cat-name" x-text="cat.nome"></span>
              <span class="aporte-cat-tag" x-text="aporteCatTagTexto(cat)"></span>
            </header>
            <div class="aloc-trilha aporte-trilha">
              <div class="aloc-preenchimento"
                   :style="`width: ${Math.min(Math.max(cat.atualPct, 0), 100)}%; background: var(--g-700)`"></div>
              <div class="aporte-trilha-delta"
                   :style="`left: ${Math.min(Math.max(cat.atualPct, 0), 100)}%; width: ${Math.min(cat.deltaPct, 100 - cat.atualPct)}%`"></div>
              <div class="aloc-alvo"
                   x-show="cat.alvoPct > 0"
                   :style="`left: ${Math.min(Math.max(cat.alvoPct, 0), 100)}%`"></div>
            </div>
            <p class="aporte-trilha-line">
              <span x-text="`${cat.atualPct.toFixed(1).replace('.', ',')}% → ${cat.posPct.toFixed(1).replace('.', ',')}%`"></span>
              <span x-text="`alvo ${cat.alvoPct}% · fecha ${cat.deltaPct.toFixed(1).replace('.', ',')}pp`"></span>
            </p>
            <ul class="aporte-compras">
              <template x-for="row in cat.compras" :key="row.ticker">
                <li class="aporte-compra-row">
                  <span class="flag" :aria-label="row.bandeiraLabel" x-text="row.bandeira"></span>
                  <span class="aporte-compra-main">
                    <span class="aporte-compra-tk" x-text="row.ticker"></span>
                    <span class="aporte-compra-sub" x-text="`${row.tipoLabel} · ${row.pesoIntraPct}% do bucket`"></span>
                  </span>
                  <span class="aporte-compra-qty-block">
                    <!-- 7a.S.10: sem x-text — dono exclusivo do textContent é
                         _aporteAnimarPlano (count-up via applyCountUp). Um
                         x-text reativo aqui disputaria com o RAF (mesmo
                         racional do #hero-patrimonio, ver ativarCountUpHero).
                         data-cotas/-frac carregam o valor final pro JS ler. -->
                    <span class="aporte-compra-qty"
                          :data-cotas="row.cotas"
                          :data-cotas-frac="row.cotasFormatadas.includes(',') ? 1 : 0"></span>
                    <span class="aporte-compra-qty-sub" x-text="row.valorFormatado"></span>
                  </span>
                </li>
              </template>
            </ul>
          </article>
        </template>

        <div class="grifo aporte-grifo" x-show="aporteGrifoHtml()" x-cloak x-html="aporteGrifoHtml()"></div>

        <section class="aporte-outras" x-show="aporteCategoriasNaoRecebedoras.length > 0" x-cloak>
          <h2 class="aporte-section-label">Outras categorias (sem aporte)</h2>
          <template x-for="cat in aporteCategoriasNaoRecebedoras" :key="cat.nome">
            <p class="aporte-outras-row">
              <span x-text="`▸ ${cat.nome}`"></span>
              <span x-text="`${cat.atualPct.toFixed(1).replace('.', ',')}% · alvo ${cat.alvoPct}% (${cat.label})`"></span>
            </p>
          </template>
        </section>

        <section class="aporte-pausados" x-show="aportePausados.length > 0" x-cloak>
          <p>
            <strong>Acima do alvo (não aporta)</strong><br>
            <template x-for="(ticker, i) in aportePausados" :key="ticker">
              <span>
                <span class="aporte-pausados-tk" x-text="ticker"></span>
                <span x-show="i < aportePausados.length - 1"> · </span>
              </span>
            </template>
          </p>
        </section>

        <p class="aporte-sem-posicao" x-show="aporteTickersSemPosicao.length > 0" x-cloak>
          <span>Tickers da política sem posição vigente (sem cotação para incluir no cálculo): </span>
          <span x-text="aporteTickersSemPosicao.join(', ')"></span>
        </p>
      </section>

      <!-- ── Tela #relatorio (Fase 7a.Q.3) ──────────────────────────────── -->
      <section class="tela-detalhes tela-relatorio" x-show="rota === 'relatorio'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        x-cloak>
        <header class="breadcrumb rel-breadcrumb">
          <button @click="voltarDoRelatorio()" aria-label="Voltar ao Raio-X" type="button">←</button>
          <h1 class="eyebrow eyebrow--accent">Relatório</h1>
          <div class="rel-seletor" @keydown.escape="relSeletorAberto = false">
            <button class="rel-seletor__btn" type="button"
              :aria-expanded="relSeletorAberto"
              @click="relSeletorAberto = !relSeletorAberto">
              <span x-text="relMes ? formatMesAno(relMes.mes) : 'Meses'"></span>
              <span aria-hidden="true">▾</span>
            </button>
            <ul class="rel-seletor__lista" x-show="relSeletorAberto" x-cloak
              @click.outside="relSeletorAberto = false">
              <template x-for="m in (relIndice?.meses || [])" :key="m.mes">
                <li>
                  <button class="rel-seletor__item" type="button"
                    :class="m.mes === relMesAtual ? 'is-atual' : ''"
                    @click="selecionarMesRelatorio(m.mes)">
                    <span x-text="formatMesAno(m.mes)"></span>
                    <!-- 7a.S.9 Task 2: evento mensal — ponto "não lido" por mês. -->
                    <span class="rel-dot" x-show="!mesLido(m.mes)" aria-hidden="true" x-cloak></span>
                    <span class="sr-only" x-show="!mesLido(m.mes)" x-cloak>não lido</span>
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </header>

        <!-- 7a.S.9 Task 1: capa editorial — mês em poster + veredito derivado
             do artefato (NUNCA fabricado: 1ª frase da seção "leitura_mes"). -->
        <div class="rel-capa" x-show="relMes && !relCarregando && !relErro" x-cloak>
          <div class="rel-poster">
            <span x-text="relPosterMes"></span><br>
            <span x-text="relPosterAno"></span>
          </div>
          <p class="rel-veredito-linha" x-show="relVeredito" x-cloak>
            <b>Veredito do mês:</b> <span x-text="relVeredito"></span>
          </p>
        </div>

        <div class="rel-loading" x-show="relCarregando" x-cloak aria-live="polite">
          <div class="rel-skeleton"></div>
          <div class="rel-skeleton"></div>
          <div class="rel-skeleton rel-skeleton--short"></div>
        </div>

        <div class="rel-erro" x-show="!relCarregando && relErro" x-cloak>
          <p x-text="relErro"></p>
          <button class="rel-erro__voltar" type="button" x-show="relUltimoMes"
            @click="selecionarMesRelatorio(relUltimoMes.mes)">Voltar ao último mês</button>
        </div>

        <div class="rel-vazio" x-show="!relCarregando && !relErro && !relMes" x-cloak>
          <p>Ainda não há relatórios publicados.</p>
        </div>

        <template x-if="relMes && !relCarregando && !relErro">
          <div class="rel-corpo">
            <template x-for="sec in (relMes.secoes || [])" :key="sec.id">
              <section class="rel-secao" :class="classeSecao(sec.id)" :data-secao="sec.id">
                <h2 class="rel-secao__titulo" x-text="sec.titulo"></h2>
                <div class="rel-prosa" x-html="prosaParaHtml(sec.corpo, relMes.citacoes)"></div>
                <!-- enriquecimentos por id -->
                <template x-if="sec.id === 'radar'">
                  <ul class="rel-radar">
                    <template x-for="r in radarFiltrado(false)" :key="r.ticker">
                      <li class="rel-radar-card">
                        <div class="rel-radar-card__head">
                          <span class="rel-radar-card__ticker" x-text="r.ticker"></span>
                          <span class="rel-selo" :class="vereditoSelo(r.veredito).classe">
                            <span class="rel-selo__marca" aria-hidden="true"
                              x-text="vereditoSelo(r.veredito).marca"></span>
                            <span x-text="vereditoSelo(r.veredito).label"></span>
                          </span>
                        </div>
                        <p class="rel-radar-card__obs"><span>Observar:</span> <span x-text="r.observar"></span></p>
                        <p class="rel-radar-card__gat"><span>Gatilho:</span> <span x-text="r.gatilho"></span></p>
                      </li>
                    </template>
                  </ul>
                </template>
                <template x-if="sec.id === 'nao_funcionando'">
                  <div class="rel-veredito" x-show="radarFiltrado(true).length > 0">
                    <template x-for="r in radarFiltrado(true)" :key="'sel-' + r.ticker">
                      <span class="rel-selo" :class="vereditoSelo(r.veredito).classe">
                        <span class="rel-selo__marca" aria-hidden="true"
                          x-text="vereditoSelo(r.veredito).marca"></span>
                        <span x-text="r.ticker + ' · ' + vereditoSelo(r.veredito).label"></span>
                      </span>
                    </template>
                  </div>
                </template>
                <template x-if="sec.id === 'como_voce_foi'">
                  <div class="rel-kpis">
                    <div class="kpi">
                      <span class="kpi-label">Retorno do mês</span>
                      <span class="kpi-valor" x-text="formatPct(relMes.dossie?.performance?.Total?.retorno_mes_pct)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">CDI</span>
                      <span class="kpi-valor" x-text="formatPct(relMes.dossie?.performance?.Total?.benchmarks?.CDI)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">IBOV</span>
                      <span class="kpi-valor" x-text="formatPct(relMes.dossie?.performance?.Total?.benchmarks?.IBOV)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">S&amp;P 500</span>
                      <span class="kpi-valor" x-text="formatPct(relMes.dossie?.performance?.Total?.benchmarks?.SP500)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">Aportes líq.</span>
                      <span class="kpi-valor" x-text="formatBrl(relMes.dossie?.decomposicao?.Total?.aportes_liq_brl)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">Proventos</span>
                      <span class="kpi-valor" x-text="formatBrl(relMes.dossie?.decomposicao?.Total?.proventos_brl)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">Mercado</span>
                      <span class="kpi-valor" :class="(relMes.dossie?.decomposicao?.Total?.mercado_brl ?? 0) < 0 ? 'is-neg' : ''"
                        x-text="formatBrl(relMes.dossie?.decomposicao?.Total?.mercado_brl)"></span>
                    </div>
                  </div>
                </template>
                <template x-if="sec.id === 'renda'">
                  <div class="rel-kpis">
                    <div class="kpi">
                      <span class="kpi-label">Proventos do mês</span>
                      <span class="kpi-valor" x-text="formatBrl(relMes.dossie?.renda?.proventos_mes_brl)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">Proventos 12m</span>
                      <span class="kpi-valor" x-text="formatBrl(relMes.dossie?.renda?.proventos_12m_brl)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">DY carteira</span>
                      <span class="kpi-valor" x-text="formatPct(relMes.dossie?.renda?.dy_trailing?.total?.dy)"></span>
                    </div>
                    <div class="kpi">
                      <span class="kpi-label">Run-rate anual</span>
                      <span class="kpi-valor" x-text="formatBrl(relMes.dossie?.renda?.run_rate_mes_anualizado_brl)"></span>
                    </div>
                  </div>
                </template>
                <template x-if="sec.id === 'alinhamento'">
                  <ul class="rel-concentracao">
                    <template x-for="c in (relMes.dossie?.alinhamento?.concentracao_top || [])" :key="c.ticker">
                      <li>
                        <span class="flag" aria-hidden="true" x-text="c.bandeira"></span>
                        <span class="rel-conc__ticker" x-text="c.ticker"></span>
                        <span class="rel-conc__peso" x-text="formatPct(c.peso)"></span>
                        <span class="rel-conc__valor" x-text="formatBrl(c.valor_brl)"></span>
                      </li>
                    </template>
                  </ul>
                </template>
                <template x-if="sec.id === 'prestacao_contas'">
                  <ul class="rel-prestacao" x-show="(relMes.prestacao_contas || []).length > 0">
                    <template x-for="p in (relMes.prestacao_contas || [])" :key="'pc-' + p.ticker">
                      <li>
                        <span class="rel-prestacao__ticker" x-text="p.ticker"></span>
                        <span class="rel-prestacao__sin" x-text="p.sinalizado"></span>
                        <span class="rel-prestacao__res" x-text="p.resultado"></span>
                      </li>
                    </template>
                  </ul>
                </template>
                <template x-if="sec.id === 'evidencias'">
                  <ol class="rel-evidencias" id="rel-evidencias">
                    <template x-for="c in (relMes.citacoes || [])" :key="'cit-' + c.id">
                      <li :value="c.id">
                        <a class="rel-cit" :href="c.url" target="_blank" rel="noopener" x-text="c.afirmacao"></a>
                        <span class="rel-evid__fonte" x-text="' — ' + c.fonte"></span>
                        <span class="rel-evid__incerto" x-show="c.confianca === 'baixa'"> · <em>sinal incerto</em></span>
                      </li>
                    </template>
                  </ol>
                </template>
              </section>
            </template>
          </div>
        </template>
      </section>

      </div>
    </template>

    <template x-if="fase === 'raiox'">
      <nav class="tab-bar" role="navigation" aria-label="Navegação principal">
        <span class="tab-bar-indicator" aria-hidden="true"></span>
        <a href="#" data-tab="raiox" :aria-current="tab === 'raiox' ? 'page' : null" @click.prevent="rota = ''; tab = 'raiox'; history.replaceState(null, '', location.pathname); $nextTick(() => iniciarAbertura())">Raio-X</a>
        <a href="#rentabilidade" data-tab="rentab" :aria-current="tab === 'rentab' ? 'page' : null">Rentabilidade</a>
        <a href="#alocacao" data-tab="aloca" :aria-current="tab === 'aloca' ? 'page' : null">Alocação</a>
        <a href="#proventos" data-tab="provent" :aria-current="tab === 'provent' ? 'page' : null">Proventos</a>
        <a href="#aportar" data-tab="aportar" :aria-current="tab === 'aportar' ? 'page' : null">Aportar</a>
      </nav>
    </template>
  </main>
</body>
</html>
