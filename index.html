<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#064e3b">
  <title>Carteira Arthur</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="css/app.css?v=35">
  <script src="js/vendor/echarts.min.js?v=35"></script>
  <script src="js/echarts-theme.js?v=35"></script>
  <script src="js/crypto.js?v=35"></script>
  <script src="js/format.js?v=35"></script>
  <script src="js/transitions.js?v=35"></script>
  <script src="js/aportar.js?v=35"></script>
  <script src="js/app.js?v=35"></script>
  <script defer src="js/vendor/alpine.min.js?v=35"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch((err) => {
          console.warn("SW register falhou:", err);
        });
      });
    }
  </script>
</head>
<body x-data="app" x-cloak>
  <div
    class="toast"
    :class="toast.tom ? ('toast-' + toast.tom) : ''"
    x-show="toast.visible"
    x-transition.opacity
    role="status"
    aria-live="polite"
    x-text="toast.mensagem"></div>
  <main>
    <template x-if="fase === 'pin'">
      <section class="pin-screen" :class="{ 'is-shaking': shake }">
        <h1>Carteira</h1>
        <label for="pin-input" class="subtitle" x-show="!estaBloqueado">Digite o PIN para visualizar</label>
        <p class="subtitle pin-block-msg" x-show="estaBloqueado"
           x-text="'Muitas tentativas. Aguarde ' + bloqueioRestanteMin + ' min'"></p>
        <form @submit.prevent="submitPin">
          <input
            id="pin-input"
            type="tel"
            inputmode="numeric"
            pattern="\d{6}"
            maxlength="6"
            autocomplete="off"
            x-model="pin"
            :disabled="carregando || estaBloqueado"
            placeholder="••••••"
            class="pin-input"
            autofocus>
          <button type="submit"
            :disabled="carregando || estaBloqueado || pin.length !== 6"
            class="pin-submit">
            <span x-show="!carregando && !estaBloqueado">Entrar</span>
            <span x-show="carregando">Decifrando…</span>
            <span x-show="!carregando && estaBloqueado"
              x-text="'Aguarde ' + bloqueioRestanteMin + ' min'"></span>
          </button>
          <p class="pin-error" x-show="pinError && !estaBloqueado" x-text="pinError"></p>
        </form>
      </section>
    </template>

    <template x-if="fase === 'raiox'">
      <div>
      <section class="raiox" x-show="rota === ''" x-transition:enter.opacity.duration.220ms x-cloak>
        <h1>Raio X</h1>

        <a href="#/raiox/chart" class="hero hero-link" aria-label="Abrir histórico patrimonial">
          <div class="hero-meta">
            <p class="hero-label">Patrimônio total</p>
            <p class="hero-updated" x-text="formatDataHora(json.atualizado_em)"></p>
          </div>
          <p class="hero-valor"
             id="hero-patrimonio"
             x-init="ativarCountUpHero()"></p>
          <div
            class="hero-delta"
            :class="json.patrimonio.variacao_semanal_brl >= 0 ? 'is-positive' : 'is-negative'"
            x-show="json.patrimonio.variacao_semanal_brl !== null && json.patrimonio.variacao_semanal_brl !== undefined">
            <span class="seta" x-text="json.patrimonio.variacao_semanal_brl >= 0 ? '▲' : '▼'"></span>
            <span x-text="formatBrl(json.patrimonio.variacao_semanal_brl)"></span>
            <span x-text="'(' + formatPct(json.patrimonio.variacao_semanal_pct) + ')'"></span>
            <span class="texto">· 7d</span>
          </div>
        </a>

        <section
          class="raiox-7d"
          aria-label="Últimos 7 dias"
          x-show="ultimos7dVisivel()"
          x-cloak>
          <header class="r7d-head">
            <span class="r7d-label">Últimos 7 dias</span>
            <span
              class="r7d-delta"
              :class="sinalClasse(json.ultimos_7d?.delta_patrim_brl)"
              x-text="formatDeltaR7d(json.ultimos_7d?.delta_patrim_brl, json.ultimos_7d?.delta_patrim_pct)"></span>
          </header>

          <div class="r7d-decomp">
            <div class="r7d-row">
              <span>Aportes líq.</span>
              <span
                :class="sinalClasse(json.ultimos_7d?.decomposicao?.aportes_liq_brl)"
                x-text="formatDecompR7d(json.ultimos_7d?.decomposicao?.aportes_liq_brl)"></span>
            </div>
            <div class="r7d-row">
              <span>Proventos</span>
              <span
                :class="sinalClasse(json.ultimos_7d?.decomposicao?.proventos_brl)"
                x-text="formatDecompR7d(json.ultimos_7d?.decomposicao?.proventos_brl)"></span>
            </div>
            <div class="r7d-row">
              <span>Mercado</span>
              <span
                :class="sinalClasse(json.ultimos_7d?.decomposicao?.mercado_brl)"
                x-text="formatDecompR7d(json.ultimos_7d?.decomposicao?.mercado_brl)"></span>
            </div>
          </div>

          <div class="r7d-listas">
            <div class="r7d-lista" data-list="compras" x-show="(json.ultimos_7d?.compras || []).length > 0">
              <h3>Compras</h3>
              <ul>
                <template x-for="(item, idx) in (json.ultimos_7d?.compras || [])" :key="'c-' + item.ticker + '-' + item.moeda + '-' + idx">
                  <li>
                    <span class="ticker" x-text="item.ticker"></span>
                    <span class="qty" x-text="formatQtyR7d(item.quantidade)"></span>
                    <span class="valor" x-text="formatBrl(item.valor_brl)"></span>
                    <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                  </li>
                </template>
              </ul>
            </div>
            <div class="r7d-lista" data-list="vendas" x-show="(json.ultimos_7d?.vendas || []).length > 0">
              <h3>Vendas</h3>
              <ul>
                <template x-for="(item, idx) in (json.ultimos_7d?.vendas || [])" :key="'v-' + item.ticker + '-' + item.moeda + '-' + idx">
                  <li>
                    <span class="ticker" x-text="item.ticker"></span>
                    <span class="qty" x-text="formatQtyR7d(item.quantidade)"></span>
                    <span class="valor" x-text="formatBrl(item.valor_brl)"></span>
                    <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                  </li>
                </template>
              </ul>
            </div>
            <div class="r7d-lista" data-list="proventos" x-show="(json.ultimos_7d?.proventos || []).length > 0">
              <h3>Proventos</h3>
              <ul>
                <template x-for="(item, idx) in (json.ultimos_7d?.proventos || [])" :key="'p-' + item.ticker + '-' + item.tipo + '-' + idx">
                  <li>
                    <span class="ticker" x-text="item.ticker"></span>
                    <span class="qty" x-text="abreviarTipoR7d(item.tipo)"></span>
                    <span class="valor" x-text="formatBrl(item.valor_brl)"></span>
                    <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                  </li>
                </template>
              </ul>
            </div>
          </div>
        </section>

        <section class="aporte-bloco" aria-label="Último aporte">
          <p class="aporte-label">Último aporte</p>
          <template x-if="json.ultimo_aporte">
            <div>
              <div class="aporte-header">
                <div class="aporte-header-left">
                  <span class="aporte-data" x-text="formatDataCurta(json.ultimo_aporte.data)"></span>
                  <span class="aporte-ha"
                    x-text="json.ultimo_aporte.dias_atras === 0 ? 'hoje' : 'há ' + json.ultimo_aporte.dias_atras + ' dia' + (json.ultimo_aporte.dias_atras === 1 ? '' : 's')">
                  </span>
                </div>
                <span class="aporte-pill" x-text="formatBrl(json.ultimo_aporte.total_brl)"></span>
              </div>
              <template x-for="item in json.ultimo_aporte.itens" :key="item.ticker">
                <a class="aporte-item aporte-item-link" :href="'#ativo/' + item.ticker">
                  <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                  <div class="aporte-detalhes">
                    <span class="aporte-ticker" x-text="item.ticker"></span>
                    <span class="aporte-meta"
                      x-text="item.quantidade + ' cota' + (item.quantidade === 1 ? '' : 's') + ' · ' + formatBrl(item.preco_unitario) + ' por unidade'">
                    </span>
                  </div>
                  <span class="aporte-valor" x-text="formatBrl(item.valor_brl)"></span>
                </a>
              </template>
            </div>
          </template>
          <template x-if="!json.ultimo_aporte">
            <p class="aporte-vazio">Nenhum aporte registrado.</p>
          </template>
        </section>

        <footer class="rodape">
          <p>Fonte: <code>investimentos.db</code> · doc-trail auditável</p>
          <button @click="bloquear" class="btn-bloquear" type="button">🔒 Bloquear sessão</button>
        </footer>
      </section>

      <section class="tela-detalhes tela-rentabilidade" x-show="rota === 'rentabilidade'" x-transition:enter.opacity.duration.220ms x-cloak>
        <header class="breadcrumb">
          <h1>Rentabilidade</h1>
        </header>

        <div class="escopo-toggle" role="tablist">
          <button
            data-escopo="Total" type="button"
            @click="selecionarEscopo('Total')"
            :class="{ active: escopoAtivo === 'Total' }">Total</button>
          <button
            data-escopo="Brasil" type="button"
            aria-label="Brasil"
            @click="selecionarEscopo('Brasil')"
            :class="{ active: escopoAtivo === 'Brasil' }"><span aria-hidden="true">🇧🇷</span> Brasil</button>
          <button
            data-escopo="EUA" type="button"
            aria-label="EUA"
            @click="selecionarEscopo('EUA')"
            :class="{ active: escopoAtivo === 'EUA' }"><span aria-hidden="true">🇺🇸</span> EUA</button>
        </div>

        <div class="moeda-toggle" role="tablist"
             x-show="moedaToggleVisivel()" x-cloak>
          <button
            data-moeda="BRL" type="button"
            @click="selecionarMoeda('BRL')"
            :class="{ active: moeda === 'BRL' }"
            aria-label="Mostrar carteira EUA em reais">BRL</button>
          <button
            data-moeda="USD" type="button"
            @click="selecionarMoeda('USD')"
            :class="{ active: moeda === 'USD' }"
            aria-label="Mostrar carteira EUA em dólares (paridade Avenue)">USD</button>
        </div>

        <p class="chart-rent-subtitulo" x-text="rentabilidadeSubtitulo" x-show="rentabilidadeSubtitulo"></p>
        <div id="chart-rent" class="chart-rent" aria-label="Histórico TWR"></div>

        <!-- 7a.L.2.b: 4º card "Período" — TWR/XIRR a.a. + vs benchmark calculados
             para a janela atual do dataZoom. fimIdx=null = chart ainda não
             hidratou → oculto. Título dinâmico: "Origem" (full range) ou
             "Período · mai/25 → mai/26". Usa classe própria .rent-periodo
             (não .rent-grupo) para preservar invariantes "3 grupos fixos"
             dos specs existentes — CSS espelha .rent-grupo intencionalmente. -->
        <section class="rent-periodo" x-show="periodoCustom.fimIdx !== null">
          <h3 class="rent-periodo-titulo" x-text="periodoCustom.titulo">Período</h3>
          <div class="rent-periodo-metrica">
            <span class="rent-periodo-label">XIRR a.a.</span>
            <span class="rent-periodo-valor"
                  x-text="periodoCustom.xirr === null ? '—' : formatPct(periodoCustom.xirr)"></span>
          </div>
          <div class="rent-periodo-metrica">
            <span class="rent-periodo-label">TWR a.a.</span>
            <span class="rent-periodo-valor"
                  x-text="periodoCustom.twr === null ? '—' : formatPct(periodoCustom.twr)"></span>
          </div>
          <!-- CRB 7a.L.2.b finding (general-swe #1, sev80): gate XIRR span
               em benchXirr !== null para evitar coerção `?? 0` que mostrava
               portfolio_xirr como "spread" quando Newton-Raphson não converge
               (janela curta, all-outflows). benchTwr puro vale por si só. -->
          <div class="rent-periodo-bench" x-show="periodoCustom.benchTwr !== null">
            <span class="bench-label" x-text="'vs ' + rentBenchNome()"></span>
            <span class="bench-valor">
              <template x-if="periodoCustom.benchXirr !== null && periodoCustom.xirr !== null">
                <span x-text="formatPct(periodoCustom.xirr - periodoCustom.benchXirr)"></span>
              </template>
              <template x-if="periodoCustom.benchXirr === null || periodoCustom.xirr === null">
                <span>—</span>
              </template>
              <template x-if="periodoCustom.twr !== null && periodoCustom.benchTwr !== null">
                <span class="bench-twr"
                      x-text="' · TWR ' + formatPct(periodoCustom.twr - periodoCustom.benchTwr)"></span>
              </template>
            </span>
          </div>
        </section>

        <div class="rent-grupos">
          <section class="rent-grupo">
            <h3 class="rent-grupo-titulo">Origem</h3>
            <div class="rent-metrica">
              <span class="rent-metrica-label">XIRR a.a.</span>
              <span class="rent-metrica-valor"
                    x-text="formatPct(rentabilidadeAtiva()?.xirr_origem)"></span>
            </div>
            <div class="rent-metrica">
              <span class="rent-metrica-label">TWR a.a.</span>
              <span class="rent-metrica-valor"
                    x-text="formatPct(rentabilidadeAtiva()?.twr_origem)"></span>
            </div>
            <template x-for="[bkey, bench] in Object.entries(rentabilidadeAtiva()?.benchmarks || {})" :key="bkey">
              <div class="rent-benchmark">
                <span class="bench-label" x-text="'vs ' + (bkey === 'SP500' ? 'S&P 500' : bkey)"></span>
                <span class="bench-valor">
                  <span x-text="formatPct(bench.xirr_espelhado?.origem)"></span>
                  <span class="bench-twr" x-text="' · TWR ' + formatPct(bench.twr_espelhado?.origem)"></span>
                </span>
              </div>
            </template>
          </section>
          <section class="rent-grupo">
            <h3 class="rent-grupo-titulo">Ano (YTD)</h3>
            <div class="rent-metrica">
              <span class="rent-metrica-label">XIRR</span>
              <span class="rent-metrica-valor"
                    x-text="formatPct(rentabilidadeAtiva()?.xirr_ytd)"></span>
            </div>
            <div class="rent-metrica">
              <span class="rent-metrica-label">TWR</span>
              <span class="rent-metrica-valor"
                    x-text="formatPct(rentabilidadeAtiva()?.twr_ytd)"></span>
            </div>
            <template x-for="[bkey, bench] in Object.entries(rentabilidadeAtiva()?.benchmarks || {})" :key="bkey">
              <div class="rent-benchmark">
                <span class="bench-label" x-text="'vs ' + (bkey === 'SP500' ? 'S&P 500' : bkey)"></span>
                <span class="bench-valor">
                  <span x-text="formatPct(bench.xirr_espelhado?.ytd)"></span>
                  <span class="bench-twr" x-text="' · TWR ' + formatPct(bench.twr_espelhado?.ytd)"></span>
                </span>
              </div>
            </template>
          </section>
          <section class="rent-grupo">
            <h3 class="rent-grupo-titulo">12 meses</h3>
            <div class="rent-metrica">
              <span class="rent-metrica-label">XIRR a.a.</span>
              <span class="rent-metrica-valor"
                    x-text="formatPct(rentabilidadeAtiva()?.xirr_12m)"></span>
            </div>
            <div class="rent-metrica">
              <span class="rent-metrica-label">TWR a.a.</span>
              <span class="rent-metrica-valor"
                    x-text="formatPct(rentabilidadeAtiva()?.twr_12m)"></span>
            </div>
            <template x-for="[bkey, bench] in Object.entries(rentabilidadeAtiva()?.benchmarks || {})" :key="bkey">
              <div class="rent-benchmark">
                <span class="bench-label" x-text="'vs ' + (bkey === 'SP500' ? 'S&P 500' : bkey)"></span>
                <span class="bench-valor">
                  <span x-text="formatPct(bench.xirr_espelhado?.['12m'])"></span>
                  <span class="bench-twr" x-text="' · TWR ' + formatPct(bench.twr_espelhado?.['12m'])"></span>
                </span>
              </div>
            </template>
          </section>
        </div>

        <details class="rent-legenda">
          <summary>Como ler</summary>
          <p><strong>XIRR:</strong> retorno anualizado considerando quando você aportou. Capta o efeito do timing dos aportes.</p>
          <p><strong>TWR:</strong> retorno anualizado ignorando seus aportes. Mede só a qualidade da seleção e gestão.</p>
        </details>
      </section>

      <section class="tela-detalhes tela-alocacao" x-show="rota === 'alocacao'" x-transition:enter.opacity.duration.220ms x-cloak>
        <header class="breadcrumb">
          <h1>Alocação</h1>
        </header>

        <div class="aloca-segmented" role="tablist" aria-label="Vista de alocação">
          <button type="button" role="tab"
                  :aria-selected="vAloca === 'atual'"
                  :class="vAloca === 'atual' ? 'is-ativo' : ''"
                  @click="selecionarVistaAloca('atual')">Atual</button>
          <button type="button" role="tab"
                  :aria-selected="vAloca === 'alvo'"
                  :class="vAloca === 'alvo' ? 'is-ativo' : ''"
                  @click="selecionarVistaAloca('alvo')">Alvo</button>
        </div>

        <div class="aloca-vista" x-show="vAloca === 'atual'" x-cloak>
          <div class="alocacao-card">
            <template x-for="classe in ['EUA', 'FIIs', 'Renda Fixa BR', 'Ações BR', 'Cripto']" :key="classe">
              <div class="classe-bloco">
                <div
                  class="classe-row"
                  :data-classe="classe"
                  @click="expandirClasse(classe)"
                  role="button"
                  tabindex="0"
                  @keydown.enter.prevent="expandirClasse(classe)"
                  @keydown.space.prevent="expandirClasse(classe)">
                  <span class="classe-dot" :class="'dot-' + classe.toLowerCase().replace(/\s+/g, '-').replace(/ç/g, 'c').replace(/õ/g, 'o').replace(/é/g, 'e')"></span>
                  <span class="classe-nome" x-text="classe"></span>
                  <span class="classe-pct">
                    <span x-text="formatPctSemSinal(pctAtualClasse(classe))"></span>
                    <span class="alvo-pct">alvo <span x-text="formatPctSemSinal(pctAlvoClasse(classe))"></span></span>
                  </span>
                  <span class="classe-arrow" x-text="classeExpandida === classe ? '▾' : '▸'"></span>
                </div>
                <div
                  class="classe-tickers"
                  :data-classe="classe"
                  x-show="classeExpandida === classe"
                  x-cloak>
                  <template x-for="p in tickersComPesos(classe)" :key="p.ticker">
                    <a :href="'#ativo/' + p.ticker" class="ticker-row">
                      <span class="flag" aria-hidden="true" x-text="p.bandeira"></span>
                      <span class="ticker-name" x-text="p.ticker"></span>
                      <span class="ticker-vm" x-text="formatBrl(p.valor_mercado_brl)"></span>
                      <span class="ticker-pct" x-text="formatPctSemSinal(p.peso_na_classe)"></span>
                    </a>
                  </template>
                  <p class="ticker-empty" x-show="tickersComPesos(classe).length === 0">
                    Nenhum ativo nesta classe.
                  </p>
                </div>
              </div>
            </template>
          </div>
        </div>

        <div class="aloca-vista aloca-alvo__list" x-show="vAloca === 'alvo'" x-cloak>
          <p class="politica-intro" x-show="!json || !json.politica || !json.politica.categorias.length">
            Política não publicada ainda.
          </p>

          <template x-for="cat in (json && json.politica && json.politica.categorias) || []" :key="cat.nome">
            <article class="aloca-alvo__card" :style="catStyleVar(cat.nome)">
              <header class="aloca-alvo__head">
                <div class="aloca-alvo__lead">
                  <span class="aloca-alvo__overline">Categoria</span>
                  <span class="aloca-alvo__nome" x-text="cat.nome"></span>
                  <span class="aloca-alvo__alvo-label">Alvo</span>
                  <span class="aloca-alvo__alvo-big">
                    <span x-text="formatPctSemSinal(cat.peso_alvo).replace(/\s*%$/, '')"></span><span class="pct">%</span>
                  </span>
                </div>
                <div class="aloca-alvo__breakdown">
                  <span class="aloca-alvo__atual">
                    <span class="lab">atual</span>&nbsp;<span x-text="formatPctSemSinal(cat.peso_atual)"></span>
                  </span>
                  <span class="aloca-alvo__drift"
                        :class="{
                          'aloca-alvo__drift--under': formatDelta(cat.drift).classe === 'under',
                          'aloca-alvo__drift--over':  formatDelta(cat.drift).classe === 'over',
                          'aloca-alvo__drift--hold':  formatDelta(cat.drift).classe === 'hold'
                        }">
                    <span x-text="formatDelta(cat.drift).arrow"></span>&nbsp;<span x-text="formatDelta(cat.drift).texto"></span>
                  </span>
                </div>
              </header>

              <div class="aloca-alvo__trilha-cat">
                <div class="fill"
                     :class="catIsOver(cat) && 'fill--over'"
                     :style="`--fill-pct: ${catFillPct(cat)};`"></div>
                <div class="marker"
                     :style="catIsOver(cat) ? `left: ${markerLeftOver(cat.peso_alvo, cat.peso_atual)};` : 'left: 100%;'"></div>
              </div>
              <div class="aloca-alvo__trilha-cat-foot">
                <span>0 %</span>
                <span x-text="catIsOver(cat)
                              ? formatPctSemSinal(cat.peso_atual) + ' (acima do alvo)'
                              : formatPctSemSinal(cat.peso_alvo) + ' (alvo)'"></span>
              </div>

              <template x-for="bucket in (cat.buckets || [])" :key="bucket.tipo">
                <section class="aloca-alvo__cesta">
                  <div class="aloca-alvo__cesta-head">
                    <div>
                      <div class="aloca-alvo__clabel" x-text="labelCestaTipo(bucket.tipo)"></div>
                      <div class="aloca-alvo__cmeta"
                           x-text="bucket.tipo === 'passive'
                                   ? 'peso fixo intra-categoria'
                                   : (bucket.ativos.length + ' ativos · equal-weight')"></div>
                    </div>
                    <div class="aloca-alvo__cnum">
                      <span x-text="formatPctSemSinal(bucket.peso_atual_bucket).replace(/\s*%$/, '')"></span>
                      <span class="of">&nbsp;de&nbsp;</span>
                      <span x-text="formatPctSemSinal(bucket.peso_bucket)"></span>
                    </div>
                  </div>

                  <div class="aloca-alvo__cesta-trilha">
                    <div class="fill"
                         :class="cestaIsOver(bucket) && 'fill--over'"
                         :style="`--fill-pct: ${cestaFillPct(bucket)};`"></div>
                    <div class="marker"
                         :style="cestaIsOver(bucket) ? `left: ${markerLeftOver(bucket.peso_bucket, bucket.peso_atual_bucket)};` : 'left: 100%;'"></div>
                  </div>

                  <div class="aloca-alvo__ativos">
                    <template x-for="ativo in bucket.ativos" :key="ativo.ticker">
                      <a :href="'#ativo/' + ativo.ticker" class="aloca-alvo__ativo">
                        <span class="flag" aria-hidden="true" x-text="ativo.bandeira"></span>
                        <div class="aloca-alvo__ativo-body">
                          <div class="aloca-alvo__ativo-row1">
                            <span class="aloca-alvo__ticker" x-text="ativo.ticker"></span>
                            <span class="aloca-alvo__ativo-sub">
                              <span x-text="formatPctSemSinal(ativo.peso_intra_atual)"></span>
                              <span>&nbsp;de&nbsp;</span>
                              <span x-text="formatPctSemSinal(ativo.peso_intra)"></span>
                              <span>&nbsp;na cesta</span>
                            </span>
                          </div>
                          <div class="aloca-alvo__minibar">
                            <div class="fill"
                                 :class="ativoIsOver(ativo) && 'fill--over'"
                                 :style="`--fill-pct: ${ativoFillPct(ativo)};`"></div>
                            <div class="marker"
                                 :style="ativoIsOver(ativo) ? `left: ${markerLeftOver(ativo.peso_intra, ativo.peso_intra_atual)};` : 'left: 100%;'"></div>
                          </div>
                        </div>
                        <span class="aloca-alvo__delta"
                              :class="{
                                'aloca-alvo__delta--under': formatDelta(ativo.drift_intra).classe === 'under',
                                'aloca-alvo__delta--over':  formatDelta(ativo.drift_intra).classe === 'over',
                                'aloca-alvo__delta--hold':  formatDelta(ativo.drift_intra).classe === 'hold'
                              }">
                          <span class="arrow" x-text="formatDelta(ativo.drift_intra).arrow"></span>
                          <span x-text="formatDelta(ativo.drift_intra).texto"></span>
                        </span>
                      </a>
                    </template>
                  </div>
                </section>
              </template>
            </article>
          </template>
        </div>
      </section>

      <section class="tela-detalhes tela-ativo" x-show="rota === 'ativo'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1 x-text="tickerAtual"></h1>
        </header>

        <template x-if="!posicaoAtual">
          <div class="erro-nao-encontrado">
            <p>Ativo <strong x-text="tickerAtual"></strong> não encontrado na carteira.</p>
            <a href="#alocacao">← Voltar para Alocação</a>
          </div>
        </template>

        <template x-if="posicaoAtual">
          <div class="ativo-corpo">
            <div class="ticker-hero">
              <h2>
                <span class="flag" aria-hidden="true" x-text="bandeiraDaPosicao(posicaoAtual)"></span>
                <span x-text="posicaoAtual.ticker"></span>
              </h2>
              <p class="ticker-classe" x-text="posicaoAtual.classe"></p>
              <p class="ticker-vm-grande" x-text="formatBrl(posicaoAtual.valor_mercado_brl)"></p>
            </div>

            <div class="kpi-grid">
              <div class="kpi">
                <span class="kpi-label">Quantidade</span>
                <span class="kpi-valor" x-text="formatQtyR7d(posicaoAtual.quantidade)"></span>
              </div>
              <div class="kpi">
                <span class="kpi-label">Custo médio</span>
                <span class="kpi-valor" x-text="formatBrl(posicaoAtual.custo_medio)"></span>
              </div>
              <div class="kpi">
                <span class="kpi-label">Último preço</span>
                <span class="kpi-valor" x-text="formatBrl(posicaoAtual.ultimo_preco)"></span>
              </div>
              <div class="kpi">
                <span class="kpi-label">Ganho / perda</span>
                <span
                  class="kpi-valor"
                  :class="(posicaoAtual.ganho_perda_brl ?? 0) < 0 && 'is-neg'"
                  x-text="formatBrl(posicaoAtual.ganho_perda_brl)"></span>
              </div>
              <div class="kpi">
                <span class="kpi-label">Ganho %</span>
                <span
                  class="kpi-valor"
                  :class="(posicaoAtual.ganho_perda_pct ?? 0) < 0 && 'is-neg'"
                  x-text="formatPct(posicaoAtual.ganho_perda_pct)"></span>
              </div>
              <div class="kpi">
                <span class="kpi-label">XIRR</span>
                <span class="kpi-valor" x-text="formatPct(posicaoAtual.xirr_aa)"></span>
              </div>
            </div>

            <h3 class="ativo-section-h">Movimentos · últimos 12 meses</h3>
            <template x-if="(posicaoAtual.movimentos || []).length === 0">
              <p class="vazio">Nenhum movimento registrado.</p>
            </template>
            <template x-if="(posicaoAtual.movimentos || []).length > 0">
              <div class="tabela-wrap">
                <table class="tabela-movimentos">
                  <thead>
                    <tr><th scope="col">Data</th><th scope="col">Lado</th><th scope="col">Qty</th><th scope="col">Preço</th><th scope="col">Total</th></tr>
                  </thead>
                  <tbody>
                    <template
                      x-for="(m, idx) in posicaoAtual.movimentos"
                      :key="m.data + '-' + m.lado + '-' + idx">
                      <tr>
                        <td x-text="m.data"></td>
                        <td>
                          <span
                            class="lado-pill"
                            :class="formatarLado(m.lado).classe"
                            :title="m.lado"
                            x-text="formatarLado(m.lado).texto"></span>
                        </td>
                        <td class="num" x-text="formatQtyR7d(m.quantidade)"></td>
                        <td class="num" x-text="formatBrl(m.preco_unitario)"></td>
                        <td class="num" x-text="formatBrl(m.total_brl)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>

            <h3 class="ativo-section-h">Proventos · últimos 12 meses</h3>
            <template x-if="(posicaoAtual.proventos || []).length === 0">
              <p class="vazio">Nenhum provento registrado.</p>
            </template>
            <template x-if="(posicaoAtual.proventos || []).length > 0">
              <div class="tabela-wrap">
                <table class="tabela-proventos">
                  <thead>
                    <tr><th scope="col">Data</th><th scope="col">Valor</th><th scope="col">Tipo</th></tr>
                  </thead>
                  <tbody>
                    <template
                      x-for="(pr, idx) in posicaoAtual.proventos"
                      :key="pr.data_pagamento + '-' + idx">
                      <tr>
                        <td x-text="pr.data_pagamento"></td>
                        <td class="num" x-text="formatBrl(pr.valor_liquido_brl)"></td>
                        <td x-text="pr.tipo"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
          </div>
        </template>
      </section>

      <!-- ── Tela #proventos ──────────────────────────────────────────── -->
      <section class="tela-detalhes tela-proventos" x-show="rota === 'proventos'" x-transition:enter.opacity.duration.220ms x-cloak>
        <header class="breadcrumb">
          <h1>Proventos</h1>
        </header>

        <!-- 7a.E.24: bloco Dividend Yield (trailing-12m) — total + 3 sub-escopos -->
        <section
          class="dy-bloco"
          data-testid="dy-bloco"
          role="group"
          aria-labelledby="dy-eyebrow"
          x-show="json?.dividend_yield">
          <dl class="dy-dl">
            <!-- Total (carteira) — número-poster -->
            <div class="dy-total" data-testid="dy-total">
              <dt class="dy-eyebrow" id="dy-eyebrow">Dividend Yield</dt>
              <dd class="dy-total-corpo">
                <span class="dy-total-valor" x-text="formatPctSemSinal(json?.dividend_yield?.total?.dy, 1)"></span>
                <span class="dy-total-meta">
                  <span class="flag" aria-hidden="true">🌍</span>
                  <span class="dy-total-label">Carteira</span>
                </span>
              </dd>
              <p class="dy-caption">Proventos dos últimos 12 meses ÷ valor de mercado</p>
            </div>

            <!-- 3 sub-escopos -->
            <div class="dy-sub">
              <div class="dy-stat" data-testid="dy-acao_br">
                <dt class="dy-stat-label">
                  <span class="flag" aria-hidden="true">🇧🇷</span>
                  <span>Ação BR</span>
                </dt>
                <dd class="dy-stat-valor" x-text="formatPctSemSinal(json?.dividend_yield?.acao_br?.dy, 1)"></dd>
              </div>
              <div class="dy-stat" data-testid="dy-fii">
                <dt class="dy-stat-label">
                  <span class="flag" aria-hidden="true">🇧🇷</span>
                  <span>FII</span>
                </dt>
                <dd class="dy-stat-valor" x-text="formatPctSemSinal(json?.dividend_yield?.fii?.dy, 1)"></dd>
              </div>
              <div class="dy-stat" data-testid="dy-eua">
                <dt class="dy-stat-label">
                  <span class="flag" aria-hidden="true">🇺🇸</span>
                  <span>EUA</span>
                </dt>
                <dd class="dy-stat-valor" x-text="formatPctSemSinal(json?.dividend_yield?.eua?.dy, 1)"></dd>
                <p class="dy-stat-caption">em USD<span class="sr-only"> (em dólar)</span></p>
              </div>
            </div>
          </dl>
        </section>

        <div class="kpi-grid kpi-grid-3">
          <div class="kpi">
            <span class="kpi-label">YTD <span x-text="anoCorrente"></span></span>
            <span class="kpi-valor" x-text="formatBrl(json?.proventos?.ytd_brl)"></span>
          </div>
          <div class="kpi">
            <span class="kpi-label"><span x-text="anoAnterior"></span></span>
            <span class="kpi-valor" x-text="formatBrl(json?.proventos?.ano_anterior_brl)"></span>
          </div>
          <div class="kpi">
            <span class="kpi-label">Total Origem</span>
            <span class="kpi-valor" x-text="formatBrl(totalProventosOrigem)"></span>
          </div>
        </div>

        <div class="escopo-toggle" role="tablist" aria-label="Período">
          <button
            type="button"
            role="tab"
            :aria-selected="proventosToggle === 'origem'"
            :class="{ active: proventosToggle === 'origem' }"
            @click="setProventosToggle('origem')">Origem</button>
          <button
            type="button"
            role="tab"
            :aria-selected="proventosToggle === 'mensal'"
            :class="{ active: proventosToggle === 'mensal' }"
            @click="setProventosToggle('mensal')">Mensal (12m)</button>
        </div>

        <div id="proventos-grafico" class="chart-rent" aria-label="Evolução de proventos"></div>

        <!-- 7a.E.18: hint quando há mês selecionado -->
        <div class="proventos-hint-limpar" id="proventosHintLimpar" hidden>
          Toque na mesma barra ou pressione Esc para limpar
        </div>

        <!-- 7a.E.18: lista a11y visualmente oculta com 12 botões focáveis -->
        <ul class="proventos-meses-a11y" id="proventosMesesA11y" role="list" aria-label="Meses dos últimos 12 meses"></ul>

        <h3 class="ativo-section-h" :class="{ filtrada: proventosToggle === 'mensal' && proventosMesSelecionado !== null }">
          <template x-if="proventosToggle === 'mensal' && proventosMesSelecionado !== null">
            <span>Por ativo · <strong x-text="proventosMesLabel()"></strong></span>
          </template>
          <template x-if="!(proventosToggle === 'mensal' && proventosMesSelecionado !== null)">
            <span>Por ativo · <span x-text="proventosToggle === 'mensal' ? 'últimos 12 meses' : 'desde a Origem'"></span></span>
          </template>
        </h3>
        <template x-if="tabelaProventosAtual().length === 0">
          <p class="vazio">Nenhum dado disponível.</p>
        </template>
        <template x-if="tabelaProventosAtual().length > 0">
          <div class="tabela-wrap">
            <table class="tabela-proventos" aria-label="Proventos por ativo">
              <thead>
                <tr>
                  <th scope="col">Ticker</th>
                  <th scope="col" class="num">Total</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="item in tabelaProventosAtual()" :key="item.ticker">
                  <tr
                    class="row-link"
                    tabindex="0"
                    role="link"
                    :aria-label="'Ver ativo ' + item.ticker"
                    @click="location.hash = 'ativo/' + item.ticker"
                    @keydown.enter="location.hash = 'ativo/' + item.ticker"
                    @keydown.space.prevent="location.hash = 'ativo/' + item.ticker">
                    <td>
                      <span class="flag" aria-hidden="true" x-text="item.bandeira"></span>
                      <span x-text="item.ticker"></span>
                    </td>
                    <td class="num" x-text="formatBrl(item.total)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </section>

      <!-- ── Tela #patrimonio ─────────────────────────────────────────── -->
      <section class="tela-detalhes tela-patrimonio" x-show="rota === 'patrimonio'"
        x-transition:enter="push-enter"
        x-transition:enter-start="push-from-right"
        x-transition:enter-end="push-at-rest"
        x-cloak>
        <header class="breadcrumb">
          <button aria-label="Voltar" @click="voltar()" type="button">←</button>
          <h1>Histórico patrimonial</h1>
        </header>

        <div class="kpi-grid kpi-stack">
          <div class="kpi">
            <span class="kpi-label">Patrimônio atual</span>
            <span class="kpi-valor" x-text="formatBrl(patrimonioAtual())"></span>
            <span class="kpi-descricao">Valor de mercado consolidado da carteira (Brasil + EUA) na data mais recente.</span>
          </div>
          <div class="kpi">
            <span class="kpi-label">Aporte cumulativo</span>
            <span class="kpi-valor" x-text="formatBrl(aporteCumulativo())"></span>
            <span class="kpi-descricao">Soma de todos os aportes desde a Origem (compras de ativos em R$, FX-aplicado para EUA).</span>
          </div>
          <div class="kpi">
            <span class="kpi-label">Retorno acumulado</span>
            <span class="kpi-valor" x-text="formatBrl(retornoAcumuladoBrl())"></span>
            <span class="kpi-meta" x-text="retornoAcumuladoPctTexto()"></span>
            <span class="kpi-descricao">Diferença entre patrimônio atual e aporte cumulativo. Mede ganho ou perda total da carteira.</span>
          </div>
        </div>

        <div id="patrimonio-grafico" class="chart-rent" aria-label="Evolução de patrimônio e aportes"></div>
      </section>

      <!-- ── Tela #aportar (Fase 7a.H.1) ──────────────────────────────── -->
      <section class="tela-detalhes tela-aportar" x-show="rota === 'aportar'" x-transition:enter.opacity.duration.220ms x-cloak>
        <header class="breadcrumb">
          <h1>Próximo aporte</h1>
        </header>

        <div class="aporte-input-block">
          <label for="aporte-valor" class="aporte-label">Valor disponível</label>
          <input
            id="aporte-valor"
            type="text"
            inputmode="decimal"
            class="aporte-input"
            placeholder="R$ 0,00"
            x-model="aporteValor"
            @input.debounce.150ms="recalcularAporte"
            autocomplete="off">
          <p class="aporte-helper" x-text="aporteHelperText()"></p>
        </div>

        <div class="aporte-banner" x-show="aporteBanner" x-cloak>
          <p x-text="aporteBanner"></p>
        </div>

        <template x-for="cat in aporteCategoriasRecebedoras" :key="cat.nome">
          <article class="card aporte-card">
            <header class="aporte-cat-head">
              <span class="aporte-cat-name" x-text="cat.nome"></span>
              <span class="aporte-cat-tag" x-text="cat.tag"></span>
            </header>
            <div class="aloc-trilha aporte-trilha">
              <div class="aloc-preenchimento"
                   :style="`width: ${Math.min(Math.max(cat.atualPct, 0), 100)}%; background: var(--g-700)`"></div>
              <div class="aporte-trilha-delta"
                   :style="`left: ${Math.min(Math.max(cat.atualPct, 0), 100)}%; width: ${Math.min(cat.deltaPct, 100 - cat.atualPct)}%`"></div>
              <div class="aloc-alvo"
                   x-show="cat.alvoPct > 0"
                   :style="`left: ${Math.min(Math.max(cat.alvoPct, 0), 100)}%`"></div>
            </div>
            <p class="aporte-trilha-line">
              <span x-text="`${cat.atualPct.toFixed(1).replace('.', ',')}% → ${cat.posPct.toFixed(1).replace('.', ',')}%`"></span>
              <span x-text="`alvo ${cat.alvoPct}% · fecha ${cat.deltaPct.toFixed(1).replace('.', ',')}pp`"></span>
            </p>
            <ul class="aporte-compras">
              <template x-for="row in cat.compras" :key="row.ticker">
                <li class="aporte-compra-row">
                  <span class="flag" :aria-label="row.bandeiraLabel" x-text="row.bandeira"></span>
                  <span class="aporte-compra-main">
                    <span class="aporte-compra-tk" x-text="row.ticker"></span>
                    <span class="aporte-compra-sub" x-text="`${row.tipoLabel} · ${row.pesoIntraPct}% do bucket`"></span>
                  </span>
                  <span class="aporte-compra-qty-block">
                    <span class="aporte-compra-qty" x-text="row.cotasFormatadas"></span>
                    <span class="aporte-compra-qty-sub" x-text="row.valorFormatado"></span>
                  </span>
                </li>
              </template>
            </ul>
          </article>
        </template>

        <section class="aporte-outras" x-show="aporteCategoriasNaoRecebedoras.length > 0" x-cloak>
          <h2 class="aporte-section-label">Outras categorias (sem aporte)</h2>
          <template x-for="cat in aporteCategoriasNaoRecebedoras" :key="cat.nome">
            <p class="aporte-outras-row">
              <span x-text="`▸ ${cat.nome}`"></span>
              <span x-text="`${cat.atualPct.toFixed(1).replace('.', ',')}% · alvo ${cat.alvoPct}% (${cat.label})`"></span>
            </p>
          </template>
        </section>

        <section class="aporte-quarentena" x-show="aporteQuarentena.length > 0" x-cloak>
          <p>
            <strong>Quarentena (não aporta)</strong><br>
            <template x-for="(ticker, i) in aporteQuarentena" :key="ticker">
              <span>
                <span class="aporte-quarentena-tk" x-text="ticker"></span>
                <span x-show="i < aporteQuarentena.length - 1"> · </span>
              </span>
            </template>
          </p>
        </section>

        <p class="aporte-sem-posicao" x-show="aporteTickersSemPosicao.length > 0" x-cloak>
          <span>Tickers da política sem posição vigente (sem cotação para incluir no cálculo): </span>
          <span x-text="aporteTickersSemPosicao.join(', ')"></span>
        </p>
      </section>

      </div>
    </template>

    <template x-if="fase === 'raiox'">
      <nav class="tab-bar" role="navigation" aria-label="Navegação principal">
        <span class="tab-bar-indicator" aria-hidden="true"></span>
        <a href="#" data-tab="raiox" :aria-current="tab === 'raiox' ? 'page' : null" @click.prevent="rota = ''; tab = 'raiox'; history.replaceState(null, '', location.pathname)">raio-x</a>
        <a href="#rentabilidade" data-tab="rentab" :aria-current="tab === 'rentab' ? 'page' : null">rent</a>
        <a href="#alocacao" data-tab="aloca" :aria-current="tab === 'aloca' ? 'page' : null">aloca</a>
        <a href="#proventos" data-tab="provent" :aria-current="tab === 'provent' ? 'page' : null">prov</a>
        <a href="#aportar" data-tab="aportar" :aria-current="tab === 'aportar' ? 'page' : null">apt</a>
      </nav>
    </template>
  </main>
</body>
</html>
