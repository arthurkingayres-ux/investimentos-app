name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Fixado: ubuntu-latest virou 26.04 em out/2026 e o Playwright 1.59 nao instala
    # chromium nele ("does not support chromium on ubuntu26.04-x64"). Soltar quando
    # o @playwright/test subir para uma versao que suporte 26.04.
    runs-on: ubuntu-24.04
    # Teto (7a.BW.3): repo privado gasta a cota da conta; verde leva 7-10 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Historico completo: tests/e2e/cache-bust.spec.ts le o git log e
          # recusa clone raso (sem historico o guard passaria vacuo).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Node deps
        run: npm ci

      # 7a.BW.5: rotas do Comite no Worker (node --test, sem rede nem browser).
      - name: Worker tests
        run: npm run test:worker

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # A pilha sans do app e so de fontes do sistema (-apple-system, "SF Pro Text",
      # "Segoe UI", system-ui, sans-serif). No Ubuntu nenhuma existe e o Chromium cai
      # na DejaVu Sans, bem mais larga: os testes de forma a 320/375 px (7a.BR.2,
      # BS.2, BU) ficavam vermelhos so aqui, verdes no Windows. Selawik e a substituta
      # metrica open-source da Segoe UI (Microsoft); com ela o runner mede o que se
      # mede localmente. A mono nao precisa: DejaVu Sans Mono ja passa.
      - name: Install Selawik (Segoe UI metrics) as default sans
        run: |
          curl -fsSL -o /tmp/selawik.zip https://github.com/microsoft/Selawik/releases/download/1.01/Selawik_Release.zip
          echo "3f62c51e05e3b5a1e6241cf92a371f0be2ea1183aa87b30718bbd40832a8d423  /tmp/selawik.zip" | sha256sum -c -
          mkdir -p ~/.local/share/fonts ~/.config/fontconfig
          unzip -o -j /tmp/selawik.zip '*.ttf' -d ~/.local/share/fonts/
          cat > ~/.config/fontconfig/fonts.conf <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="strong"><family>sans-serif</family><prefer><family>Selawik</family></prefer></alias>
            <alias binding="strong"><family>system-ui</family><prefer><family>Selawik</family></prefer></alias>
            <alias binding="strong"><family>Segoe UI</family><prefer><family>Selawik</family></prefer></alias>
          </fontconfig>
          EOF
          fc-cache -f
          fc-match sans-serif
          fc-match system-ui
          test "$(fc-match -f '%{family[0]}' sans-serif)" = "Selawik"

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  pii-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run PII scanner (recursivo, mode=audit)
        run: python tests/pii/check_pii.py --mode audit --path .
