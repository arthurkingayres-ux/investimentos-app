name: Alerta de falha

# `workflow_run` e SAME-REPO: este arquivo existe tambem no repo principal
# `investimentos`, com a lista de la (os 2 crons).
#
# `workflows:` e lista de nomes LITERAIS, sem glob documentado — entao este
# observador TAMBEM e enumeracao, e workflow novo nasce mudo ate alguem
# acrescentar o nome. A vantagem que sobra, e basta, e centralizar a logica e os
# secrets num lugar so, em vez de espalhar um passo `if: failure()` por workflow.
#
# `pages build and deployment` SAIU desta lista em 07/08/2026, e a saida e o
# achado da sub-fase: MEDIDO que `workflow_run` NAO o observa. O Pages concluiu
# 10:51:34Z e nenhum run deste workflow apareceu nos 3,7 min seguintes; o CI
# concluiu 10:55:16Z e o run nasceu 10:55:18Z, 2 segundos depois. O nome literal
# foi conferido contra a API antes do teste e batia byte a byte, entao nao era
# typo — e job pulado por `if:` CRIA run listavel (`conclusion: skipped`),
# provado no mesmo experimento, entao a ausencia e informativa e nao ambigua.
#
# Manter o nome aqui seria DECLARAR uma cobertura que nao existe — a mesma falsa
# confianca do canal nativo do GitHub, que esta fase existe para nao repetir. O
# Pages vai pelo `watchdog-pages.yml`, que PERGUNTA em vez de esperar o evento.
#
# `Watchdog do Pages` entra na lista porque um vigia que morre em silencio nao
# vigia nada.
on:
  workflow_run:
    workflows:
      - "CI"
      - "Watchdog do Pages"
    types: [completed]

permissions:
  contents: read

jobs:
  alertar:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enviar alerta
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          ALERTA_REPO: ${{ github.event.workflow_run.repository.full_name }}
          ALERTA_WORKFLOW: ${{ github.event.workflow_run.name }}
          ALERTA_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ALERTA_RUN_URL: ${{ github.event.workflow_run.html_url }}
          ALERTA_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          ALERTA_EVENT: ${{ github.event.workflow_run.event }}
        run: python scripts/ci/alertar_falha.py
