name: Alerta de falha

# `workflow_run` e SAME-REPO: este arquivo existe tambem no repo principal
# `investimentos`, com a lista de la (os 2 crons).
#
# `workflows:` e lista de nomes LITERAIS, sem glob documentado — entao este
# observador TAMBEM e enumeracao, e workflow novo nasce mudo ate alguem
# acrescentar o nome. A vantagem que sobra, e basta, e centralizar a logica e os
# secrets num lugar so, em vez de espalhar um passo `if: failure()` por workflow.
#
# O Pages e enumerado como `pages-build-deployment` — COM HIFENS, e isso e o
# achado que custou uma conclusao errada em 07/08/2026. O workflow dinamico tem
# DOIS nomes conforme o endpoint que o devolve:
#
#   /actions/workflows  ->  name: "pages-build-deployment"    (hifens)
#   /actions/runs       ->  name: "pages build and deployment" (espacos)
#
# `workflow_run` casa pelo nome do WORKFLOW. A primeira versao deste arquivo
# usava a forma com espacos — o nome do RUN —, e a sonda concluiu que
# "workflow_run nao observa o Pages". Errado: o nome e que estava errado, e o
# erro se manifesta como SILENCIO, indistinguivel de "o GitHub nao emite isto".
# Conferir "o nome literal contra a API" nao basta se for no endpoint errado.
#
# `Watchdog do Pages` tambem entra: um vigia que morre em silencio nao vigia
# nada, e ele cobre o buraco que o evento nao cobre (ver watchdog-pages.yml).
on:
  workflow_run:
    workflows:
      - "CI"
      - "Watchdog do Pages"
      - "pages-build-deployment"
    types: [completed]

permissions:
  contents: read

jobs:
  alertar:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enviar alerta
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          ALERTA_REPO: ${{ github.event.workflow_run.repository.full_name }}
          ALERTA_WORKFLOW: ${{ github.event.workflow_run.name }}
          ALERTA_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ALERTA_RUN_URL: ${{ github.event.workflow_run.html_url }}
          ALERTA_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          ALERTA_EVENT: ${{ github.event.workflow_run.event }}
        run: python scripts/ci/alertar_falha.py
